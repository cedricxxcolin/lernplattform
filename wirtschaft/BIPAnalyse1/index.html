<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIP-Mission – Lehrerdashboard</title>

<style>
:root{
  --bg:#f3f6fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --blue:#2563eb;
  --blue-soft:#dbeafe;
  --green:#16a34a;
  --green-soft:#dcfce7;
  --orange:#f59e0b;
  --orange-soft:#fef3c7;
  --red:#dc2626;
  --red-soft:#fee2e2;
  --gray:#64748b;
  --gray-soft:#f1f5f9;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:white;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:20;
}

.wrap{
  max-width:1450px;
  margin:0 auto;
  padding:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}

h1{
  margin:0;
  font-size:1.7rem;
}

.subtitle{
  color:var(--muted);
  margin:.25rem 0 0;
}

main{
  max-width:1450px;
  margin:0 auto;
  padding:18px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
  border:1px solid var(--line);
  margin-bottom:18px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;
  align-items:end;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,select{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:11px 12px;
  font-size:1rem;
  background:white;
}

button{
  border:none;
  border-radius:12px;
  background:var(--blue);
  color:white;
  padding:11px 14px;
  cursor:pointer;
  font-weight:bold;
  font-size:.95rem;
}

button:hover{
  filter:brightness(.96);
}

button.secondary{
  background:#e5e7eb;
  color:#111827;
}

button.green{
  background:var(--green);
}

button.orange{
  background:var(--orange);
}

button.red{
  background:var(--red);
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

.tab{
  background:#eef2ff;
  color:#1e3a8a;
}

.tab.active{
  background:var(--blue);
  color:white;
}

.statusline{
  color:var(--muted);
  font-size:.92rem;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
}

.kpi{
  background:linear-gradient(135deg,#ffffff,#f8fafc);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
}

.kpi .value{
  font-size:2rem;
  font-weight:bold;
  margin-top:6px;
}

.kpi .label{
  color:var(--muted);
  font-weight:bold;
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:16px;
  max-height:70vh;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
  background:white;
}

th,td{
  border-bottom:1px solid var(--line);
  padding:10px 11px;
  text-align:left;
  vertical-align:top;
  font-size:.92rem;
}

th{
  background:#f8fafc;
  position:sticky;
  top:0;
  z-index:5;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}

tr:hover td{
  background:#f8fafc;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  padding:4px 9px;
  font-weight:bold;
  font-size:.84rem;
  white-space:nowrap;
}

.good{
  background:var(--green-soft);
  color:var(--green);
}

.mid{
  background:var(--orange-soft);
  color:#92400e;
}

.bad{
  background:var(--red-soft);
  color:var(--red);
}

.neutral{
  background:var(--gray-soft);
  color:var(--gray);
}

.blue{
  background:var(--blue-soft);
  color:#1d4ed8;
}

.progress{
  width:130px;
  height:12px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  display:inline-block;
  vertical-align:middle;
  margin-right:8px;
}

.progress > div{
  height:100%;
  background:var(--blue);
}

.progress.good > div{
  background:var(--green);
}

.progress.mid > div{
  background:var(--orange);
}

.progress.bad > div{
  background:var(--red);
}

.problem-row td{
  background:#fff7ed;
}

.critical-row td{
  background:#fff1f2;
}

.small{
  color:var(--muted);
  font-size:.86rem;
}

.hidden{
  display:none!important;
}

.errorbox{
  background:var(--red-soft);
  color:#991b1b;
  border:1px solid #fecaca;
  padding:12px;
  border-radius:14px;
  margin-top:12px;
  white-space:pre-wrap;
}

.okbox{
  background:var(--green-soft);
  color:#166534;
  border:1px solid #bbf7d0;
  padding:12px;
  border-radius:14px;
  margin-top:12px;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:12px;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

@media print{
  header,.controls,.tabs,.toolbar button{
    display:none!important;
  }
  body{
    background:white;
  }
  .card{
    box-shadow:none;
    border:1px solid #ccc;
  }
}
</style>
</head>

<body>

<header>
  <div class="wrap top">
    <div>
      <h1>BIP-Mission – Lehrerdashboard</h1>
      <p class="subtitle">Live-Auswertung aus Supabase</p>
    </div>
    <div>
      <button id="refreshBtn">Jetzt aktualisieren</button>
      <button id="autoBtn" class="green">Auto-Refresh: an</button>
      <button id="printBtn" class="secondary">Drucken</button>
    </div>
  </div>
</header>

<main>

<section class="card">
  <div class="controls">
    <div>
      <label for="classFilter">Klasse</label>
      <select id="classFilter">
        <option value="">Alle Klassen</option>
      </select>
    </div>

    <div>
      <label for="nameSearch">Name suchen</label>
      <input id="nameSearch" placeholder="Name eingeben">
    </div>

    <div>
      <label for="levelFilter">Level</label>
      <select id="levelFilter">
        <option value="">Alle Level</option>
        <option value="1">Level 1</option>
        <option value="2">Level 2</option>
        <option value="3">Level 3</option>
        <option value="4">Level 4</option>
        <option value="repeat">Wiederholung</option>
      </select>
    </div>

    <div>
      <label for="problemFilter">Anzeige</label>
      <select id="problemFilter">
        <option value="">Alles anzeigen</option>
        <option value="problem">Nur problematische Aufgaben / Lernende</option>
        <option value="complete">Nur vollständig oder fast vollständig</option>
      </select>
    </div>
  </div>

  <div class="legend">
    <span class="badge good">ab 80 %</span>
    <span class="badge mid">50–79 %</span>
    <span class="badge bad">unter 50 %</span>
    <span class="badge neutral">keine Daten</span>
  </div>

  <p id="statusLine" class="statusline">Noch nicht geladen.</p>
  <div id="errorBox" class="errorbox hidden"></div>
</section>

<section class="grid" id="kpiGrid"></section>

<section class="card">
  <div class="tabs">
    <button class="tab active" data-tab="lernende">Lernende</button>
    <button class="tab" data-tab="level">Levelübersicht</button>
    <button class="tab" data-tab="aufgaben">Aufgabenanalyse</button>
    <button class="tab" data-tab="wiederholung">Wiederholung</button>
    <button class="tab" data-tab="rohdaten">Rohdaten</button>
  </div>

  <div id="tab_lernende" class="tabview">
    <div class="toolbar">
      <h2>Lernende</h2>
      <button class="secondary" onclick="exportCurrentCsv()">CSV exportieren</button>
    </div>
    <div class="table-wrap" id="table_lernende"></div>
  </div>

  <div id="tab_level" class="tabview hidden">
    <div class="toolbar">
      <h2>Levelübersicht</h2>
      <button class="secondary" onclick="exportCurrentCsv()">CSV exportieren</button>
    </div>
    <div class="table-wrap" id="table_level"></div>
  </div>

  <div id="tab_aufgaben" class="tabview hidden">
    <div class="toolbar">
      <h2>Aufgabenanalyse</h2>
      <button class="secondary" onclick="exportCurrentCsv()">CSV exportieren</button>
    </div>
    <div class="table-wrap" id="table_aufgaben"></div>
  </div>

  <div id="tab_wiederholung" class="tabview hidden">
    <div class="toolbar">
      <h2>Wiederholung</h2>
      <button class="secondary" onclick="exportCurrentCsv()">CSV exportieren</button>
    </div>
    <div class="table-wrap" id="table_wiederholung"></div>
  </div>

  <div id="tab_rohdaten" class="tabview hidden">
    <div class="toolbar">
      <h2>Rohdaten</h2>
      <button class="secondary" onclick="exportCurrentCsv()">CSV exportieren</button>
    </div>
    <p class="small">Die neuesten 500 Rohdatenzeilen werden angezeigt.</p>
    <div class="table-wrap" id="table_rohdaten"></div>
  </div>
</section>

</main>

<script>
const SUPABASE_URL = "https://acmtcxhxuhqmbvqmvjeq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YxoD8gmahzdIq2mUfiG12Q_3ANH2-52";

const VIEWS = {
  lernende: "v_bip_lernende",
  level: "v_bip_leveluebersicht",
  aufgaben: "v_bip_aufgaben",
  wiederholung: "v_bip_wiederholung",
  rohdaten: "bip_rohdaten"
};

let data = {
  lernende: [],
  level: [],
  aufgaben: [],
  wiederholung: [],
  rohdaten: []
};

let currentTab = "lernende";
let autoRefresh = true;
let refreshTimer = null;

let sortState = {
  lernende: {col:"klasse", dir:"asc"},
  level: {col:"level_id", dir:"asc"},
  aufgaben: {col:"task_id", dir:"asc"},
  wiederholung: {col:"ursprungs_aufgabe", dir:"asc"},
  rohdaten: {col:"created_at", dir:"desc"}
};

function $(id){
  return document.getElementById(id);
}

function pct(value){
  if(value === null || value === undefined || value === "") return null;
  const n = Number(value);
  if(Number.isNaN(n)) return null;
  return n <= 1 ? n * 100 : n;
}

function fmtPct(value){
  const p = pct(value);
  if(p === null) return "";
  return Math.round(p) + "%";
}

function fmtNum(value, digits=1){
  if(value === null || value === undefined || value === "") return "";
  const n = Number(value);
  if(Number.isNaN(n)) return String(value);
  return n.toLocaleString("de-CH", {
    minimumFractionDigits:0,
    maximumFractionDigits:digits
  });
}

function fmtDate(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleString("de-CH");
}

function clsByPct(value){
  const p = pct(value);
  if(p === null) return "neutral";
  if(p >= 80) return "good";
  if(p >= 50) return "mid";
  return "bad";
}

function badgePct(value){
  const p = pct(value);
  if(p === null) return `<span class="badge neutral">–</span>`;
  return `<span class="badge ${clsByPct(value)}">${Math.round(p)}%</span>`;
}

function progressPct(value){
  const p = pct(value);
  const val = p === null ? 0 : Math.max(0, Math.min(100, p));
  const cls = clsByPct(value);
  return `<span class="progress ${cls}"><div style="width:${val}%"></div></span>${Math.round(val)}%`;
}

function badgeStatus(status){
  const s = String(status || "").toLowerCase();
  if(s === "richtig") return `<span class="badge good">richtig</span>`;
  if(s === "teilweise") return `<span class="badge mid">teilweise</span>`;
  if(s === "falsch") return `<span class="badge bad">falsch</span>`;
  if(s === "übersprungen" || s === "uebersprungen") return `<span class="badge neutral">übersprungen</span>`;
  return `<span class="badge neutral">${escapeHtml(status || "")}</span>`;
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function compareTaskIds(a,b){
  const sa = String(a ?? "");
  const sb = String(b ?? "");

  const pa = sa.split(".").map(x => Number(x));
  const pb = sb.split(".").map(x => Number(x));
  const len = Math.max(pa.length, pb.length);

  for(let i=0;i<len;i++){
    const na = Number.isNaN(pa[i]) || pa[i] === undefined ? 0 : pa[i];
    const nb = Number.isNaN(pb[i]) || pb[i] === undefined ? 0 : pb[i];

    if(na !== nb){
      return na - nb;
    }
  }

  return sa.localeCompare(sb, "de-CH", {
    numeric:true,
    sensitivity:"base"
  });
}

function compareValues(a,b,col){
  if(col === "task_id" || col === "ursprungs_aufgabe" || col === "level_id"){
    return compareTaskIds(a,b);
  }

  if(col === "created_at" || col === "startzeit" || col === "letzte_aktivitaet" || col === "letzte_wiederholung"){
    const da = new Date(a).getTime();
    const db = new Date(b).getTime();
    if(!Number.isNaN(da) && !Number.isNaN(db)){
      return da - db;
    }
  }

  const an = Number(a);
  const bn = Number(b);

  if(!Number.isNaN(an) && !Number.isNaN(bn) && a !== "" && b !== ""){
    return an - bn;
  }

  return String(a ?? "").localeCompare(String(b ?? ""), "de-CH", {
    numeric:true,
    sensitivity:"base"
  });
}

function defaultCompareForKey(key,a,b){
  if(key === "lernende"){
    let c = compareValues(a.klasse,b.klasse,"klasse");
    if(c !== 0) return c;
    c = compareValues(a.name,b.name,"name");
    if(c !== 0) return c;
    return compareValues(a.session_id,b.session_id,"session_id");
  }

  if(key === "level"){
    let c = compareValues(a.klasse,b.klasse,"klasse");
    if(c !== 0) return c;
    return compareValues(a.level_id,b.level_id,"level_id");
  }

  if(key === "aufgaben"){
    let c = compareValues(a.klasse,b.klasse,"klasse");
    if(c !== 0) return c;
    c = compareValues(a.level_id,b.level_id,"level_id");
    if(c !== 0) return c;
    return compareValues(a.task_id,b.task_id,"task_id");
  }

  if(key === "wiederholung"){
    let c = compareValues(a.klasse,b.klasse,"klasse");
    if(c !== 0) return c;
    c = compareValues(a.name,b.name,"name");
    if(c !== 0) return c;
    return compareValues(a.ursprungs_aufgabe,b.ursprungs_aufgabe,"ursprungs_aufgabe");
  }

  if(key === "rohdaten"){
    return -compareValues(a.created_at,b.created_at,"created_at");
  }

  return 0;
}

async function supabaseGet(path, params = ""){
  const url = `${SUPABASE_URL}/rest/v1/${path}${params}`;
  const response = await fetch(url, {
    method:"GET",
    headers:{
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type":"application/json"
    }
  });

  if(!response.ok){
    let text = "";
    try{
      text = await response.text();
    }catch(e){}
    throw new Error(`${path}: HTTP ${response.status} ${text}`);
  }

  return response.json();
}

async function loadAll(){
  $("errorBox").classList.add("hidden");
  $("statusLine").textContent = "Lade Daten …";

  try{
    const [
      lernende,
      level,
      aufgaben,
      wiederholung,
      rohdaten
    ] = await Promise.all([
      supabaseGet(VIEWS.lernende, "?select=*&order=klasse.asc,name.asc"),
      supabaseGet(VIEWS.level, "?select=*&order=klasse.asc,level_id.asc"),
      supabaseGet(VIEWS.aufgaben, "?select=*"),
      supabaseGet(VIEWS.wiederholung, "?select=*"),
      supabaseGet(VIEWS.rohdaten, "?select=created_at,name,class_name,level_id,level_name,task_id,question,chosen_answer,correct_solution,status,points,max_points,is_repeat,session_id,record_id&order=created_at.desc&limit=500")
    ]);

    data.lernende = lernende || [];
    data.level = level || [];
    data.aufgaben = aufgaben || [];
    data.wiederholung = wiederholung || [];
    data.rohdaten = rohdaten || [];

    updateFilters();
    renderAll();

    $("statusLine").textContent =
      "Zuletzt aktualisiert: " + new Date().toLocaleTimeString("de-CH") +
      " | Lernende: " + data.lernende.length +
      " | Rohdatenzeilen: " + data.rohdaten.length;

  }catch(err){
    $("errorBox").textContent =
      "Fehler beim Laden.\n\n" +
      String(err.message || err) +
      "\n\nFalls die Views fehlen: zuerst die SQL-Views erstellen und SELECT-Rechte vergeben.";
    $("errorBox").classList.remove("hidden");
    $("statusLine").textContent = "Fehler beim Laden.";
  }
}

function updateFilters(){
  const allClasses = new Set();

  data.lernende.forEach(r => {
    if(r.klasse) allClasses.add(r.klasse);
  });
  data.rohdaten.forEach(r => {
    if(r.class_name) allClasses.add(r.class_name);
  });

  const current = $("classFilter").value;
  const sorted = [...allClasses].sort((a,b)=>String(a).localeCompare(String(b), "de-CH", {numeric:true}));

  $("classFilter").innerHTML =
    `<option value="">Alle Klassen</option>` +
    sorted.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join("");

  if(sorted.includes(current)){
    $("classFilter").value = current;
  }
}

function filteredRows(key){
  const klasse = $("classFilter").value;
  const search = $("nameSearch").value.trim().toLowerCase();
  const level = $("levelFilter").value;
  const problem = $("problemFilter").value;

  let rows = [...data[key]];

  rows = rows.filter(r => {
    const rowClass = r.klasse ?? r.class_name ?? "";
    if(klasse && rowClass !== klasse) return false;

    const rowName = String(r.name ?? "").toLowerCase();
    if(search && !rowName.includes(search)) return false;

    const rowLevel = String(r.level_id ?? "");
    if(level && key !== "lernende"){
      if(level === "repeat"){
        if(!(r.is_repeat === true || r.level_id === "repeat")) return false;
      }else{
        if(rowLevel !== level) return false;
      }
    }

    if(problem === "problem"){
      if(key === "lernende"){
        const eq = pct(r.erfolgsquote);
        const offen = Number(r.offene_fehlerverbesserungen || 0);
        return (eq !== null && eq < 70) || offen > 0;
      }

      if(key === "level" || key === "aufgaben"){
        const eq = pct(r.durchschnittliche_erfolgsquote);
        return eq !== null && eq < 70;
      }

      if(key === "wiederholung"){
        const eq = pct(r.erfolgsquote);
        return eq !== null && eq < 80;
      }

      if(key === "rohdaten"){
        return r.status !== "richtig";
      }
    }

    if(problem === "complete" && key === "lernende"){
      return Number(r.fortschritt_prozent || 0) >= 90;
    }

    return true;
  });

  const sort = sortState[key];

  if(sort){
    rows.sort((a,b)=>{
      let cmp;

      if(sort.col === "task_id" && key === "aufgaben"){
        cmp = compareValues(a.klasse,b.klasse,"klasse");
        if(cmp !== 0) return cmp;

        cmp = compareValues(a.level_id,b.level_id,"level_id");
        if(cmp !== 0) return cmp;

        cmp = compareTaskIds(a.task_id,b.task_id);
      }else if(sort.col === "level_id" && (key === "level" || key === "aufgaben")){
        cmp = compareValues(a.klasse,b.klasse,"klasse");
        if(cmp !== 0) return cmp;

        cmp = compareValues(a.level_id,b.level_id,"level_id");
        if(cmp !== 0) return cmp;

        if(key === "aufgaben"){
          cmp = compareTaskIds(a.task_id,b.task_id);
        }
      }else{
        cmp = compareValues(a[sort.col], b[sort.col], sort.col);
      }

      if(cmp === 0){
        cmp = defaultCompareForKey(key,a,b);
      }

      return sort.dir === "desc" ? -cmp : cmp;
    });
  }else{
    rows.sort((a,b)=>defaultCompareForKey(key,a,b));
  }

  return rows;
}

function renderAll(){
  renderKpis();
  renderLernende();
  renderLevel();
  renderAufgaben();
  renderWiederholung();
  renderRohdaten();
}

function renderKpis(){
  const rows = filteredRows("lernende");
  const raw = filteredRows("rohdaten");

  const lernende = rows.length;
  const aktive = rows.filter(r => Number(r.fortschritt_prozent || 0) > 0).length;
  const avg = rows.length
    ? rows.reduce((s,r)=>s + (pct(r.erfolgsquote) ?? 0),0) / rows.length
    : null;

  const offen = rows.reduce((s,r)=>s + Number(r.offene_fehlerverbesserungen || 0),0);
  const answers = raw.length;

  const problemTasks = filteredRows("aufgaben").filter(r => {
    const eq = pct(r.durchschnittliche_erfolgsquote);
    return eq !== null && eq < 50;
  }).length;

  $("kpiGrid").innerHTML = `
    <div class="kpi">

function th(key, col, label){
  const sort = sortState[key];
  let marker = "";
  if(sort && sort.col === col){
    marker = sort.dir === "asc" ? " ▲" : " ▼";
  }
  return `<th onclick="sortBy('${key}','${col}')">${escapeHtml(label)}${marker}</th>`;
}

function sortBy(key, col){
  const current = sortState[key];

  if(current && current.col === col){
    current.dir = current.dir === "asc" ? "desc" : "asc";
  }else{
    sortState[key] = {col, dir:"asc"};
  }

  renderAll();
}

function emptyTable(text){
  return `<div style="padding:18px;background:white;">${escapeHtml(text)}</div>`;
}

function switchTab(tab){
  currentTab = tab;

  document.querySelectorAll(".tab").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.tab === tab);
  });

  document.querySelectorAll(".tabview").forEach(view=>{
    view.classList.add("hidden");
  });

  $("tab_" + tab).classList.remove("hidden");
}

function getCurrentRows(){
  return filteredRows(currentTab);
}

function exportCurrentCsv(){
  const rows = getCurrentRows();
  if(!rows.length){
    alert("Keine Daten zum Exportieren.");
    return;
  }

  const columns = Object.keys(rows[0]);
  const csv = [
    columns.join(";"),
    ...rows.map(row => columns.map(col => csvCell(row[col])).join(";"))
  ].join("\n");

  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "bip_mission_" + currentTab + "_" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function csvCell(value){
  if(value === null || value === undefined) return "";
  let s = String(value);
  s = s.replaceAll('"','""');
  return `"${s}"`;
}

function startAutoRefresh(){
  stopAutoRefresh();
  refreshTimer = setInterval(()=>{
    if(autoRefresh) loadAll();
  }, 5000);
}

function stopAutoRefresh(){
  if(refreshTimer){
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

$("refreshBtn").addEventListener("click", loadAll);

$("autoBtn").addEventListener("click", ()=>{
  autoRefresh = !autoRefresh;
  $("autoBtn").textContent = autoRefresh ? "Auto-Refresh: an" : "Auto-Refresh: aus";
  $("autoBtn").className = autoRefresh ? "green" : "secondary";
});

$("printBtn").addEventListener("click", ()=>{
  window.print();
});

$("classFilter").addEventListener("change", renderAll);
$("nameSearch").addEventListener("input", renderAll);
$("levelFilter").addEventListener("change", renderAll);
$("problemFilter").addEventListener("change", renderAll);

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    switchTab(btn.dataset.tab);
  });
});

loadAll();
startAutoRefresh();
