<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIP-Mission</title>
<style>
:root{
  --text:#1f2937;--muted:#6b7280;--primary:#2563eb;
  --green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2;
  --orange:#f59e0b;--orangebg:#fef3c7;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef6ff,#f8fafc);color:var(--text)}
header{background:white;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.wrap{max-width:1050px;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1,h2,h3{margin-top:0}.subtitle{margin:.3rem 0 0;color:var(--muted)}
main{padding:24px 18px 60px}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,.08);margin-bottom:20px}
.hidden{display:none!important}
label{font-weight:bold;display:block;margin:12px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:1rem}
button{border:none;background:var(--primary);color:white;padding:12px 16px;border-radius:14px;font-size:1rem;cursor:pointer;font-weight:bold}
button:hover{filter:brightness(.95)}
button.secondary{background:#e5e7eb;color:#111827}
button.danger{background:#dc2626;color:white}
button.ghost{background:#eff6ff;color:#1d4ed8}
button:disabled{opacity:.55;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.pill{background:#eef2ff;border:1px solid #dbeafe;color:#1e3a8a;padding:8px 11px;border-radius:999px;font-weight:bold;font-size:.92rem}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.level-card{border:2px solid #dbeafe;background:#f8fbff;padding:18px;border-radius:18px}
.level-card.done{opacity:.65;border-color:#bbf7d0;background:#f0fdf4}
.level-card.repeat{border-color:#fed7aa;background:#fff7ed}
.progressbar{width:100%;height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0}
.progressbar div{height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb)}
.question{font-size:1.25rem;font-weight:bold;line-height:1.45;margin:16px 0}
.options{display:grid;gap:10px;margin-top:12px}
.option{background:#f8fafc;color:#111827;border:2px solid #e5e7eb;text-align:left;padding:14px 15px}
.option:hover{border-color:#93c5fd}
.option.correct{background:var(--greenbg);border-color:var(--green)}
.option.wrong{background:var(--redbg);border-color:var(--red)}
.feedback{margin-top:18px;padding:16px;border-radius:16px;border:2px solid #e5e7eb}
.feedback.richtig{background:var(--greenbg);border-color:var(--green)}
.feedback.falsch{background:var(--redbg);border-color:var(--red)}
.feedback.teilweise{background:var(--orangebg);border-color:var(--orange)}
.feedback.übersprungen{background:#f3f4f6;border-color:#9ca3af}
.formula{background:#f1f5f9;border-left:5px solid #2563eb;padding:12px 14px;border-radius:12px;margin:12px 0}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #e5e7eb;padding:10px;text-align:left}
th{background:#eff6ff}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-weight:bold;font-size:.82rem}
.tag.richtig{background:var(--greenbg);color:var(--green)}
.tag.falsch{background:var(--redbg);color:var(--red)}
.tag.teilweise{background:var(--orangebg);color:#92400e}
.tag.übersprungen{background:#f3f4f6;color:#4b5563}
.small{font-size:.92rem;color:var(--muted)}
.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:14px;margin-top:10px}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:50px 16px;overflow:auto}
.modal{background:white;max-width:900px;width:100%;border-radius:22px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.result-item{padding:12px;border-radius:14px;background:#f8fafc;border:1px solid #e5e7eb;margin-bottom:10px}
</style>
</head>

<body>
<header>
  <div class="wrap topbar">
    <div>
      <h1>BIP-Mission</h1>
      <p class="subtitle">Lernspiel zu BIP, BIP-Kategorien, Berechnung, nominalem und realem BIP.</p>
    </div>
    <div class="btnrow" style="margin:0">
      <button class="ghost hidden" id="menuBtn">Menü</button>
      <button class="secondary hidden" id="resultsBtn">Zwischenresultate anzeigen</button>
      <button class="danger hidden" id="resetBtn">Reset</button>
    </div>
  </div>
</header>

<main class="wrap">

<section id="loginView" class="card">

  <p class="small">Gib deinen Namen und deine Klasse ein. Danach startest du die BIP-Mission.</p>

  <label for="nameInput">Name</label>
  <input id="nameInput" placeholder="Vorname Nachname">

  <label for="classSelect">Klasse</label>
  <select id="classSelect">
    <option value="">Bitte wählen</option>
    <option>2b</option><option>3b</option><option>BBMa</option><option>BBMb</option>
    <option>BMa</option><option>BMb</option><option>BMc</option><option>BMd</option><option>BMe</option>
    <option>1W</option><option>2W</option><option>3W</option><option>4W</option>
    <option>Sonstige</option>
  </select>

  <div id="otherClassWrap" class="hidden">
    <label for="otherClassInput">Eigene Klasse</label>
    <input id="otherClassInput" placeholder="Klasse eingeben">
  </div>

  <div class="btnrow">
    <button id="startBtn">Spiel starten</button>
  </div>

  <div id="loginError" class="notice hidden"></div>
</section>

<section id="menuView" class="hidden">
  <div class="card">
    <h2>Levelmenü</h2>
    <p id="playerInfo" class="small"></p>
    <div class="stats" id="statsBar"></div>
    <div class="menu-grid" id="levelMenu"></div>
  </div>
</section>

<section id="gameView" class="card hidden">
  <div class="topbar">
    <div>
      <h2 id="levelTitle"></h2>
      <p id="levelIntro" class="small"></p>
    </div>
    <div class="pill" id="taskCounter"></div>
  </div>

  <div class="progressbar">
    <div id="levelProgress" style="width:0%"></div>
  </div>

  <div id="taskArea"></div>
</section>

</main>

<div id="modalBack" class="modal-back hidden">
  <div class="modal">
    <div class="topbar">
      <h2>Zwischenresultate</h2>
      <button class="secondary" id="closeModalBtn">Schliessen</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

let state = loadState();
let queueSending = false;

function newState(){
  return {
    sessionId:"sess_" + Date.now() + "_" + Math.random().toString(36).slice(2,8),
    loggedIn:false,name:"",classChoice:"",otherClass:"",
    currentLevel:null,repeatMode:false,repeatIndex:0,repeatTasks:[],
    score:0,maxScore:0,repeatScore:0,repeatMaxScore:0,
    streak:0,bestStreak:0,
    counts:{richtig:0,teilweise:0,falsch:0,übersprungen:0},
    repeatCounts:{richtig:0,teilweise:0,falsch:0,übersprungen:0},
    results:[],repeatResults:[],levelState:{}
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return newState();
    const s = JSON.parse(raw);
    s.repeatResults ||= [];
    s.repeatCounts ||= {richtig:0,teilweise:0,falsch:0,übersprungen:0};
    s.repeatScore ??= 0;s.repeatMaxScore ??= 0;s.repeatTasks ||= [];s.repeatIndex ??= 0;s.repeatMode ??= false;
    return s;
  }catch(e){return newState();}
}

function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function getQueue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");}catch(e){return[];}}
function setQueue(q){localStorage.setItem(QUEUE_KEY,JSON.stringify(q));}

function enqueueRecord(payload){
  const q=getQueue();
  q.push({record_id:payload.record_id,payload,attempts:0,created_at:new Date().toISOString(),last_error:""});
  setQueue(q);
  flushQueue();
}

async function flushQueue(){
  if(queueSending) return;
  queueSending=true;
  try{
    while(true){
      let q=getQueue();
      if(q.length===0) break;
      const item=q[0];
      item.attempts++;
      setQueue(q);
      try{
        const response=await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?on_conflict=record_id`,{
          method:"POST",
          headers:{
            "apikey":SUPABASE_ANON_KEY,
            "Authorization":"Bearer "+SUPABASE_ANON_KEY,
            "Content-Type":"application/json",
            "Prefer":"resolution=ignore-duplicates,return=minimal"
          },
          body:JSON.stringify(item.payload)
        });
        if(response.ok || response.status===409){
          q=getQueue().filter(x=>x.record_id!==item.record_id);
          setQueue(q);
        }else{
          let msg="HTTP "+response.status;
          try{msg+=" "+await response.text();}catch(e){}
          throw new Error(msg);
        }
      }catch(err){
        q=getQueue();
        const f=q.find(x=>x.record_id===item.record_id);
        if(f) f.last_error=String(err.message||err);
        setQueue(q);
        break;
      }
    }
  }finally{queueSending=false;}
}

setInterval(flushQueue,5000);
window.addEventListener("online",flushQueue);
window.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushQueue();});

function el(id){return document.getElementById(id);}
function initLevels(){levels.forEach(l=>{if(!state.levelState[l.id])state.levelState[l.id]={index:0,completed:false,answered:{}};});}
function className(){return state.classChoice==="Sonstige"?state.otherClass:state.classChoice;}
function totalTasks(){return levels.reduce((s,l)=>s+l.tasks.length,0);}
function allNormalLevelsCompleted(){return levels.every(l=>state.levelState[l.id]?.completed);}
function safeText(t){return String(t??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}

function showOnly(viewId){
  ["loginView","menuView","gameView"].forEach(id=>el(id).classList.add("hidden"));
  el(viewId).classList.remove("hidden");
  const logged=state.loggedIn;
  el("menuBtn").classList.toggle("hidden",!logged);
  el("resultsBtn").classList.toggle("hidden",!logged);
  el("resetBtn").classList.toggle("hidden",!logged);
}

function normalizeLevelProgress(levelId){
  const level=levels.find(l=>l.id===levelId);
  if(!level) return;
  const ls=state.levelState[levelId];
  while(ls.index<level.tasks.length && ls.answered[level.tasks[ls.index].id]) ls.index++;
  if(ls.index>=level.tasks.length){ls.index=level.tasks.length;ls.completed=true;}
}
function normalizeAllProgress(){levels.forEach(l=>normalizeLevelProgress(l.id));}

function renderStats(){
  const rate=state.maxScore?Math.round(state.score/state.maxScore*100):0;
  const repeatRate=state.repeatMaxScore?Math.round(state.repeatScore/state.repeatMaxScore*100):0;
  el("statsBar").innerHTML=`
    <span class="pill">Punkte: ${state.score}/${state.maxScore}</span>
    <span class="pill">Erfolgsquote: ${rate}%</span>
    <span class="pill">Streak: ${state.streak}</span>
    <span class="pill">Beste Streak: ${state.bestStreak}</span>
    <span class="pill">Antworten: ${state.results.length}/${totalTasks()}</span>
    <span class="pill">Wiederholung: ${state.repeatScore}/${state.repeatMaxScore} (${repeatRate}%)</span>
  `;
}

function findTaskById(levelId,taskId){
  const level=levels.find(l=>l.id===levelId);
  if(!level) return null;
  const task=level.tasks.find(t=>t.id===taskId);
  if(!task) return null;
  return {level,task};
}

function getOpenErrors(){
  const latest={};
  state.results.forEach(r=>latest[r.taskId]={taskId:r.taskId,levelId:r.levelId,status:r.status});
  state.repeatResults.forEach(r=>{if(r.status==="richtig") delete latest[r.originalTaskId];});
  return Object.values(latest).filter(x=>x.status!=="richtig").map(x=>findTaskById(x.levelId,x.taskId)).filter(Boolean);
}

function renderMenu(){
  initLevels();normalizeAllProgress();
  state.currentLevel=null;state.repeatMode=false;saveState();
  el("playerInfo").textContent="Angemeldet: "+state.name+" | Klasse: "+className();
  renderStats();

  const normal=levels.map(level=>{
    const ls=state.levelState[level.id];
    const pct=Math.round(ls.index/level.tasks.length*100);
    const status=ls.completed?"abgeschlossen":ls.index+"/"+level.tasks.length+" erledigt";
    const btn=ls.index>0&&!ls.completed?"Weiter spielen":"Level starten";
    return `
      <div class="level-card ${ls.completed?"done":""}">
        <h3>${safeText(level.name)}</h3>
        <p class="small">${safeText(level.intro)}</p>
        <div class="progressbar"><div style="width:${pct}%"></div></div>
        <p><strong>Status:</strong> ${status}</p>
        <button ${ls.completed?"disabled":""} onclick="openLevel('${level.id}')">${btn}</button>
      </div>`;
  }).join("");

  const errors=getOpenErrors();
  const allDone=allNormalLevelsCompleted();
  let repeatStatus,disabled="",btnText;
  if(!allDone){repeatStatus="Erst nach Abschluss aller normalen Level verfügbar.";disabled="disabled";btnText="Noch gesperrt";}
  else if(errors.length===0){repeatStatus="Keine Fehler offen.";disabled="disabled";btnText="Keine Fehler offen";}
  else{repeatStatus="Offene Fehler: "+errors.length;btnText="Fehler wiederholen";}

  el("levelMenu").innerHTML=normal+`
    <div class="level-card repeat">
      <h3>Wiederholungslevel: Fehler verbessern</h3>
      <p class="small">Dieses Level wird freigeschaltet, wenn Level 1–4 abgeschlossen sind.</p>
      <div class="progressbar"><div style="width:${allDone&&errors.length===0?100:0}%"></div></div>
      <p><strong>Status:</strong> ${repeatStatus}</p>
      <button ${disabled} onclick="startRepeatLevel()">${btnText}</button>
    </div>`;
  showOnly("menuView");
}

function openLevel(levelId){
  normalizeLevelProgress(levelId);
  if(state.levelState[levelId].completed) return;
  state.currentLevel=levelId;state.repeatMode=false;saveState();renderTask();
}

function startRepeatLevel(){
  normalizeAllProgress();
  if(!allNormalLevelsCompleted()) return renderMenu();
  const errors=getOpenErrors();
  if(errors.length===0) return renderMenu();
  state.repeatMode=true;state.repeatTasks=errors;state.repeatIndex=0;state.currentLevel="repeat";saveState();renderRepeatTask();
}

function renderTask(){
  normalizeLevelProgress(state.currentLevel);
  const level=levels.find(l=>l.id===state.currentLevel);
  const ls=state.levelState[level.id];
  if(ls.index>=level.tasks.length) return completeLevel(level.id);
  const task=level.tasks[ls.index];
  el("levelTitle").textContent=level.name;
  el("levelIntro").textContent=level.intro;
  el("taskCounter").textContent="Aufgabe "+(ls.index+1)+" von "+level.tasks.length;
  el("levelProgress").style.width=Math.round(ls.index/level.tasks.length*100)+"%";
  if(level.type==="choice") renderChoice(level,task,false);
  if(level.type==="calc") renderCalc(level,task,false);
  if(level.type==="realnom") renderRealNom(level,task,false);
  showOnly("gameView");
}

function renderRepeatTask(){
  const item=state.repeatTasks[state.repeatIndex];
  if(!item){state.repeatMode=false;saveState();return renderMenu();}
  const {level,task}=item;
  el("levelTitle").textContent="Wiederholungslevel: Fehler verbessern";
  el("levelIntro").textContent="Diese Aufgabe stammt aus "+level.name+".";
  el("taskCounter").textContent="Wiederholung "+(state.repeatIndex+1)+" von "+state.repeatTasks.length;
  el("levelProgress").style.width=Math.round(state.repeatIndex/state.repeatTasks.length*100)+"%";
  if(level.type==="choice") renderChoice(level,task,true);
  if(level.type==="calc") renderCalc(level,task,true);
  if(level.type==="realnom") renderRealNom(level,task,true);
  showOnly("gameView");
}

function renderChoice(level,task,isRepeat){
  el("taskArea").innerHTML=`
    <div class="question">${task.id}: ${safeText(task.q)}</div>
    <div class="options">${task.options.map(o=>`<button class="option" data-answer="${safeText(o)}">${safeText(o)}</button>`).join("")}</div>
    <div id="feedbackArea"></div>`;
  document.querySelectorAll(".option").forEach(btn=>btn.addEventListener("click",function(){
    answerChoice(level.id,task.id,this.dataset.answer,this,isRepeat);
  }));
}

function answerChoice(levelId,taskId,answer,clickedButton,isRepeat){
  const found=isRepeat?state.repeatTasks[state.repeatIndex]:findTaskById(levelId,taskId);
  const {level,task}=found;
  const ls=state.levelState[levelId];
  if(!isRepeat && ls.answered[taskId]) return;
  const correct=answer===task.correct;
  document.querySelectorAll(".option").forEach(btn=>{
    btn.disabled=true;
    if(btn.dataset.answer===task.correct) btn.classList.add("correct");
    if(btn===clickedButton && !correct) btn.classList.add("wrong");
  });
  const status=correct?"richtig":"falsch";
  const points=correct?1:0;
  if(isRepeat) recordRepeatAnswer(level,task,answer,task.correct,status,points,1,task.exp,task.memo);
  else{recordAnswer(level,task,answer,task.correct,status,points,1,task.exp,task.memo);ls.answered[taskId]=true;}
  saveState();
  el("feedbackArea").innerHTML=feedbackHtml(status,task.correct,task.exp,task.memo);
  addNextButtons(levelId,isRepeat);
}

function renderCalc(level,task,isRepeat){
  el("taskArea").innerHTML=`
    <div class="question">${task.id}: ${safeText(task.title)}</div>
    <p>${safeText(task.text)}</p>
    <div class="formula">Formel: BIP = C + I + G + X − M</div>
    ${task.fields.map(f=>`<label>${safeText(f.label)}</label><input type="number" step="0.01" id="input_${f.key}" placeholder="Zahl eingeben">`).join("")}
    <div class="btnrow"><button id="checkCalcBtn">Antwort prüfen</button><button class="secondary" id="skipBtn">Überspringen</button></div>
    <div id="feedbackArea"></div>`;
  el("checkCalcBtn").addEventListener("click",()=>checkCalc(level.id,isRepeat));
  el("skipBtn").addEventListener("click",()=>skipTask(level.id,isRepeat));
}

function checkCalc(levelId,isRepeat){
  const found=isRepeat?state.repeatTasks[state.repeatIndex]:getCurrentNormalTask(levelId);
  const {level,task}=found;
  const ls=state.levelState[levelId];
  if(!isRepeat && ls.answered[task.id]) return;
  let correct=true, chosen={};
  task.fields.forEach(f=>{
    const raw=el("input_"+f.key).value.replace(",",".");
    const val=Number(raw);
    chosen[f.key]=raw===""?"":val;
    if(raw==="" || Math.abs(val-task.answers[f.key])>0.01) correct=false;
  });
  const status=correct?"richtig":"falsch", points=correct?1:0;
  if(isRepeat) recordRepeatAnswer(level,task,JSON.stringify(chosen),task.solution,status,points,1,task.exp,task.memo);
  else{recordAnswer(level,task,JSON.stringify(chosen),task.solution,status,points,1,task.exp,task.memo);ls.answered[task.id]=true;}
  saveState();disableTaskInputs();
  el("feedbackArea").innerHTML=feedbackHtml(status,task.solution,task.exp,task.memo);
  addNextButtons(levelId,isRepeat);
}

function renderRealNom(level,task,isRepeat){
  const rows=task.products.map(p=>`
    <tr><td>${safeText(p.name)}</td><td>${p.p0}</td><td>${p.q0}</td><td>${p.p1}</td><td>${p.q1}</td></tr>`).join("");
  el("taskArea").innerHTML=`
    <div class="question">${task.id}: Jahr ${task.year} – nominales und reales BIP berechnen</div>
    <p><strong>Basisjahr:</strong> ${task.baseYear}. <strong>BIP im Basisjahr:</strong> ${task.baseGDP}.</p>
    <table>
      <thead><tr><th>Produkt</th><th>Preis Basisjahr</th><th>Menge Basisjahr</th><th>Preis aktuelles Jahr</th><th>Menge aktuelles Jahr</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="formula">Nominales BIP = Preis aktuelles Jahr × Menge aktuelles Jahr<br>Reales BIP = Preis Basisjahr × Menge aktuelles Jahr</div>
    <label>Nominales BIP im Jahr ${task.year}</label>
    <input type="number" step="0.01" id="nominalInput" placeholder="Zahl eingeben">
    <label>Reales BIP im Jahr ${task.year} zu Preisen von ${task.baseYear}</label>
    <input type="number" step="0.01" id="realInput" placeholder="Zahl eingeben">
    <div class="btnrow"><button id="checkRealNomBtn">Antwort prüfen</button><button class="secondary" id="skipBtn">Überspringen</button></div>
    <div id="feedbackArea"></div>`;
  el("checkRealNomBtn").addEventListener("click",()=>checkRealNom(level.id,isRepeat));
  el("skipBtn").addEventListener("click",()=>skipTask(level.id,isRepeat));
}

function checkRealNom(levelId,isRepeat){
  const found=isRepeat?state.repeatTasks[state.repeatIndex]:getCurrentNormalTask(levelId);
  const {level,task}=found;
  const ls=state.levelState[levelId];
  if(!isRepeat && ls.answered[task.id]) return;
  const nominalRaw=el("nominalInput").value.replace(",",".");
  const realRaw=el("realInput").value.replace(",",".");
  const nominal=Number(nominalRaw), real=Number(realRaw);
  const okNominal=nominalRaw!=="" && Math.abs(nominal-task.answers.nominal)<0.01;
  const okReal=realRaw!=="" && Math.abs(real-task.answers.real)<0.01;
  let status="falsch",points=0;
  if(okNominal&&okReal){status="richtig";points=1;}
  else if(okNominal||okReal){status="teilweise";points=.5;}
  const solution="Nominales BIP = "+task.answers.nominal+"; reales BIP = "+task.answers.real+". "+task.exp;
  const chosen=JSON.stringify({nominal:nominalRaw===""?"":nominal,real:realRaw===""?"":real});
  if(isRepeat) recordRepeatAnswer(level,task,chosen,solution,status,points,1,task.exp,task.memo);
  else{recordAnswer(level,task,chosen,solution,status,points,1,task.exp,task.memo);ls.answered[task.id]=true;}
  saveState();disableTaskInputs();
  el("feedbackArea").innerHTML=feedbackHtml(status,solution,task.exp,task.memo);
  addNextButtons(levelId,isRepeat);
}

function skipTask(levelId,isRepeat){
  const found=isRepeat?state.repeatTasks[state.repeatIndex]:getCurrentNormalTask(levelId);
  const {level,task}=found;
  const ls=state.levelState[levelId];
  if(!isRepeat && ls.answered[task.id]) return;
  let solution=task.solution;
  if(!solution && task.answers?.nominal!==undefined) solution="Nominales BIP = "+task.answers.nominal+"; reales BIP = "+task.answers.real+".";
  if(isRepeat) recordRepeatAnswer(level,task,"übersprungen",solution,"übersprungen",0,1,task.exp,task.memo);
  else{recordAnswer(level,task,"übersprungen",solution,"übersprungen",0,1,task.exp,task.memo);ls.answered[task.id]=true;}
  saveState();disableTaskInputs();
  el("feedbackArea").innerHTML=feedbackHtml("übersprungen",solution,task.exp,task.memo);
  addNextButtons(levelId,isRepeat);
}

function getCurrentNormalTask(levelId){
  normalizeLevelProgress(levelId);
  const level=levels.find(l=>l.id===levelId);
  return {level,task:level.tasks[state.levelState[levelId].index]};
}

function feedbackHtml(status,solution,exp,memo){
  const title=status.charAt(0).toUpperCase()+status.slice(1);
  return `<div class="feedback ${status}">
    <p><span class="tag ${status}">${title}</span></p>
    <p><strong>Lösung:</strong> ${safeText(solution)}</p>
    <p><strong>Erklärung:</strong> ${safeText(exp)}</p>
    <p><strong>Merksatz:</strong> ${safeText(memo)}</p>
  </div>`;
}

function disableTaskInputs(){document.querySelectorAll("#taskArea input,#taskArea button").forEach(x=>x.disabled=true);}

function addNextButtons(levelId,isRepeat){
  let isLast=false;
  if(isRepeat) isLast=state.repeatIndex>=state.repeatTasks.length-1;
  else{
    const level=levels.find(l=>l.id===levelId);
    const ls=state.levelState[levelId];
    isLast=(ls.index+1)>=level.tasks.length;
  }
  el("feedbackArea").insertAdjacentHTML("beforeend",`
    <div class="btnrow">
      <button id="nextTaskBtn">${isLast?(isRepeat?"Wiederholung abschliessen":"Level abschliessen"):"Nächste Aufgabe"}</button>
      <button class="secondary" id="backMenuBtn">Zurück ins Menü</button>
    </div>`);
  el("nextTaskBtn").addEventListener("click",()=>isRepeat?nextRepeatTask():nextTask(levelId));
  el("backMenuBtn").addEventListener("click",()=>renderMenu());
}

function nextTask(levelId){
  normalizeLevelProgress(levelId);
  const level=levels.find(l=>l.id===levelId);
  if(state.levelState[levelId].index>=level.tasks.length) completeLevel(levelId);
  else{saveState();renderTask();}
}

function nextRepeatTask(){
  state.repeatIndex++;
  if(state.repeatIndex>=state.repeatTasks.length){
    state.repeatMode=false;state.repeatTasks=[];state.repeatIndex=0;saveState();renderMenu();
  }else{saveState();renderRepeatTask();}
}

function completeLevel(levelId){
  const level=levels.find(l=>l.id===levelId);
  state.levelState[levelId].completed=true;
  state.levelState[levelId].index=level.tasks.length;
  saveState();renderMenu();
}

function recordAnswer(level,task,chosen,solution,status,points,maxPoints,explanation,memo){
  state.score+=points;state.maxScore+=maxPoints;
  if(status==="richtig"){state.streak++;if(state.streak>state.bestStreak)state.bestStreak=state.streak;}else state.streak=0;
  state.counts[status]=(state.counts[status]||0)+1;

  const result={
    record_id:makeRecordId(level.id,task.id,"normal"),
    level_id:level.id,level_name:level.name,task_id:task.id,task_type:level.type,
    question:task.q||task.text||task.title||("Jahr "+task.year),
    chosen_answer:chosen,correct_solution:solution,status,points,max_points:maxPoints,
    score_now:state.score,streak:state.streak,best_streak:state.bestStreak,
    explanation,memo
  };

  state.results.push({
    taskId:result.task_id,levelId:result.level_id,levelName:result.level_name,
    question:result.question,chosen:result.chosen_answer,solution:result.correct_solution,
    status:result.status,points:result.points,maxPoints:result.max_points
  });

  enqueueRecord(buildSupabasePayload(result,false));
}

function recordRepeatAnswer(level,task,chosen,solution,status,points,maxPoints,explanation,memo){
  state.repeatScore+=points;state.repeatMaxScore+=maxPoints;
  state.repeatCounts[status]=(state.repeatCounts[status]||0)+1;

  const result={
    record_id:makeRecordId(level.id,task.id,"repeat"),
    original_task_id:task.id,original_level_id:level.id,original_level_name:level.name,
    task_type:level.type,
    question:task.q||task.text||task.title||("Jahr "+task.year),
    chosen_answer:chosen,correct_solution:solution,status,points,max_points:maxPoints,
    explanation,memo
  };

  state.repeatResults.push({
    originalTaskId:result.original_task_id,originalLevelId:result.original_level_id,
    originalLevelName:result.original_level_name,question:result.question,chosen:result.chosen_answer,
    solution:result.correct_solution,status:result.status,points:result.points,maxPoints:result.max_points
  });

  enqueueRecord(buildSupabasePayload(result,true));
}

function makeRecordId(levelId,taskId,kind){
  return state.sessionId+"_"+kind+"_"+levelId+"_"+taskId+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

function buildSupabasePayload(r,isRepeat){
  const totalPossible=totalTasks();
  const progress=totalPossible?state.results.length/totalPossible:0;
  return {
    record_id:r.record_id,game_id:GAME_ID,game_title:GAME_TITLE,version:VERSION,session_id:state.sessionId,
    name:state.name,class_name:className(),class_choice:state.classChoice,other_class:state.otherClass,
    level_id:isRepeat?"repeat":r.level_id,
    level_name:isRepeat?"Wiederholungslevel: Fehler verbessern":r.level_name,
    task_id:isRepeat?r.original_task_id:r.task_id,
    task_title:r.question,task_type:r.task_type,subtask_id:isRepeat?r.original_task_id:r.task_id,subtask_title:r.question,
    question:r.question,chosen_answer:r.chosen_answer,correct_solution:r.correct_solution,status:r.status,
    points:r.points,max_points:r.max_points,success_rate:r.max_points?r.points/r.max_points:0,
    attempt:1,duration_ms:null,score_now:isRepeat?state.repeatScore:state.score,total_possible:totalPossible,
    streak:state.streak,best_streak:state.bestStreak,
    count_right:state.counts.richtig||0,count_partial:state.counts.teilweise||0,
    count_wrong:state.counts.falsch||0,count_skipped:state.counts.übersprungen||0,
    progress,level_completed:isRepeat?null:Boolean(state.levelState[r.level_id]?.completed),
    error_type:r.status==="richtig"?"":r.status,misconception:"",
    explanation:r.explanation,memo:r.memo,is_repeat:isRepeat,source:isRepeat?"Wiederholung":"Normal",
    details:{
      allNormalLevelsCompleted:allNormalLevelsCompleted(),
      openErrors:getOpenErrors().length,
      repeatScore:state.repeatScore,
      repeatMaxScore:state.repeatMaxScore,
      repeatCounts:state.repeatCounts
    }
  };
}

function showResults(){
  const rate=state.maxScore?Math.round(state.score/state.maxScore*100):0;
  const repeatRate=state.repeatMaxScore?Math.round(state.repeatScore/state.repeatMaxScore*100):0;
  const items=state.results.slice().reverse().map(r=>`
    <div class="result-item">
      <strong>${safeText(r.taskId)}</strong> – ${safeText(r.levelName)}<br>
      <span class="tag ${r.status}">${safeText(r.status)}</span>
      <span class="small"> Punkte: ${r.points}/${r.maxPoints}</span>
      <p><strong>Frage:</strong> ${safeText(r.question)}</p>
      <p><strong>Antwort:</strong> ${safeText(r.chosen)}</p>
      <p><strong>Lösung:</strong> ${safeText(r.solution)}</p>
    </div>`).join("");

  const repeatItems=state.repeatResults.slice().reverse().map(r=>`
    <div class="result-item">
      <strong>Wiederholung zu ${safeText(r.originalTaskId)}</strong> – ${safeText(r.originalLevelName)}<br>
      <span class="tag ${r.status}">${safeText(r.status)}</span>
      <span class="small"> Punkte: ${r.points}/${r.maxPoints}</span>
      <p><strong>Frage:</strong> ${safeText(r.question)}</p>
      <p><strong>Antwort:</strong> ${safeText(r.chosen)}</p>
      <p><strong>Lösung:</strong> ${safeText(r.solution)}</p>
    </div>`).join("");

  el("modalContent").innerHTML=`
    <div class="stats">
      <span class="pill">Name: ${safeText(state.name)}</span>
      <span class="pill">Klasse: ${safeText(className())}</span>
      <span class="pill">Punkte: ${state.score}/${state.maxScore}</span>
      <span class="pill">Erfolgsquote: ${rate}%</span>
      <span class="pill">Beste Streak: ${state.bestStreak}</span>
      <span class="pill">Wiederholung: ${state.repeatScore}/${state.repeatMaxScore} (${repeatRate}%)</span>
    </div>
    <p>Richtig: <strong>${state.counts.richtig||0}</strong> |
    Teilweise: <strong>${state.counts.teilweise||0}</strong> |
    Falsch: <strong>${state.counts.falsch||0}</strong> |
    Übersprungen: <strong>${state.counts.übersprungen||0}</strong></p>
    <p>Normale Level abgeschlossen: <strong>${allNormalLevelsCompleted()?"Ja":"Nein"}</strong><br>
    Offene Fehler für Wiederholung: <strong>${getOpenErrors().length}</strong></p>
    <h3>Antwortprotokoll normale Level</h3>${items||"<p>Noch keine Antworten.</p>"}
    <h3>Wiederholungen</h3>${repeatItems||"<p>Noch keine Wiederholungen.</p>"}`;
  el("modalBack").classList.remove("hidden");
}

function resetAll(){
  const ok=confirm("Wirklich alles zurücksetzen? Name, Klasse, lokale Resultate, Spielstand, Speicherqueue und Levelstände werden gelöscht.");
  if(!ok) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(QUEUE_KEY);
  state=newState();initLevels();
  el("nameInput").value="";el("classSelect").value="";el("otherClassInput").value="";
  el("otherClassWrap").classList.add("hidden");el("loginError").classList.add("hidden");
  showOnly("loginView");
}

el("classSelect").addEventListener("change",()=>el("otherClassWrap").classList.toggle("hidden",el("classSelect").value!=="Sonstige"));

el("startBtn").addEventListener("click",()=>{
  const name=el("nameInput").value.trim();
  const classChoice=el("classSelect").value;
  const otherClass=el("otherClassInput").value.trim();
  if(!name || !classChoice || (classChoice==="Sonstige"&&!otherClass)){
    el("loginError").textContent="Bitte Name und Klasse vollständig eingeben.";
    el("loginError").classList.remove("hidden");
    return;
  }
  state.name=name;state.classChoice=classChoice;state.otherClass=otherClass;state.loggedIn=true;
  initLevels();saveState();flushQueue();renderMenu();
});

el("menuBtn").addEventListener("click",renderMenu);
el("resultsBtn").addEventListener("click",showResults);
el("resetBtn").addEventListener("click",resetAll);
el("closeModalBtn").addEventListener("click",()=>el("modalBack").classList.add("hidden"));
el("modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")el("modalBack").classList.add("hidden");});

initLevels();
flushQueue();
if(state.loggedIn) renderMenu();
else showOnly("loginView");
</script>
</body>
</html>
