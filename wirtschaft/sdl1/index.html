<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lebenswege, Wirtschaft und Recht im Alltag</title>
  <style>
    :root {
      --cream: #fff7e8;
      --paper: #ffffff;
      --blue: #d9efff;
      --blue-strong: #7fc6ee;
      --mint: #dff8ec;
      --green: #a7dfbd;
      --yellow: #fff1ad;
      --peach: #ffd7bf;
      --pink: #ffdbe8;
      --lavender: #e9defd;
      --text: #243241;
      --muted: #66758a;
      --shadow: 0 14px 35px rgba(67, 87, 108, 0.18);
      --soft-shadow: 0 8px 22px rgba(67, 87, 108, 0.12);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #fff7e8 0%, #eefaff 48%, #efffed 100%);
      overflow: hidden;
    }

    button, input, select { font: inherit; }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: #ffffff;
      color: var(--text);
      box-shadow: var(--soft-shadow);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      font-weight: 700;
    }

    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .primary { background: linear-gradient(135deg, #7fc6ee, #a7dfbd); color: #123044; }
    .secondary { background: #fff; }
    .danger { background: #ffe1da; }
    .ghost { background: rgba(255,255,255,0.8); }

    #app { width: 100vw; height: 100vh; position: relative; }

    .start-screen {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .start-card {
      width: min(1120px, 96vw);
      min-height: 720px;
      background: rgba(255,255,255,0.76);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 38px;
      box-shadow: var(--shadow);
      padding: 44px;
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 28px;
      backdrop-filter: blur(14px);
    }

    .hero h1 {
      font-size: clamp(38px, 6vw, 72px);
      line-height: 0.98;
      margin: 0 0 20px;
      letter-spacing: -0.05em;
    }

    .hero p {
      font-size: 19px;
      line-height: 1.55;
      color: #475569;
      max-width: 680px;
    }

    .mode-card, .setup-card, .character-card {
      background: rgba(255,255,255,0.9);
      border-radius: 28px;
      padding: 22px;
      box-shadow: var(--soft-shadow);
      border: 1px solid rgba(110, 160, 170, 0.16);
    }

    .mode-option {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px;
      border-radius: 20px;
      margin: 12px 0;
      background: #f8fcff;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .mode-option.selected { border-color: var(--blue-strong); background: #edf9ff; }
    .mode-option strong { display: block; font-size: 18px; }
    .mode-option span { color: var(--muted); font-size: 14px; }

    .decor-map {
      height: 360px;
      border-radius: 30px;
      background: linear-gradient(135deg, #dff8ec, #d9efff);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.75), var(--soft-shadow);
      position: relative;
      overflow: hidden;
    }

    .decor-path {
      position: absolute;
      left: 30px;
      top: 180px;
      width: 420px;
      height: 120px;
      border: 16px solid rgba(255,255,255,0.9);
      border-top-color: transparent;
      border-left-color: transparent;
      border-radius: 60px;
      transform: rotate(-12deg);
    }

    .decor-tile {
      position: absolute;
      width: 72px;
      height: 46px;
      border-radius: 14px;
      background: #fff1ad;
      box-shadow: var(--soft-shadow);
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .decor-token {
      position: absolute;
      right: 50px;
      top: 45px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffb1a0, #fff1ad);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      font-size: 34px;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
      max-height: 420px;
      overflow: auto;
      padding-right: 6px;
    }

    .character-card {
      cursor: pointer;
      padding: 16px;
      min-height: 160px;
      border: 2px solid transparent;
    }

    .character-card.selected { border-color: var(--green); background: #f0fff6; }
    .character-card h3 { margin: 0 0 8px; }
    .character-card p { margin: 7px 0; color: var(--muted); line-height: 1.35; }

    .topbar {
      position: absolute;
      left: 14px;
      top: 12px;
      right: 14px;
      height: 68px;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.86);
      border-radius: 24px;
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.9);
    }

    .top-title { font-weight: 900; letter-spacing: -0.03em; font-size: 18px; }
    .turn-pill {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 8px 12px;
      background: #f4fbff;
      border-radius: 999px;
      color: #365064;
      font-weight: 750;
      white-space: nowrap;
    }

    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .toolbar button { padding: 9px 12px; font-size: 14px; }

    .board-shell {
      position: absolute;
      inset: 0;
      padding-top: 88px;
      background: linear-gradient(135deg, #fff7e8 0%, #edf9ff 52%, #f4ffef 100%);
      overflow: hidden;
    }

    .viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      position: relative;
    }
    .viewport.dragging { cursor: grabbing; }

    .board {
      position: absolute;
      left: 0;
      top: 0;
      width: 3200px;
      height: 1900px;
      transform-origin: 0 0;
      border-radius: 52px;
      background:
        radial-gradient(circle at 18% 16%, rgba(255,241,173,0.75) 0 8%, transparent 22%),
        radial-gradient(circle at 71% 20%, rgba(217,239,255,0.92) 0 13%, transparent 27%),
        radial-gradient(circle at 25% 72%, rgba(223,248,236,0.9) 0 14%, transparent 29%),
        radial-gradient(circle at 78% 70%, rgba(255,219,232,0.8) 0 11%, transparent 26%),
        linear-gradient(135deg, #fffaf0, #f1fbff 48%, #f7fff3);
      box-shadow: inset 0 0 0 5px rgba(255,255,255,0.9), 0 30px 80px rgba(44, 72, 94, 0.22);
      overflow: hidden;
    }

    .zone {
      position: absolute;
      border-radius: 34px;
      padding: 18px 24px;
      font-weight: 900;
      color: rgba(42, 63, 80, 0.58);
      background: rgba(255,255,255,0.46);
      border: 2px dashed rgba(93, 125, 142, 0.14);
      font-size: 34px;
      letter-spacing: -0.04em;
    }

    .illustration {
      position: absolute;
      font-size: 44px;
      filter: drop-shadow(0 7px 8px rgba(0,0,0,0.08));
      opacity: 0.9;
      pointer-events: none;
    }

    svg.path-layer {
      position: absolute;
      inset: 0;
      width: 3200px;
      height: 1900px;
      pointer-events: none;
      overflow: visible;
    }

    .path-line {
      fill: none;
      stroke: rgba(255,255,255,0.88);
      stroke-width: 32;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 9px 9px rgba(76, 105, 120, 0.18));
    }

    .path-edge {
      fill: none;
      stroke: rgba(104, 148, 161, 0.22);
      stroke-width: 38;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .field {
      position: absolute;
      width: 148px;
      min-height: 76px;
      border-radius: 18px;
      background: #fff;
      border: 3px solid rgba(255,255,255,0.82);
      box-shadow: 0 11px 20px rgba(67,87,108,0.16);
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 9px 9px 8px;
      z-index: 12;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .field.current { box-shadow: 0 0 0 8px rgba(127,198,238,0.28), var(--shadow); }
    .field .icon { font-size: 20px; line-height: 1; margin-bottom: 4px; }
    .field .label { font-size: 13px; font-weight: 850; line-height: 1.07; }
    .field .age { font-size: 10px; color: var(--muted); margin-top: 4px; }

    .entscheidung { background: #fff1ad; }
    .ereignis { background: #d9efff; }
    .chance { background: #dff8ec; }
    .risiko { background: #ffd7bf; }
    .diskussion { background: #e9defd; }
    .bildung { background: #e8f2ff; }
    .arbeit { background: #e0f7ef; }
    .finanzen { background: #fff3cc; }
    .konsum { background: #ffe5d7; }
    .recht { background: #e8e1ff; }
    .familie { background: #ffdbe8; }
    .gesundheit { background: #e2f9df; }
    .profil { background: #f3f7ff; }
    .bilanz { background: #fff; border-color: #a7dfbd; }

    .token {
      position: absolute;
      width: 46px;
      height: 58px;
      transform: translate(-50%, -92%);
      border-radius: 50% 50% 48% 48%;
      box-shadow: 0 12px 16px rgba(23, 44, 60, 0.2);
      z-index: 30;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 950;
      border: 4px solid rgba(255,255,255,0.95);
      transition: left 0.32s ease, top 0.32s ease, transform 0.18s ease;
    }
    .token::after {
      content: "";
      position: absolute;
      bottom: -10px;
      width: 26px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,0.16);
      z-index: -1;
      filter: blur(2px);
    }
    .token.hop { transform: translate(-50%, -112%) scale(1.08); }
    .token.inactive { opacity: 0.62; transform: translate(-50%, -92%) scale(0.88); }

    .spinner-panel {
      position: absolute;
      right: 24px;
      bottom: 24px;
      z-index: 90;
      width: 250px;
      background: rgba(255,255,255,0.88);
      border-radius: 30px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.9);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .wheel-wrap { position: relative; width: 164px; height: 164px; margin: 0 auto 12px; }
    .pointer {
      position: absolute;
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 28px solid #2f4153;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
    }
    .wheel {
      width: 164px;
      height: 164px;
      border-radius: 50%;
      background: conic-gradient(#fff1ad 0 36deg, #d9efff 36deg 72deg, #dff8ec 72deg 108deg, #ffd7bf 108deg 144deg, #e9defd 144deg 180deg, #fff1ad 180deg 216deg, #d9efff 216deg 252deg, #dff8ec 252deg 288deg, #ffdbe8 288deg 324deg, #e8f2ff 324deg 360deg);
      border: 9px solid #fff;
      box-shadow: inset 0 0 0 2px rgba(56, 77, 96, 0.12), var(--soft-shadow);
      position: relative;
      transition: transform 2.4s cubic-bezier(.1,.84,.16,1);
    }
    .wheel::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 36px;
      height: 36px;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 50%;
      box-shadow: inset 0 0 0 3px rgba(47,65,83,0.12);
    }
    .wheel-number {
      position: absolute;
      left: 50%;
      top: 50%;
      font-weight: 950;
      font-size: 16px;
      color: #243241;
      z-index: 2;
      transform-origin: 0 0;
    }
    .spin-result { font-weight: 900; min-height: 24px; color: #365064; }

    .floating-tools {
      position: absolute;
      left: 22px;
      bottom: 22px;
      z-index: 91;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 560px;
    }
    .floating-tools button { padding: 10px 13px; font-size: 14px; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(36,50,65,0.28);
      z-index: 200;
      display: grid;
      place-items: center;
      padding: 24px;
      backdrop-filter: blur(4px);
    }
    .modal {
      width: min(860px, 94vw);
      max-height: 90vh;
      overflow: auto;
      background: rgba(255,255,255,0.96);
      border-radius: 30px;
      box-shadow: 0 28px 90px rgba(36,50,65,0.3);
      padding: 26px;
      border: 1px solid rgba(255,255,255,0.95);
    }
    .modal h2 { margin: 0 0 10px; letter-spacing: -0.03em; }
    .modal p { line-height: 1.48; color: #48596d; }
    .options { display: grid; gap: 12px; margin-top: 18px; }
    .option-button {
      border-radius: 20px;
      text-align: left;
      padding: 15px 16px;
      background: #f6fbff;
      border: 2px solid rgba(127,198,238,0.24);
      box-shadow: none;
      font-weight: 750;
    }
    .option-button small { display: block; color: var(--muted); font-weight: 600; margin-top: 6px; line-height: 1.35; }
    .consequence-box {
      margin-top: 16px;
      background: #f0fff6;
      border-radius: 20px;
      padding: 16px;
      border: 1px solid rgba(167,223,189,0.55);
    }

    .panel {
      position: absolute;
      right: 18px;
      top: 92px;
      bottom: 18px;
      width: min(520px, 92vw);
      z-index: 180;
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 20px;
      overflow: auto;
      border: 1px solid rgba(255,255,255,0.95);
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .panel-header h2 { margin: 0; }
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .profile-item {
      background: #f7fbff;
      border-radius: 16px;
      padding: 10px;
      border: 1px solid rgba(127,198,238,0.18);
    }
    .profile-item strong { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .bar {
      height: 9px;
      background: #e6eef5;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .bar span { display: block; height: 100%; background: linear-gradient(90deg, #7fc6ee, #a7dfbd); border-radius: 999px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .tag { background: #fff1ad; padding: 6px 9px; border-radius: 999px; font-size: 12px; font-weight: 750; }
    .log-entry {
      background: #f7fbff;
      border-radius: 18px;
      padding: 13px;
      margin-bottom: 10px;
      border-left: 5px solid #7fc6ee;
    }
    .log-entry strong { display: block; }
    .log-entry span { color: var(--muted); font-size: 13px; }

    .branch-note {
      position: absolute;
      z-index: 60;
      background: rgba(255,255,255,0.9);
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 850;
      color: #365064;
      box-shadow: var(--soft-shadow);
      pointer-events: none;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 115px;
      transform: translateX(-50%);
      z-index: 220;
      background: rgba(36,50,65,0.9);
      color: white;
      border-radius: 999px;
      padding: 11px 16px;
      box-shadow: var(--shadow);
      font-weight: 750;
    }

    @media (max-width: 900px) {
      .start-card { grid-template-columns: 1fr; padding: 24px; overflow: auto; min-height: auto; max-height: 95vh; }
      .decor-map { height: 220px; }
      .topbar { height: auto; align-items: flex-start; flex-direction: column; }
      .board-shell { padding-top: 132px; }
      .spinner-panel { width: 200px; right: 10px; bottom: 10px; }
      .wheel-wrap, .wheel { width: 132px; height: 132px; }
      .toolbar { justify-content: flex-start; }
      .profile-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    "use strict";

    const app = document.getElementById("app");

    const state = {
      mode: null,
      playerCount: 1,
      setupStep: "mode",
      selectedCharacters: [],
      players: [],
      currentPlayerIndex: 0,
      fields: [],
      fieldMap: new Map(),
      branchChoices: {},
      zoom: 0.72,
      panX: 90,
      panY: 80,
      isBusy: false,
      wheelRotation: 0,
      modalOpen: false,
      pathEdges: [],
      cardPools: {},
      usedCards: {},
      lastResult: null
    };

    const typeMeta = {
      entscheidung: { icon: "⚖️", label: "Entscheidung" },
      ereignis: { icon: "🌦️", label: "Ereignis" },
      chance: { icon: "🌱", label: "Chance" },
      risiko: { icon: "⚠️", label: "Risiko" },
      diskussion: { icon: "💬", label: "Diskussion" },
      bildung: { icon: "📚", label: "Bildung" },
      arbeit: { icon: "💼", label: "Arbeit" },
      finanzen: { icon: "💰", label: "Finanzen" },
      konsum: { icon: "🛍️", label: "Konsum" },
      recht: { icon: "📝", label: "Alltag und Recht" },
      familie: { icon: "🤝", label: "Familie" },
      gesundheit: { icon: "🍀", label: "Gesundheit" },
      profil: { icon: "⭐", label: "Profil" },
      bilanz: { icon: "🏁", label: "Lebensbilanz" }
    };

    const characters = [
      { name: "Mia", background: "lebt mit ihren Eltern und zwei jüngeren Geschwistern in einer Mietwohnung.", start: "Die Familie achtet stark aufs Budget und spricht oft über praktische Lösungen." },
      { name: "Noah", background: "wächst in einem ländlichen Umfeld auf.", start: "Die Familie legt Wert auf Sicherheit, Verlässlichkeit und Bodenständigkeit." },
      { name: "Lina", background: "kommt aus einer bildungsnahen Familie.", start: "Zuhause wird viel über Zukunft, Ausbildung und Möglichkeiten gesprochen." },
      { name: "Ben", background: "lebt bei einem alleinerziehenden Elternteil.", start: "Geld ist manchmal knapp, dafür kennt Ben früh Verantwortung im Alltag." },
      { name: "Sara", background: "wohnt in einer grossen Familie.", start: "Zusammenhalt ist wichtig und Entscheidungen betreffen oft mehrere Personen." },
      { name: "Elias", background: "hat viel kreative Freiheit zuhause.", start: "Es gibt viele Ideen, aber nicht immer klare Strukturen." },
      { name: "Leila", background: "lebt in einer Familie, die neu in der Schweiz Fuss gefasst hat.", start: "Bildung wird als wichtige Chance gesehen und Unterstützung wird aktiv gesucht." },
      { name: "Tom", background: "lebt in stabilen Verhältnissen.", start: "Er erwartet, bald selbstständig zu werden und eigene Entscheidungen zu treffen." }
    ];

    const tokenColors = ["#ff8f70", "#60a5fa", "#34c759", "#b477ff"];
    const tokenSymbols = ["M", "N", "L", "B", "S", "E", "T", "A"];

    function defaultProfile(character) {
      return {
        name: character.name,
        background: character.background,
        start: character.start,
        age: 15,
        phase: "Jugend",
        ausbildung: "obligatorische Schule",
        job: "kein Job",
        einkommen: "kein regelmässiges Einkommen",
        geld: 800,
        wohnform: "bei Eltern",
        beziehung: "single",
        kinder: 0,
        kleidungsstil: "praktisch",
        lebensstil: "offen und suchend",
        gesundheit: 55,
        zufriedenheit: 55,
        bildung: 35,
        beziehungen: 55,
        sicherheit: 45,
        freiheit: 55,
        verantwortung: 35,
        risiko: 25,
        wichtigeEntscheidungen: [],
        meilensteine: ["Start mit 15 Jahren"],
        tags: []
      };
    }

    function initGame() {
      state.setupStep = "mode";
      state.mode = null;
      state.playerCount = 1;
      state.selectedCharacters = [];
      state.players = [];
      state.currentPlayerIndex = 0;
      state.fields = [];
      state.fieldMap = new Map();
      state.branchChoices = {};
      state.zoom = 0.72;
      state.panX = 90;
      state.panY = 80;
      state.isBusy = false;
      state.modalOpen = false;
      state.pathEdges = [];
      state.usedCards = {};
      state.cardPools = createCardPools();
      renderStartScreen();
    }

    function renderStartScreen() {
      app.innerHTML = `
        <section class="start-screen">
          <div class="decor-token" style="left:7%; top:10%; right:auto;">🎲</div>
          <div class="decor-token" style="right:7%; bottom:8%; top:auto;">🧭</div>
          <div class="start-card">
            <div class="hero">
              <h1>Lebenswege, Wirtschaft und Recht im Alltag</h1>
              <p>Ein digitales Brettspiel für Sekundarstufe 2. Begleiten Sie eine Spielfigur vom Jugendalter bis zur Lebensbilanz, treffen Sie alltagsnahe Entscheidungen und diskutieren Sie Zielkonflikte rund um Geld, Zeit, Sicherheit, Freiheit, Beziehungen und Verantwortung.</p>
              <div class="decor-map" aria-hidden="true">

      if (t < 0.84) return Math.round(46 + (t - 0.68) / 0.16 * 14);
      return Math.min(80, Math.round(61 + (t - 0.84) / 0.16 * 19));

    function renderPathSvg() {
      const lines = state.pathEdges.map(([a,b,kind]) => {
        const fa = state.fieldMap.get(a), fb = state.fieldMap.get(b);
        if (!fa || !fb) return "";
        const mx = (fa.x + fb.x) / 2;
        const my = (fa.y + fb.y) / 2 - (kind === "branch" ? 42 : 16);
        return `<path class="path-edge" d="M ${fa.x} ${fa.y} Q ${mx} ${my} ${fb.x} ${fb.y}"/><path class="path-line" d="M ${fa.x} ${fa.y} Q ${mx} ${my} ${fb.x} ${fb.y}"/>`;
      }).join("");
      return `<svg class="path-layer" viewBox="0 0 3200 1900">${lines}</svg>`;
    }

    function renderBranchNotes() {
      const notes = [
        [8, "Ausbildungsweg"], [27, "Wohnweg"], [29, "Mobilität"], [37, "Lebensstil"], [39, "Familie"], [55, "Beruf"], [67, "Zeit und Geld"]

    function renderToken(player) {
      const f = state.fieldMap.get(player.position) || state.fields[0];
      const inactive = player.id !== state.currentPlayerIndex && state.mode === "single" ? "inactive" : "";
      return `<div class="token ${inactive}" id="token-${player.id}" style="left:${f.x}px; top:${f.y - 8}px; background:${player.tokenColor};">${player.tokenSymbol}</div>`;
    }

    function renderWheelNumbers() {
      const wheel = document.getElementById("wheel");
      if (!wheel) return;
      const existing = wheel.querySelectorAll(".wheel-number");
      existing.forEach(e => e.remove());
      for (let i = 1; i <= 10; i++) {
        const angle = (i - 0.5) * 36;
        const r = 62;
        const x = Math.sin(angle * Math.PI / 180) * r;
        const y = -Math.cos(angle * Math.PI / 180) * r;
        const n = document.createElement("div");
        n.className = "wheel-number";
        n.style.transform = `translate(${x - 7}px, ${y - 12}px) rotate(${angle}deg)`;
        n.textContent = i;
        wheel.appendChild(n);
      }
    }

    function installDragPan() {
      const viewport = document.getElementById("viewport");
      let dragging = false, startX = 0, startY = 0, baseX = 0, baseY = 0;
      viewport.addEventListener("pointerdown", e => {
        if (e.target.closest("button")) return;
        dragging = true;
        viewport.classList.add("dragging");
        startX = e.clientX;
        startY = e.clientY;
        baseX = state.panX;
        baseY = state.panY;
        viewport.setPointerCapture(e.pointerId);
      });
      viewport.addEventListener("pointermove", e => {
        if (!dragging) return;
        state.panX = baseX + e.clientX - startX;
        state.panY = baseY + e.clientY - startY;
        applyBoardTransform();
      });
      viewport.addEventListener("pointerup", () => {
        dragging = false;
        viewport.classList.remove("dragging");
      });
      viewport.addEventListener("wheel", e => {
        e.preventDefault();
        zoomBoard(e.deltaY < 0 ? 0.06 : -0.06);
      }, { passive: false });
    }

    function applyBoardTransform() {
      const board = document.getElementById("board");
      if (board) board.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
    }

    function zoomBoard(delta) {
      state.zoom = Math.min(1.25, Math.max(0.35, state.zoom + delta));
      applyBoardTransform();
    }

    function fitBoard() {
      const viewport = document.getElementById("viewport");
      if (!viewport) return;
      state.zoom = Math.min(viewport.clientWidth / 3300, viewport.clientHeight / 2000);
      state.panX = 45;
      state.panY = 40;
      applyBoardTransform();

    function focusPlayer() {
      const viewport = document.getElementById("viewport");
      const player = currentPlayer();
      const f = state.fieldMap.get(player.position);
      if (!viewport || !f) return;
      state.panX = viewport.clientWidth / 2 - f.x * state.zoom;
      state.panY = viewport.clientHeight / 2 - f.y * state.zoom;
      applyBoardTransform();
    }

    function currentPlayer() { return state.players[state.currentPlayerIndex]; }

    function spinWheel() {
      if (state.isBusy || state.modalOpen) return;
      const player = currentPlayer();
      if (player.finished) { nextTurn(); return; }
      state.isBusy = true;
      updateControls();
      const result = 1 + Math.floor(Math.random() * 10);
      state.lastResult = result;
      const wheel = document.getElementById("wheel");
      const resultEl = document.getElementById("spinResult");
      state.wheelRotation += 1080 + (10 - result) * 36 + Math.floor(Math.random() * 24);
      wheel.style.transform = `rotate(${state.wheelRotation}deg)`;
      resultEl.textContent = "Das Rad dreht...";
      setTimeout(() => {
        resultEl.textContent = `${result} Felder weiterziehen`;
        movePlayer(player, result);
      }, 2450);
    }

    async function movePlayer(player, steps) {
      player.pendingSteps = steps;
      while (player.pendingSteps > 0 && !player.finished) {
        const field = state.fieldMap.get(player.position);
        if (field.branchOptions && !state.branchChoices[player.id + ":" + field.id]) {
          state.isBusy = false;
          updateControls();
          handleBranchChoice(player, field);
          return;
        }
        const nextId = getNextFieldForPlayer(player, field);
        if (nextId == null) break;
        await animateStep(player, nextId);
        player.position = nextId;
        player.pendingSteps--;
        updateAgeAndPhase(player);
        updateProfile();
        if (player.pendingSteps > 0) await wait(120);
      }
      player.pendingSteps = 0;
      state.isBusy = false;
      updateControls();
      triggerField(player, state.fieldMap.get(player.position));
    }

    function getNextFieldForPlayer(player, field) {
      if (!field) return null;
      if (field.branchOptions) {
        const chosen = state.branchChoices[player.id + ":" + field.id];
        if (chosen) return chosen.nextField;
        return null;
      }
      if (field.next && field.next.length) return field.next[0];
      return null;
    }

    function animateStep(player, nextId) {
      return new Promise(resolve => {
        const f = state.fieldMap.get(nextId);
        const token = document.getElementById("token-" + player.id);
        document.querySelectorAll(".field").forEach(el => el.classList.remove("current"));
        const fieldEl = document.getElementById("field-" + nextId);
        if (fieldEl) fieldEl.classList.add("current");
        if (token && f) {
          token.classList.add("hop");
          token.style.left = f.x + "px";
          token.style.top = (f.y - 8) + "px";
          setTimeout(() => token.classList.remove("hop"), 190);
        }
        setTimeout(resolve, 390);
      });
    }

    function handleBranchChoice(player, field) {
      const instruction = state.mode === "group"
        ? "Diskutieren Sie kurz in der Gruppe. Wählen Sie danach Ihre gemeinsame Entscheidung."
        : `${player.profile.name} ist am Zug. Die anderen dürfen mitdiskutieren, die Person am Zug entscheidet.`;
      openModal(`
        <h2>${field.label}</h2>
        <p><strong>Weggabelung:</strong> Ihre Entscheidung bestimmt den sichtbaren Pfad auf dem Brett.</p>
        <p>${instruction}</p>
        <div class="options">
          ${field.branchOptions.map((opt, i) => `<button class="option-button" onclick="chooseBranch(${player.id}, ${field.id}, ${i})">${opt.text}<small>Dieser Weg wird ab jetzt weitergespielt.</small></button>`).join("")}
        </div>
      `, true);
    }

    function chooseBranch(playerId, fieldId, optionIndex) {
      const player = state.players[playerId];
      const field = state.fieldMap.get(fieldId);
      const opt = field.branchOptions[optionIndex];
      state.branchChoices[player.id + ":" + field.id] = opt;
      applyConsequences(player, opt, opt.text, "Weggabelung");
      closeModal();
      state.isBusy = true;
      updateControls();
      movePlayer(player, player.pendingSteps || 1);
    }

    function triggerField(player, field) {
      if (!field) return;
      updateAgeAndPhase(player);
      updateProfile();
      if (field.type === "bilanz" || field.id === state.fields[state.fields.length - 1].id) {
        player.finished = true;
        showFinalSummary(player);
        return;
      }
      if (field.branchOptions) {
        handleBranchChoice(player, field);
        return;
      }
      const card = drawCardForField(field, player);
      if (card.kind === "decision") showDecisionPopup(player, field, card);
      else showEventPopup(player, field, card);
    }

    function showDecisionPopup(player, field, card) {
      const instruction = state.mode === "group"
        ? "Diskutieren Sie kurz in der Gruppe. Wählen Sie danach Ihre gemeinsame Entscheidung."
        : `${player.profile.name} trifft die Entscheidung. Die anderen dürfen mitdiskutieren.`;
      openModal(`
        <h2>${card.title}</h2>
        <p><strong>Feld:</strong> ${field.label}, ca. ${field.age} Jahre, ${field.phase}</p>
        <p>${card.situation}</p>
        <p><strong>${card.question}</strong></p>
        <p><em>${card.discussionPrompt}</em></p>
        <p>${instruction}</p>
        <div class="options">
          ${card.options.map((o, i) => `<button class="option-button" onclick="selectDecision(${player.id}, '${card.id}', ${i})">${o.text}<small>${o.hint || "Jede Option hat Vor und Nachteile."}</small></button>`).join("")}
        </div>
      `, true);
    }

    function selectDecision(playerId, cardId, optionIndex) {
      const player = state.players[playerId];
      const card = findCard(cardId);
      const option = card.options[optionIndex];
      const changed = applyConsequences(player, option, option.text, card.title);
      openModal(`
        <h2>Folge der Entscheidung</h2>
        <p>${option.consequenceText}</p>
        <div class="consequence-box"><strong>Veränderungen:</strong><br>${changed || "Keine direkten Zahlenänderungen, aber die Entscheidung steht im Lebenslauf."}</div>
        <button class="primary" style="margin-top:18px;" onclick="closeModal(); nextTurn();">Weiter</button>
      `, true);
    }

    function showEventPopup(player, field, card) {
      const changes = applyConsequences(player, card, card.title, card.title);
      openModal(`
        <h2>${card.title}</h2>
        <p><strong>Feld:</strong> ${field.label}, ca. ${field.age} Jahre, ${field.phase}</p>
        <p>${card.situation || card.text}</p>
        ${card.discussionPrompt ? `<p><em>${card.discussionPrompt}</em></p>` : ""}
        <div class="consequence-box"><strong>Folge:</strong><br>${card.consequenceText || changes || "Ein Gesprächsimpuls für die Klasse."}</div>
        <button class="primary" style="margin-top:18px;" onclick="closeModal(); nextTurn();">Weiter</button>
      `, true);
    }

    function applyConsequences(player, source, choiceText, title) {
      const p = player.profile;
      const effects = source.effects || {};
      const changes = [];
      Object.entries(effects).forEach(([k, v]) => {
        if (typeof p[k] === "number") {
          const before = p[k];
          p[k] = k === "geld" ? Math.round(p[k] + v) : clamp(p[k] + v, 0, 100);
          if (p[k] !== before) changes.push(`${labelForKey(k)} ${v > 0 ? "+" : ""}${v}`);
        }
      });
      if (source.profileUpdates) {
        Object.entries(source.profileUpdates).forEach(([k, v]) => { p[k] = v; changes.push(`${labelForKey(k)}: ${v}`); });
      }
      if (source.tagsAdd) source.tagsAdd.forEach(t => { if (!p.tags.includes(t)) p.tags.push(t); });
      if (source.tagsRemove) source.tagsRemove.forEach(t => p.tags = p.tags.filter(x => x !== t));
      if (source.milestone) p.meilensteine.push(source.milestone);
      if (title && choiceText) p.wichtigeEntscheidungen.push(`${p.age}: ${title}, ${choiceText}`);
      applyTagSideEffects(player, source);
      addToLog(player, title || "Ereignis", choiceText || "", source.consequenceText || source.situation || "", changes.join(", "));
      updateProfile();
      return changes.join("<br>");
    }

    function applyTagSideEffects(player, source) {
      const p = player.profile;
      if (source.tagChecks) {
        source.tagChecks.forEach(check => {
          if (p.tags.includes(check.tag)) {
            Object.entries(check.effects || {}).forEach(([k, v]) => {
              if (typeof p[k] === "number") p[k] = k === "geld" ? Math.round(p[k] + v) : clamp(p[k] + v, 0, 100);
            });
            if (check.text) addToLog(player, "Langzeitwirkung", check.tag, check.text, "Tag beeinflusst Ereignis");
          }
        });
      }
    }

    function updateProfile() {
      const player = currentPlayer();
      updateAgeAndPhase(player);
      const el = document.getElementById("turnInfo");
      if (el) {
        el.innerHTML = `${state.mode === "group" ? "Gruppe am Zug" : player.profile.name + " am Zug"} <span>Alter: ${player.profile.age}</span> <span>${player.profile.phase}</span> <span>Geld: ${formatMoney(player.profile.geld)}</span>`;
      }
      document.querySelectorAll(".token").forEach((t, i) => t.classList.toggle("inactive", state.mode === "single" && i !== state.currentPlayerIndex));
      updateControls();
    }

    function updateControls() {
      const spinButton = document.getElementById("spinButton");
      if (spinButton) spinButton.disabled = state.isBusy || state.modalOpen || allFinished();
    }

    function openProfilePanel() {
      const player = currentPlayer();
      const p = player.profile;
      removePanel();
      const panel = document.createElement("aside");
      panel.className = "panel";
      panel.id = "sidePanel";

        <div class="panel-header"><h2>Profil: ${p.name}</h2><button onclick="closeProfilePanel()">Schliessen</button></div>

          ${infoItem("Alter", p.age + " Jahre")}
          ${infoItem("Lebensphase", p.phase)}
          ${infoItem("Ausbildung", p.ausbildung)}
          ${infoItem("Beruf oder Job", p.job)}
          ${infoItem("Einkommen", p.einkommen)}
          ${infoItem("Geld oder Vermögen", formatMoney(p.geld))}
          ${infoItem("Wohnsituation", p.wohnform)}
          ${infoItem("Beziehungsstatus", p.beziehung)}
          ${infoItem("Kinder", p.kinder)}
          ${infoItem("Kleidungsstil", p.kleidungsstil)}
          ${infoItem("Lebensstil", p.lebensstil)}
        </div>
        <h3>Werte</h3>
        ${values.map(k => `<div class="profile-item"><strong>${labelForKey(k)}</strong>${p[k]}<div class="bar"><span style="width:${clamp(p[k],0,100)}%"></span></div></div>`).join("")}
        <h3>Wichtige Entscheidungen</h3>
        <p>${p.wichtigeEntscheidungen.slice(-8).join("<br>") || "Noch keine."}</p>
        <h3>Meilensteine</h3>
        <p>${p.meilensteine.join("<br>")}</p>
        <h3>Langfristige Tags</h3>
        <div class="tag-list">${p.tags.map(t => `<span class="tag">${t}</span>`).join("") || "<span class='tag'>noch keine</span>"}</div>
      `;
      app.appendChild(panel);
    }

    function closeProfilePanel() { removePanel(); }
    function removePanel() { const old = document.getElementById("sidePanel"); if (old) old.remove(); }

    function infoItem(label, value) {
      return `<div class="profile-item"><strong>${label}</strong>${value}</div>`;
    }

    function updateAgeAndPhase(player) {
      const field = state.fieldMap.get(player.position) || state.fields[0];
      player.profile.age = field.age;
      player.profile.phase = field.phase;
      if (player.profile.age >= 65 && player.profile.job !== "pensioniert" && player.profile.job !== "kein Job") {
        player.profile.job = "pensioniert oder reduziert tätig";
        player.profile.einkommen = "Pension, Ersparnisse oder Teilzeit";
      }
    }

    function addToLog(player, title, choice, consequence, changes) {
      player.log.push({ age: player.profile.age, title, choice, consequence, changes, phase: player.profile.phase });
    }

    function openLogbook() {
      const player = currentPlayer();
      removePanel();
      const panel = document.createElement("aside");
      panel.className = "panel";
      panel.id = "sidePanel";
      panel.innerHTML = `
        <div class="panel-header"><h2>Logbuch: ${player.profile.name}</h2><button onclick="removePanel()">Schliessen</button></div>
        ${player.log.length ? player.log.slice().reverse().map(e => `<div class="log-entry"><strong>${e.age} Jahre, ${e.title}</strong><span>${e.phase}</span><p><b>Entscheidung:</b> ${e.choice || "kein Entscheid"}<br><b>Folge:</b> ${e.consequence || ""}<br><b>Änderungen:</b> ${e.changes || "keine direkten Änderungen"}</p></div>`).join("") : "<p>Noch keine Einträge.</p>"}
      `;
      app.appendChild(panel);
    }

    function openRules() {
      openModal(`
        <h2>Regeln</h2>
        <p>Das Drehrad bestimmt ausschliesslich, wie viele Felder die Spielfigur weiterzieht. Es bestimmt nie das Ereignis, die Kategorie oder die Entscheidung.</p>
        <p>Die Figur bewegt sich Feld für Feld. Erst auf dem Zielfeld wird die Karte geöffnet. Bei Weggabelungen wählen Sie zuerst den sichtbaren Pfad, danach geht die Bewegung weiter.</p>
        <p>Im Gruppenmodus spielt eine Gruppe gemeinsam. Im Einzelmodus spielen mehrere Personen abwechselnd mit eigenen Figuren und Profilen.</p>
        <p>Ziel ist nicht eine perfekte Punktzahl, sondern Diskussion über Zielkonflikte, Opportunitätskosten, Verantwortung, Sicherheit, Freiheit und Lebensqualität.</p>
        <button class="primary" onclick="closeModal()">Verstanden</button>
      `, false);
    }

    function openModal(html, blocking) {
      closeModal();
      state.modalOpen = true;
      updateControls();
      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.id = "modalBackdrop";
      backdrop.innerHTML = `<div class="modal">${html}</div>`;
      if (!blocking) backdrop.addEventListener("click", e => { if (e.target === backdrop) closeModal(); });
      app.appendChild(backdrop);
    }

    function closeModal() {
      const old = document.getElementById("modalBackdrop");
      if (old) old.remove();
      state.modalOpen = false;
      updateControls();
    }

    function nextTurn() {
      if (allFinished()) return showClassSummary();
      if (state.mode === "single") {
        let loops = 0;
        do {
          state.currentPlayerIndex = (state.currentPlayerIndex + 1) % state.players.length;
          loops++;
        } while (currentPlayer().finished && loops < 10);
      }
      updateProfile();
      focusPlayer();
    }

    function allFinished() { return state.players.length && state.players.every(p => p.finished); }

    function calculateEndProfile(player) {
      const p = player.profile;
      const tags = p.tags;
      if (p.gesundheit > 70 && p.zufriedenheit > 70 && p.sicherheit > 55 && p.freiheit > 55) return "gesund und ausgeglichen";
      if (p.geld > 9000 && p.gesundheit < 50) return "finanziell stark, aber zeitlich belastet";
      if (tags.includes("freiheitsorientiert") && p.risiko > 55) return "freiheitsorientiert und wechselhaft";
      if (p.sicherheit > 70 && p.risiko < 35) return "sicher und stabil";
      if (p.beziehungen > 75 && p.geld < 3000) return "sozial stark, aber finanziell knapp";
      if (tags.includes("karrierefokussiert")) return "karriereorientiert";
      if (tags.includes("selbstständig")) return "kreativ und unabhängig";
      if (tags.includes("familienorientiert")) return "familienzentriert";
      if (tags.includes("risikofreudig")) return "risikofreudig mit Höhen und Tiefen";
      return "ausgewogenes Leben";
    }

    function showFinalSummary(player) {
      const p = player.profile;
      const endProfile = calculateEndProfile(player);
      const narrative = buildNarrative(player, endProfile);
      openModal(`

    function buildNarrative(player, endProfile) {
      const p = player.profile;
      const parts = [];
      parts.push(`${p.name} erreicht rund 80 Jahre mit dem Profil "${endProfile}".`);
      if (p.tags.includes("hat_gespart")) parts.push("Frühe Sparentscheidungen halfen, spätere Belastungen besser aufzufangen.");
      if (p.tags.includes("gute_ausbildung") || p.tags.includes("weiterbildung")) parts.push("Bildung und Weiterbildung eröffneten zusätzliche berufliche Möglichkeiten.");
      if (p.tags.includes("vertragsbewusst")) parts.push("Sorgfältiger Umgang mit Verträgen reduzierte rechtliche und finanzielle Risiken im Alltag.");
      if (p.tags.includes("schulden")) parts.push("Schulden oder hohe Ausgaben führten zu Druck und machten einige spätere Entscheidungen enger.");
      if (p.tags.includes("gesundheitsbewusst")) parts.push("Gesundheit wurde wiederholt priorisiert und stärkte die Lebensqualität.");
      if (p.tags.includes("familienorientiert")) parts.push("Familie und Beziehungen spielten eine wichtige Rolle und erhöhten die Verantwortung.");
      if (p.tags.includes("selbstständig")) parts.push("Der selbstständige oder kreative Weg brachte Freiheit, aber auch Unsicherheit.");
      return parts.join(" ");
    }

    function restartGame() { initGame(); }

    function drawCardForField(field, player) {
      if (field.type === "entscheidung") return drawFromPool("decisions", player, field);
      if (field.type === "diskussion") return drawFromPool("discussions", player, field);
      if (field.type === "chance" || field.type === "risiko") return drawFromPool("chanceRisk", player, field);
      if (field.type === "bildung" || field.type === "finanzen") {
        if (Math.random() < 0.35) return drawFromPool("info", player, field);
      }
      return drawFromPool("events", player, field);
    }

    function drawFromPool(poolName, player, field) {
      const pool = state.cardPools[poolName];
      state.usedCards[poolName] = state.usedCards[poolName] || [];
      let candidates = pool.filter(c => !state.usedCards[poolName].includes(c.id));
      if (!candidates.length) { state.usedCards[poolName] = []; candidates = pool.slice(); }
      const tagBoost = candidates.filter(c => !c.requiresTag || player.profile.tags.includes(c.requiresTag));
      const finalCandidates = tagBoost.length ? tagBoost : candidates;
      const card = finalCandidates[Math.floor(Math.random() * finalCandidates.length)];
      state.usedCards[poolName].push(card.id);
      return card;
    }

    function findCard(id) {
      for (const pool of Object.values(state.cardPools)) {
        const found = pool.find(c => c.id === id);
        if (found) return found;
      }
      return null;
    }

    function createCardPools() {
      const decisions = createDecisionCards();
      const events = createEventCards();
      const chanceRisk = createChanceRiskCards();
      const discussions = createDiscussionCards();
      const info = createInfoCards();
      return { decisions, events, chanceRisk, discussions, info };
    }

        ["geld_leihen", "Geld an Freund ausleihen?", "Eine Freundin oder ein Freund bittet um Geld. Die Beziehung ist wichtig, aber Rückzahlung ist unklar.", "Was machen Sie?", "Wie balancieren Sie Vertrauen, Hilfe und Eigenverantwortung?", [["Geld leihen ohne Absprache.", "Sie helfen, riskieren aber Konflikte.", { geld:-500, beziehungen:5, risiko:8 }, ["sozial_engagiert"]], ["Kleinen Betrag mit klarer Absprache.", "Sie helfen begrenzt und klären Erwartungen.", { geld:-150, beziehungen:4, verantwortung:6 }, ["vertragsbewusst", "sozial_engagiert"]], ["Kein Geld leihen, anders helfen.", "Sie schützen Ihr Budget, bieten aber Unterstützung.", { sicherheit:4, beziehungen:1, geld:100 }, ["hat_gespart"]]]],
        ["auto_oev", "Auto oder ÖV?", "Ein Auto bietet Freiheit, ist aber teuer. ÖV und Velo sind günstiger, aber nicht immer bequem.", "Welche Mobilität passt?", "Welche Kosten sieht man sofort, welche erst später?", [["Auto kaufen.", "Sie gewinnen Flexibilität, aber Fixkosten steigen.", { geld:-2500, freiheit:9, risiko:5 }, ["mobil_mit_auto", "hohe_ausgaben"]], ["ÖV und Velo nutzen.", "Sie sparen Kosten und bewegen sich mehr.", { geld:600, gesundheit:4, freiheit:-2 }, ["mobil_mit_oev"]], ["Carsharing und ÖV kombinieren.", "Sie bleiben flexibel und begrenzen Kosten.", { geld:100, freiheit:4, verantwortung:4 }, ["mobil_mit_oev", "hat_gespart"]]]],
        ["arbeit_freizeit", "Mehr arbeiten oder mehr Freizeit?", "Sie können mehr Stunden arbeiten oder bewusst Freizeit schützen.", "Was ist wichtiger?", "Wie hängen Einkommen, Gesundheit und Zufriedenheit zusammen?", [["Mehr arbeiten.", "Das Einkommen steigt, aber Erholung wird knapper.", { geld:1400, gesundheit:-5, zufriedenheit:-2, sicherheit:5 }, ["karrierefokussiert"]], ["Arbeitszeit halten.", "Sie bleiben ausgeglichen.", { zufriedenheit:3, gesundheit:3 }, ["ausgewogen"]], ["Freizeit reduzieren nicht akzeptieren.", "Sie setzen Grenzen, verdienen aber weniger.", { freiheit:7, gesundheit:5, geld:-500 }, ["gesundheitsbewusst", "freiheitsorientiert"]]]]
      ];
      const moreTopics = [
        ["Onlinekauf", "Ein Onlineangebot ist sehr günstig, aber Rückgabe und Anbieter sind unklar.", [["Sofort kaufen", { geld:-350, risiko:7, zufriedenheit:3 }, ["hohe_ausgaben"]], ["Bewertungen und Rückgabe prüfen", { sicherheit:7, verantwortung:5 }, ["vertragsbewusst"]], ["Nicht kaufen", { geld:250, sicherheit:3 }, ["hat_gespart"]]]],
        ["Günstig oder langlebig?", "Sie brauchen neue Kleidung oder Geräte. Die günstige Lösung hält vermutlich kürzer.", [["Günstig kaufen", { geld:-150, risiko:4 }, ["konsumorientiert"]], ["Langlebig kaufen", { geld:-450, sicherheit:5, verantwortung:4 }, ["sichere_lebensweise"]], ["Secondhand suchen", { geld:-120, verantwortung:5, zufriedenheit:2 }, ["hat_gespart"]]]],
        ["Beruf wechseln?", "Der aktuelle Job ist sicher, aber nicht erfüllend. Ein Wechsel wäre möglich.", [["Wechseln", { freiheit:8, risiko:8, zufriedenheit:6 }, ["risikofreudig"]], ["Bleiben", { sicherheit:7, zufriedenheit:-3 }, ["sichere_lebensweise"]], ["Nebenbei Optionen prüfen", { verantwortung:5, sicherheit:3, freiheit:3 }, ["vertragsbewusst"]]]],
        ["Wohnort wählen", "Eine teurere Wohnung spart Pendelzeit. Eine günstigere Wohnung liegt weiter weg.", [["Teurer, nah", { geld:-900, gesundheit:4, zufriedenheit:4 }, ["hohe_ausgaben"]], ["Günstiger, weit", { geld:600, gesundheit:-3, freiheit:-2 }, ["hat_gespart"]], ["Kompromiss suchen", { geld:-200, verantwortung:4 }, ["ausgewogen"]]]],
        ["Versicherung prüfen", "Eine Versicherung ist optional oder wirkt unklar. Sie kostet, kann aber Risiken abfedern.", [["Abschliessen", { geld:-350, sicherheit:8, risiko:-4 }, ["sichere_lebensweise"]], ["Nicht abschliessen", { geld:300, risiko:5, freiheit:2 }, ["risikofreudig"]], ["Angebote vergleichen", { geld:-150, sicherheit:5, verantwortung:5 }, ["vertragsbewusst"]]]],
        ["Gesundheit priorisieren", "Stress und Termine nehmen zu. Sport, Schlaf und Pausen brauchen Zeit.", [["Gesundheit priorisieren", { gesundheit:10, zufriedenheit:4, geld:-150 }, ["gesundheitsbewusst"]], ["Durchziehen", { geld:500, gesundheit:-8, verantwortung:2 }, ["karrierefokussiert"]], ["Kleine Routine starten", { gesundheit:5, zufriedenheit:3 }, ["gesundheitsbewusst"]]]],
        ["Beziehung vertiefen", "Eine Beziehung wird ernster. Gemeinsame Pläne geben Halt, schränken aber auch ein.", [["Gemeinsam planen", { beziehungen:10, verantwortung:6, freiheit:-3 }, ["familienorientiert"]], ["Locker halten", { freiheit:6, beziehungen:-2 }, ["freiheitsorientiert"]], ["Offen über Erwartungen sprechen", { beziehungen:6, verantwortung:5 }, ["stabiles_netzwerk"]]]],
        ["Angehörige unterstützen", "Ein Familienmitglied braucht Hilfe. Zeit und Geld sind begrenzt.", [["Viel unterstützen", { beziehungen:8, verantwortung:8, geld:-500, gesundheit:-2 }, ["sozial_engagiert"]], ["Grenzen setzen", { gesundheit:5, freiheit:4, beziehungen:-1 }, ["gesundheitsbewusst"]], ["Hilfe organisieren", { verantwortung:7, beziehungen:4, sicherheit:3 }, ["stabiles_netzwerk"]]]],
        ["Pension vorbereiten", "Das spätere Leben wirkt weit weg, aber Entscheidungen heute beeinflussen späteren Spielraum.", [["Mehr vorsorgen", { geld:-500, sicherheit:10, freiheit:-2 }, ["hat_gespart"]], ["Geld jetzt nutzen", { zufriedenheit:5, geld:-700, sicherheit:-5 }, ["konsumorientiert"]], ["Mittelweg", { sicherheit:5, zufriedenheit:2 }, ["ausgewogen"]]]],
        ["Arbeitsvertrag", "Ein neuer Arbeitsvertrag liegt vor. Lohn, Probezeit und Arbeitszeiten stehen darin.", [["Direkt unterschreiben", { zufriedenheit:4, risiko:6 }, ["vertrag_schnell_unterschrieben"]], ["In Ruhe prüfen", { sicherheit:7, verantwortung:5 }, ["vertragsbewusst"]], ["Nachfragen stellen", { sicherheit:5, beziehungen:2, verantwortung:5 }, ["vertragsbewusst"]]]]
      ];
      let cards = base.map(toDecisionCard);
      moreTopics.forEach((t, index) => cards.push(makeDecisionFromTopic(index, t)));
      const templates = ["Budgetplan erstellen", "Kleiderstil für Bewerbung", "Freizeitabo", "Sparen für Notfälle", "Teilzeit oder Vollzeit", "Haustier anschaffen", "Grosse Feier", "Neue Ausbildung", "Mitbewohnerkonflikt", "Lohnverhandlung", "Freiwilligenarbeit", "Datenschutz im Alltag", "Mahnung erhalten", "Haushaltsbudget", "Gemeinsame Wohnung", "Krankenkassenmodell", "Abo kündigen", "Investition in Hobby", "Karrierechance", "Pflege im Umfeld", "Lebensstil vereinfachen", "Ferien im Alter", "Erbe und Verantwortung", "Selbstständiges Projekt", "Rückgabe im Laden", "Teure Gewohnheit", "Freundschaft pflegen", "Arbeitspensum senken", "Neue Stadt", "Unterschrift für andere"];
      templates.forEach((title, i) => cards.push(genericDecision(i, title)));
      return cards.slice(0, 55);
    }

    function toDecisionCard(row) {
      return { id: row[0], kind: "decision", title: row[1], situation: row[2], question: row[3], discussionPrompt: row[4], options: row[5].map(o => ({ text: o[0], consequenceText: o[1], effects: o[2], tagsAdd: o[3] })) };
    }

    function makeDecisionFromTopic(index, t) {
      return { id: "topic_decision_" + index, kind: "decision", title: t[0], situation: t[1], question: "Welche Option passt zu Ihren Prioritäten?", discussionPrompt: "Diskutieren Sie Vor und Nachteile. Es gibt meist keine eindeutig richtige Lösung.", options: t[2].map(o => ({ text: o[0], consequenceText: "Die Entscheidung verändert Ihren Lebensweg spürbar.", effects: o[1], tagsAdd: o[2] })) };
    }

    function genericDecision(i, title) {
      return { id: "generic_decision_" + i, kind: "decision", title, situation: `Im Alltag taucht die Frage "${title}" auf. Die Ressourcen Geld, Zeit, Sicherheit und Freiheit sind begrenzt.`, question: "Wie gehen Sie vor?", discussionPrompt: "Welche Bedürfnisse stehen im Vordergrund und welche Opportunitätskosten entstehen?", options: [
        { text: "Sicher und gut informiert handeln.", consequenceText: "Sie reduzieren Risiken, investieren aber Zeit und manchmal Geld.", effects: { sicherheit:5, verantwortung:5, freiheit:-1, geld:-120 }, tagsAdd:["vertragsbewusst", "sichere_lebensweise"] },
        { text: "Schnell entscheiden und Chance nutzen.", consequenceText: "Sie gewinnen Tempo und Freiheit, tragen aber mehr Risiko.", effects: { freiheit:5, risiko:6, zufriedenheit:2, geld:-180 }, tagsAdd:["risikofreudig"] },
        { text: "Abwarten und Budget schützen.", consequenceText: "Sie sparen Geld, verzichten aber vielleicht auf eine Chance.", effects: { geld:250, sicherheit:3, zufriedenheit:-1 }, tagsAdd:["hat_gespart"] }
      ] };
    }

    function createEventCards() {
      const topics = ["Erster Lohn kommt", "Unerwartete Rechnung", "Gute Rückmeldung", "Freundeskreis verändert sich", "Prüfung bestanden", "Prüfung misslingt", "Nebenjobangebot", "Wohnung wird teurer", "Team unterstützt Sie", "Stressige Woche", "Kleiner Unfall", "Günstige Gelegenheit", "Familienfest", "Neues Hobby", "Arbeitsweg nervt", "Chef lobt Sie", "Konflikt im Team", "Budget geht auf", "Budget reicht nicht", "Krankheit im Umfeld", "Abo läuft weiter", "Vertrag wird verlängert", "Umzug möglich", "Kind braucht Zeit", "Weiterbildung zahlt sich aus", "Freund hilft", "Schlaf kommt zu kurz", "Spontaner Ausflug", "Sparziel erreicht", "Reparatur nötig", "Nebenkosten steigen", "Lohnerhöhung", "Pensum ändert", "Pension rückt näher", "Zeit für Rückblick", "Erfahrung hilft", "Netzwerk trägt", "Gesundheitscheck", "Neue Verantwortung", "Lebensfreude im Alltag"];
      return topics.map((title, i) => {
        const positive = i % 3 === 0;
        const risky = i % 5 === 0;
        return { id: "event_" + i, kind: "event", title, situation: eventText(title), consequenceText: positive ? "Das Ereignis stärkt Ihren Weg." : risky ? "Das Ereignis belastet Sie etwas, zeigt aber wichtige Zusammenhänge." : "Das Ereignis verändert den Alltag leicht.", effects: positive ? { zufriedenheit:4, beziehungen:2, geld: i % 2 ? 0 : 250 } : risky ? { geld:-350, gesundheit:-3, risiko:3 } : { verantwortung:2, zufriedenheit:1 }, tagsAdd: positive && i % 4 === 0 ? ["stabiles_netzwerk"] : [] };
      });
    }

    function eventText(title) { return `${title}. Im Alltag zeigt sich, dass Lebenswege nicht nur aus geplanten Entscheidungen bestehen. Kleine Ereignisse können Budget, Beziehungen, Gesundheit oder Sicherheit beeinflussen.`; }

    function createChanceRiskCards() {
      const cards = [];
      const titles = ["Rücklage hilft", "Spontane Ausgabe", "Jobchance", "Projekt scheitert", "Gesundheitsbonus", "Vertragsproblem", "Netzwerk öffnet Tür", "Reparaturkosten", "Weiterbildung bringt Vorteil", "Konsumfalle", "Gute Beratung", "Mahnung", "Freundschaft trägt", "Selbstständige Chance", "Markt verändert sich", "Krankheitsphase", "Günstiger Umzug", "Auto kostet", "ÖV spart", "Familie unterstützt", "Unklare Rechnung", "Nebenverdienst", "Zeitdruck", "Sicherheitsnetz", "Glücklicher Zufall", "Teure Gewohnheit", "Erholung wirkt", "Risiko zahlt sich aus", "Risiko rächt sich", "Sparplan funktioniert"];
      titles.forEach((title, i) => {
        const chance = i % 2 === 0;
        cards.push({ id: "chance_risk_" + i, kind: "event", title, situation: `${title}. Je nach früheren Entscheidungen kann die Wirkung stärker oder schwächer ausfallen.`, consequenceText: chance ? "Eine Chance verbessert Ihre Lage." : "Ein Risiko belastet Ihre Lage.", effects: chance ? { geld:350, zufriedenheit:3, sicherheit:2 } : { geld:-450, risiko:4, gesundheit:-2 }, tagsAdd: chance ? ["stabiles_netzwerk"] : [], tagChecks: [
          { tag: "hat_gespart", effects: { geld: 300, sicherheit: 3 }, text: "Frühes Sparen federt die Situation ab." },
          { tag: "vertragsbewusst", effects: { risiko: -3, sicherheit: 3 }, text: "Vertragsbewusstsein reduziert Probleme." },
          { tag: "gesundheitsbewusst", effects: { gesundheit: 3 }, text: "Gesundheitsbewusstsein wirkt langfristig positiv." },
          { tag: "schulden", effects: { geld: -250, sicherheit: -2 }, text: "Schulden verstärken den Druck." }
        ] });
      });
      return cards.slice(0, 30);
    }

    function createDiscussionCards() {
      const prompts = [
        "Ist ein teurer Wunsch automatisch unvernünftig?", "Was bedeutet ein gutes Leben neben Geld?", "Wann ist Sicherheit wichtiger als Freiheit?", "Wie stark soll Familie Entscheidungen prägen?", "Soll man Risiken vermeiden oder lernen, mit ihnen umzugehen?", "Welche Rolle spielt Bildung für Lebensqualität?", "Was ist fair, wenn Geld in Freundschaften vorkommt?", "Wann lohnt sich ein Vertrag, auch wenn er bindet?", "Ist Konsum eher Bedürfnisbefriedigung oder sozialer Druck?", "Wie viel Verantwortung kann man jungen Menschen zumuten?", "Wann ist eine günstige Lösung langfristig teuer?", "Wie erkennt man Opportunitätskosten im Alltag?", "Soll man für später vorsorgen oder jetzt leben?", "Wie verändert Pendelzeit die Lebensqualität?", "Welche Pflichten entstehen durch Unterschriften?", "Was ist wichtiger, beruflicher Status oder Gesundheit?", "Warum sprechen viele Menschen ungern über Geld?", "Wie beeinflusst Werbung Bedürfnisse?", "Welche Entscheidungen sind individuell, welche gesellschaftlich geprägt?", "Was bedeutet finanzielle Freiheit?", "Wie entstehen Schulden im Alltag?", "Welche Rolle spielt Glück im Lebenslauf?"

      return prompts.map((prompt, i) => ({ id: "discussion_" + i, kind: "event", title: "Diskussionsfeld", situation: prompt, discussionPrompt: "Tauschen Sie kurz unterschiedliche Sichtweisen aus. Danach geht das Spiel weiter.", consequenceText: "Die Diskussion stärkt Reflexion und Perspektivenwechsel.", effects: { bildung:2, verantwortung:2, zufriedenheit:1 }, tagsAdd: i % 4 === 0 ? ["sozial_engagiert"] : [] }));
    }

      const infos = [
        ["Knappheit", "Zeit, Geld und Energie sind begrenzt. Darum muss man auswählen, was einem wichtiger ist."],

    function labelForKey(k) {
      const labels = { geld:"Geld", zufriedenheit:"Zufriedenheit", gesundheit:"Gesundheit", bildung:"Bildung und Kompetenzen", beziehungen:"Beziehungen", sicherheit:"Sicherheit", freiheit:"Freiheit", verantwortung:"Verantwortung", risiko:"Risiko", ausbildung:"Ausbildung", job:"Beruf oder Job", wohnform:"Wohnsituation", beziehung:"Beziehungsstatus", kinder:"Kinder" };
      return labels[k] || k;
    }

    function formatMoney(v) { return new Intl.NumberFormat("de-CH", { style:"currency", currency:"CHF", maximumFractionDigits:0 }).format(v); }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    function showToast(text) {
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = text;
      app.appendChild(t);
      setTimeout(() => t.remove(), 2200);
    }

    window.initGame = initGame;
    window.renderStartScreen = renderStartScreen;
