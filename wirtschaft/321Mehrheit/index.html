<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3, 2, 1, Mehrheit!</title>
  <style>
    :root {
      --red: #ef4444;
      --red-dark: #dc2626;
      --red-soft: #fee2e2;
      --blue: #3b82f6;
      --blue-dark: #2563eb;
      --blue-soft: #dbeafe;
      --text: #172033;
      --muted: #667085;
      --line: #e6eaf2;
      --card: rgba(255, 255, 255, 0.92);
      --bg: #f6f8fc;
      --gold: #f5b301;
      --green: #16a34a;
      --shadow: 0 20px 60px rgba(18, 32, 60, 0.12);
      --shadow-soft: 0 12px 35px rgba(18, 32, 60, 0.09);
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(239, 68, 68, 0.15), transparent 32%),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.16), transparent 34%),
        linear-gradient(135deg, #fbfcff 0%, #edf3ff 100%);
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .app {
      min-height: 100vh;
      padding: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: min(1200px, 100%);
      animation: screenIn 420ms ease both;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
      align-items: stretch;
    }

    .panel {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(24px, 4vw, 46px);
      backdrop-filter: blur(16px);
    }

    .hero-card {
      position: relative;
      overflow: hidden;
    }

    .hero-card::before,
    .hero-card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 999px;
      filter: blur(8px);
      opacity: 0.14;
      z-index: 0;
    }

    .hero-card::before {
      background: var(--red);
      right: -90px;
      top: -90px;
    }

    .hero-card::after {
      background: var(--blue);
      left: -80px;
      bottom: -90px;
    }

    .hero-card > * {
      position: relative;
      z-index: 1;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 750;
      font-size: 0.92rem;
      box-shadow: 0 8px 22px rgba(18, 32, 60, 0.06);
    }

    .badge.red {
      color: var(--red-dark);
      background: var(--red-soft);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .badge.blue {
      color: var(--blue-dark);
      background: var(--blue-soft);
      border-color: rgba(59, 130, 246, 0.2);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: 0.94;
      letter-spacing: -0.07em;
    }

    h2 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 4vw, 3.4rem);
      letter-spacing: -0.045em;
      line-height: 1;
    }

    h3 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.7rem);
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 18px 0 0;
      font-size: clamp(1.12rem, 2vw, 1.55rem);
      color: var(--muted);
      line-height: 1.45;
    }

    .lead {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.65;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 14px 22px;
      border-radius: 18px;
      font-weight: 850;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(135deg, #1f2937, #111827);
      box-shadow: 0 14px 32px rgba(17, 24, 39, 0.18);
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(17, 24, 39, 0.22);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.red {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      box-shadow: 0 14px 32px rgba(239, 68, 68, 0.22);
    }

    .btn.blue {
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      box-shadow: 0 14px 32px rgba(59, 130, 246, 0.22);
    }

    .btn.light {
      color: var(--text);
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 10px 25px rgba(18, 32, 60, 0.08);
    }

    .btn.green {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 14px 32px rgba(34, 197, 94, 0.22);
    }

    .mini-preview {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .option-preview {
      border-radius: 28px;
      padding: 28px;
      color: white;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-soft);
      transform: rotate(-1.2deg);
    }

    .option-preview:nth-child(2) {
      transform: rotate(1.2deg);
    }

    .option-preview.red {
      background: linear-gradient(135deg, #fb7185, var(--red-dark));
    }

    .option-preview.blue {
      background: linear-gradient(135deg, #60a5fa, var(--blue-dark));
    }

    .thumb {
      font-size: 3.8rem;
      line-height: 1;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.16));
    }

    .option-preview strong {
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }

    .instruction-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 24px;
    }

    .info-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 12px 28px rgba(18, 32, 60, 0.07);
      color: var(--muted);
      line-height: 1.55;
    }

    .info-card strong {
      display: block;
      color: var(--text);
      margin-bottom: 6px;
      font-size: 1.08rem;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 22px;
      align-items: start;
    }

    .form-control {
      margin-top: 20px;
    }

    label {
      display: block;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 8px;
    }

    select, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 14px 16px;
      color: var(--text);
      outline: none;
      font-weight: 750;
      box-shadow: inset 0 0 0 1px transparent;
      transition: box-shadow 160ms ease, border-color 160ms ease;
    }

    select:focus, input:focus {
      border-color: rgba(59, 130, 246, 0.55);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
    }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-height: 55vh;
      overflow: auto;
      padding-right: 6px;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 22px;
      align-items: start;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .round-pill {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 900;
      color: var(--muted);
      box-shadow: 0 8px 22px rgba(18, 32, 60, 0.06);
    }

    .points-pill {
      background: #fff8dc;
      color: #9a6500;
      border: 1px solid rgba(245, 179, 1, 0.3);
    }

    .question-card {
      position: relative;
      overflow: hidden;
    }

    .category {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #6b4d00;
      background: #fff8dc;
      border: 1px solid rgba(245, 179, 1, 0.28);
      border-radius: 999px;
      padding: 9px 14px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .question-title {
      font-size: clamp(2.1rem, 4vw, 4.4rem);
      line-height: 1;
      letter-spacing: -0.055em;
      margin: 0 0 16px;
    }

    .situation {
      font-size: clamp(1.2rem, 2vw, 1.65rem);
      color: var(--muted);
      line-height: 1.45;
      margin: 0 0 24px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin: 24px 0;
    }

    .option-card {
      border-radius: 28px;
      min-height: 230px;
      padding: 26px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-soft);
      transform: translateZ(0);
      transition: transform 180ms ease;
    }

    .option-card:hover {
      transform: translateY(-3px);
    }

    .option-card.red {
      background: linear-gradient(135deg, #fb7185 0%, var(--red) 48%, var(--red-dark) 100%);
    }

    .option-card.blue {
      background: linear-gradient(135deg, #60a5fa 0%, var(--blue) 48%, var(--blue-dark) 100%);
    }

    .option-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .option-label {
      font-size: 1.1rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.92;
    }

    .option-meaning {
      margin-top: 4px;
      opacity: 0.88;
      font-weight: 800;
    }

    .option-text {
      margin: 0;
      font-size: clamp(1.4rem, 2.4vw, 2.2rem);
      line-height: 1.16;
      letter-spacing: -0.035em;
      font-weight: 950;
    }

    .prompt-box {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      color: var(--muted);
      line-height: 1.5;
      box-shadow: 0 10px 24px rgba(18, 32, 60, 0.06);
    }

    .prompt-box strong {
      color: var(--text);
    }

    .leaderboard {
      position: sticky;
      top: 20px;
      padding: 22px;
    }

    .leader-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
      max-height: 62vh;
      overflow: auto;
      padding-right: 4px;
    }

    .leader-row {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 9px;
      align-items: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 8px 18px rgba(18, 32, 60, 0.05);
      transition: transform 160ms ease, background 160ms ease;
    }

    .leader-row.bump {
      animation: scoreBump 700ms ease both;
    }

    @keyframes scoreBump {
      0% { transform: scale(1); background: #fff; }
      35% { transform: scale(1.04); background: #ecfdf5; }
      100% { transform: scale(1); background: #fff; }
    }

    .place {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #f0f4fb;
      font-weight: 950;
      color: var(--muted);
    }

    .leader-name {
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leader-points {
      font-weight: 950;
      color: var(--text);
    }

    .modal-like {
      text-align: center;
      max-width: 850px;
      margin: 0 auto;
    }

    .countdown {
      font-size: clamp(5rem, 16vw, 13rem);
      font-weight: 1000;
      line-height: 0.9;
      letter-spacing: -0.08em;
      margin: 30px 0;
      background: linear-gradient(135deg, var(--red), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: pop 600ms ease both;
    }

    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .majority-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .choice-btn {
      border-radius: 24px;
      padding: 24px;
      min-height: 150px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      justify-content: center;
      font-weight: 950;
      font-size: 1.15rem;
      box-shadow: var(--shadow-soft);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .choice-btn:hover {
      transform: translateY(-3px);
    }

    .choice-btn.red { background: linear-gradient(135deg, var(--red), var(--red-dark)); }
    .choice-btn.blue { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); }
    .choice-btn.neutral { background: linear-gradient(135deg, #64748b, #334155); }
    .choice-icon { font-size: 3rem; }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .player-chip {
      background: #fff;
      border: 2px solid var(--line);
      color: var(--text);
      border-radius: 18px;
      padding: 15px;
      text-align: left;
      font-weight: 900;
      box-shadow: 0 9px 22px rgba(18, 32, 60, 0.06);
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .player-chip:hover {
      transform: translateY(-2px);
    }

    .player-chip.selected {
      border-color: var(--green);
      background: #ecfdf5;
      color: #166534;
      box-shadow: 0 14px 28px rgba(22, 163, 74, 0.13);
    }

    .summary-card {
      text-align: center;
    }

    .score-flash {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      height: 150px;
      border-radius: 999px;
      color: #7a4f00;
      background: radial-gradient(circle, #fff7c2, #fde68a);
      font-size: 2.7rem;
      font-weight: 1000;
      box-shadow: 0 25px 70px rgba(245, 179, 1, 0.25);
      animation: prize 900ms ease both;
      margin: 16px auto;
    }

    @keyframes prize {
      0% { transform: scale(0.5) rotate(-8deg); opacity: 0; }
      55% { transform: scale(1.08) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .final-list {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .final-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 14px;
      align-items: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 10px 26px rgba(18, 32, 60, 0.06);
    }

    .final-row.winner {
      border-color: rgba(245, 179, 1, 0.45);
      background: linear-gradient(135deg, #fffdf0, #ffffff);
      box-shadow: 0 18px 45px rgba(245, 179, 1, 0.14);
    }

    .reflections {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .reflection {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      color: var(--muted);
      font-weight: 750;
      text-align: left;
    }

    .small-note {
      color: var(--muted);
      line-height: 1.55;
      margin-top: 12px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 980px) {
      .hero,
      .setup-grid,
      .game-layout {
        grid-template-columns: 1fr;
      }

      .leaderboard {
        position: static;
      }

      .leader-list {
        max-height: 280px;
      }
    }

    @media (max-width: 760px) {
      .app {
        padding: 18px;
      }

      .panel {
        padding: 22px;
        border-radius: 22px;
      }

      .options-grid,
      .instruction-grid,
      .majority-grid,
      .reflections,
      .name-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="app"></main>

  <script>
    const TOTAL_ROUNDS = 15;
    const QUESTIONS_PER_CATEGORY = 3;

    const cardsByCategory = {
      "Locker & schnell": [
        { category: "Locker & schnell", title: "Znüni oder sparen?", situation: "Sie haben in der Pause 8 Franken dabei.", optionA: "Sie kaufen sich etwas Feines am Kiosk.", optionB: "Sie sparen das Geld für später.", discussionPrompt: "Was zählt mehr, kleine Freude sofort oder Geld für später?" },
        { category: "Locker & schnell", title: "Markenpulli oder günstiger Pulli?", situation: "Sie brauchen einen neuen Pulli.", optionA: "Sie kaufen den teuren Markenpulli.", optionB: "Sie kaufen einen günstigeren Pulli ohne bekannte Marke.", discussionPrompt: "Wie wichtig ist eine Marke im Alltag?" },
        { category: "Locker & schnell", title: "Streamingabo behalten?", situation: "Sie nutzen Ihr Streamingabo kaum noch.", optionA: "Sie behalten es trotzdem.", optionB: "Sie kündigen es.", discussionPrompt: "Warum behalten Menschen Abos, die sie kaum nutzen?" },
        { category: "Locker & schnell", title: "Essen bestellen oder selber kochen?", situation: "Sie haben Hunger, aber keine Lust zu kochen.", optionA: "Sie bestellen Essen.", optionB: "Sie kochen etwas Einfaches.", discussionPrompt: "Wann lohnt sich Bequemlichkeit?" },
        { category: "Locker & schnell", title: "Spontan ins Kino?", situation: "Freunde fragen spontan, ob Sie mit ins Kino kommen.", optionA: "Sie gehen mit.", optionB: "Sie bleiben zuhause und sparen.", discussionPrompt: "Wie wichtig sind spontane Erlebnisse?" },
        { category: "Locker & schnell", title: "Neues Handycase?", situation: "Sie sehen ein stylisches Handycase. Ihr altes funktioniert noch.", optionA: "Sie kaufen das neue Case.", optionB: "Sie behalten das alte.", discussionPrompt: "Wann wird ein Wunsch zum unnötigen Kauf?" },
        { category: "Locker & schnell", title: "Energy Drink jeden Morgen?", situation: "Ein Energy Drink gibt Ihnen morgens gefühlt mehr Energie.", optionA: "Sie kaufen jeden Morgen einen.", optionB: "Sie verzichten öfter darauf.", discussionPrompt: "Welche kleinen Ausgaben summieren sich?" },
        { category: "Locker & schnell", title: "Teure Kopfhörer?", situation: "Ihre Kopfhörer sind okay, aber nicht besonders gut.", optionA: "Sie kaufen hochwertige Kopfhörer.", optionB: "Sie warten noch.", discussionPrompt: "Wann lohnt sich Qualität?" },
        { category: "Locker & schnell", title: "Spontaner Wochenendausflug?", situation: "Ein günstiger Ausflug klingt attraktiv, kostet aber trotzdem Geld.", optionA: "Sie gehen mit.", optionB: "Sie bleiben zuhause und sparen.", discussionPrompt: "Wie entscheidet man zwischen Erlebnis und Budget?" },
        { category: "Locker & schnell", title: "Trend mitmachen?", situation: "Viele kaufen gerade ein bestimmtes Produkt.", optionA: "Sie kaufen es auch.", optionB: "Sie warten, ob Sie es wirklich brauchen.", discussionPrompt: "Wie stark beeinflussen Trends unser Konsumverhalten?" },
        { category: "Locker & schnell", title: "Teurer Haarschnitt?", situation: "Sie möchten einen neuen Look.", optionA: "Sie gehen zu einem teuren Coiffeur.", optionB: "Sie wählen eine günstigere Variante.", discussionPrompt: "Wie viel darf Auftreten kosten?" },
        { category: "Locker & schnell", title: "Neue Schuhe?", situation: "Ihre Schuhe sind noch tragbar, aber nicht mehr modern.", optionA: "Sie kaufen neue.", optionB: "Sie tragen die alten weiter.", discussionPrompt: "Was bedeutet “brauchen” beim Konsum?" },
        { category: "Locker & schnell", title: "Game kaufen?", situation: "Ein neues Spiel ist gerade im Angebot.", optionA: "Sie kaufen es sofort.", optionB: "Sie warten, bis es günstiger wird.", discussionPrompt: "Warum wirken Angebote so verlockend?" },

          </div>
        </section>
      `;
    }

    function setupPlayers(existingCount = state.players.length || 6) {
      const count = Math.min(30, Math.max(2, Number(existingCount) || 6));
      const oldNames = state.players.map(player => player.name);
      app.innerHTML = `
        <section class="screen setup-grid">
          <div class="panel">
            <h2>Spielende</h2>
            <p class="small-note">Wählen Sie 2 bis 30 Spielerinnen und Spieler. Leere Namen werden automatisch ersetzt.</p>
            <div class="form-control">
              <label for="playerCount">Anzahl Spielerinnen und Spieler</label>
              <select id="playerCount" onchange="renderNameInputs(Number(this.value))">
                ${Array.from({ length: 29 }, (_, index) => index + 2).map(number => `<option value="${number}" ${number === count ? "selected" : ""}>${number}</option>`).join("")}
              </select>
            </div>
            <div class="btn-row">
              <button class="btn light" onclick="renderInstructions()">Zurück</button>
              <button class="btn" onclick="startGameFromNames()">Spiel beginnen</button>
            </div>
          </div>
          <div class="panel">
            <h3>Namen eintragen</h3>
            <p class="small-note">Sie können später zur Namenseingabe zurückgehen, solange das Spiel noch nicht gestartet ist.</p>
            <div id="nameInputs" class="name-grid"></div>
          </div>
        </section>
      `;
      renderNameInputs(count, oldNames);
    }

    function renderNameInputs(count, presetNames = null) {
      const container = document.getElementById("nameInputs");
      const names = presetNames || Array.from(document.querySelectorAll(".name-input")).map(input => input.value);
      container.innerHTML = Array.from({ length: count }, (_, index) => `
        <div>
          <label for="player-${index}">Person ${index + 1}</label>
          <input class="name-input" id="player-${index}" maxlength="32" value="${escapeHtml(names[index] || "")}" placeholder="Spieler ${index + 1}" />
        </div>
      `).join("");
    }

    function startGameFromNames() {
      const inputs = Array.from(document.querySelectorAll(".name-input"));
      state.players = inputs.map((input, index) => ({
        id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${index}`,
        name: input.value.trim() || `Spieler ${index + 1}`,
        points: 0
      }));
      state.sameNamesAvailable = true;
      state.gameCards = generateGameCards();
      state.currentRoundIndex = 0;
      state.majority = null;
      state.selectedPlayerIds = new Set();
      state.lastAwardedIds = new Set();
      renderRound();
    }

    function generateGameCards() {
      const selected = [];
      Object.keys(cardsByCategory).forEach(category => {
        const categoryCards = shuffleCards([...cardsByCategory[category]]);
        selected.push(...categoryCards.slice(0, QUESTIONS_PER_CATEGORY));
      });
      return shuffleCards(selected);
    }

    function shuffleCards(cards) {
      for (let index = cards.length - 1; index > 0; index--) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [cards[index], cards[randomIndex]] = [cards[randomIndex], cards[index]];
      }
      return cards;
    }

    function renderRound() {
      state.majority = null;
      state.selectedPlayerIds = new Set();
      state.lastAwardedIds = new Set();
      const roundNumber = state.currentRoundIndex + 1;
      const card = state.gameCards[state.currentRoundIndex];
      app.innerHTML = `
        <section class="screen game-layout">
          <div>
            <div class="topbar">
              <div class="round-pill">Runde ${roundNumber} von ${TOTAL_ROUNDS}</div>
              <div class="round-pill points-pill">Diese Runde zählt ${roundNumber} Punkte</div>
              <button class="btn light" onclick="endGame()">Spiel beenden</button>
            </div>
            <div class="panel question-card">
              <div class="category">Kategorie: ${escapeHtml(card.category)}</div>
              <h2 class="question-title">${escapeHtml(card.title)}</h2>
              <p class="situation">${escapeHtml(card.situation)}</p>
              <div class="options-grid">
                <div class="option-card red">
                  <div class="option-head">
                    <div>
                      <div class="option-label">Option A</div>
                      <div class="option-meaning">Daumen nach oben</div>
                    </div>
                    <div class="thumb">👍</div>
                  </div>
                  <p class="option-text">${escapeHtml(card.optionA)}</p>
                </div>
                <div class="option-card blue">
                  <div class="option-head">
                    <div>
                      <div class="option-label">Option B</div>
                      <div class="option-meaning">Daumen nach unten</div>
                    </div>
                    <div class="thumb">👎</div>
                  </div>
                  <p class="option-text">${escapeHtml(card.optionB)}</p>
                </div>
              </div>
              <div class="prompt-box"><strong>Diskussionsimpuls:</strong> <span>${escapeHtml(card.discussionPrompt)}</span></div>
              <div class="btn-row">
                <button class="btn" onclick="startCountdown()">3, 2, 1, abstimmen</button>
              </div>
            </div>
          </div>
          ${updateLeaderboard()}
        </section>
      `;
    }

    function startCountdown() {
      const roundNumber = state.currentRoundIndex + 1;
      const card = state.gameCards[state.currentRoundIndex];
      let steps = ["3", "2", "1", "Abstimmen!"];
      let index = 0;

      app.innerHTML = `
        <section class="screen game-layout">
          <div>
            <div class="topbar">
              <div class="round-pill">Runde ${roundNumber} von ${TOTAL_ROUNDS}</div>
              <div class="round-pill points-pill">Diese Runde zählt ${roundNumber} Punkte</div>
              <button class="btn light" onclick="endGame()">Spiel beenden</button>
            </div>
            <div class="panel question-card">
              <div class="category">Kategorie: ${escapeHtml(card.category)}</div>
              <h2 class="question-title">${escapeHtml(card.title)}</h2>
              <p class="situation">${escapeHtml(card.situation)}</p>
              <div id="countdown" class="countdown" style="font-size: clamp(4rem, 11vw, 9rem); margin: 12px 0 24px; text-align: center;">3</div>
              <div class="options-grid">
                <div class="option-card red">
                  <div class="option-head">
                    <div>
                      <div class="option-label">Option A</div>
                      <div class="option-meaning">Daumen nach oben</div>
                    </div>
                    <div class="thumb">👍</div>
                  </div>
                  <p class="option-text">${escapeHtml(card.optionA)}</p>
                </div>
                <div class="option-card blue">
                  <div class="option-head">
                    <div>
                      <div class="option-label">Option B</div>
                      <div class="option-meaning">Daumen nach unten</div>
                    </div>
                    <div class="thumb">👎</div>
                  </div>
                  <p class="option-text">${escapeHtml(card.optionB)}</p>
                </div>
              </div>
              <div class="prompt-box"><strong>Jetzt abstimmen:</strong> <span>Alle stimmen gleichzeitig per Handzeichen ab. Rot bedeutet Option A, blau bedeutet Option B.</span></div>
            </div>
          </div>
          ${updateLeaderboard()}
        </section>
      `;

      const interval = setInterval(() => {
        index++;
        const countdown = document.getElementById("countdown");
        if (index < steps.length) {
          countdown.textContent = steps[index];
          countdown.style.animation = "none";
          countdown.offsetHeight;
          countdown.style.animation = "pop 600ms ease both";
        } else {
          clearInterval(interval);
          selectMajority();
        }
      }, 850);
    }

    function selectMajority() {
      const roundNumber = state.currentRoundIndex + 1;
      app.innerHTML = `
        <section class="screen panel modal-like">
          <div class="badge">Runde ${roundNumber} von ${TOTAL_ROUNDS}</div>
          <h2>Welche Option hatte die Mehrheit?</h2>
          <p class="lead">Die Spielleitung trägt jetzt das Ergebnis der analogen Abstimmung ein.</p>
          <div class="majority-grid">
            <button class="choice-btn red" onclick="selectCorrectPlayers('A')">
              <span class="choice-icon">👍</span>
              Mehrheit war Option A
              <small>rot</small>
            </button>
            <button class="choice-btn blue" onclick="selectCorrectPlayers('B')">
              <span class="choice-icon">👎</span>
              Mehrheit war Option B
              <small>blau</small>
            </button>
            <button class="choice-btn neutral" onclick="selectCorrectPlayers('tie')">
              <span class="choice-icon">⚖️</span>
              Gleichstand
              <small>keine Punkte</small>
            </button>
          </div>
        </section>
      `;
    }

    function selectCorrectPlayers(majority) {
      state.majority = majority;
      state.selectedPlayerIds = new Set();
      const roundNumber = state.currentRoundIndex + 1;

      if (majority === "tie") {
        showRoundSummary([]);
        return;
      }

      const majorityText = majority === "A" ? "Option A, rot, Daumen nach oben" : "Option B, blau, Daumen nach unten";
      app.innerHTML = `
        <section class="screen game-layout">
          <div class="panel">
            <div class="badge ${majority === "A" ? "red" : "blue"}">${majorityText}</div>
            <h2>Wer hat die Mehrheit richtig eingeschätzt?</h2>
            <p class="lead">Klicken Sie alle Personen an, die vor der Abstimmung die spätere Mehrheit richtig eingeschätzt haben. Markierte Personen erhalten ${roundNumber} Punkte.</p>
            <div class="chip-grid">
              ${state.players.map(player => `
                <button class="player-chip" data-player-id="${player.id}" onclick="toggleCorrectPlayer('${player.id}')">
                  ${escapeHtml(player.name)}<br><span class="small-note">Aktuell ${player.points} Punkte</span>
                </button>
              `).join("")}
            </div>
            <div class="btn-row">
              <button class="btn light" onclick="selectMajority()">Zurück</button>
              <button class="btn green" onclick="awardPoints()">Punkte vergeben</button>
            </div>
          </div>
          ${updateLeaderboard()}
        </section>
      `;
    }

    function toggleCorrectPlayer(playerId) {
      const chip = document.querySelector(`[data-player-id="${playerId}"]`);
      if (state.selectedPlayerIds.has(playerId)) {
        state.selectedPlayerIds.delete(playerId);
        chip.classList.remove("selected");
      } else {
        state.selectedPlayerIds.add(playerId);
        chip.classList.add("selected");
      }
    }

    function awardPoints() {
      const roundPoints = state.currentRoundIndex + 1;
      state.lastAwardedIds = new Set(state.selectedPlayerIds);
      state.players.forEach(player => {
        if (state.selectedPlayerIds.has(player.id)) {
          player.points += roundPoints;
        }
      });
      showRoundSummary([...state.selectedPlayerIds]);
    }

    function updateLeaderboard() {
      const sorted = [...state.players].sort((a, b) => b.points - a.points || a.name.localeCompare(b.name, "de"));
      return `
        <aside class="panel leaderboard">
          <h3>Rangliste</h3>
          <div class="leader-list">
            ${sorted.map((player, index) => `
              <div class="leader-row ${state.lastAwardedIds.has(player.id) ? "bump" : ""}">
                <div class="place">${index + 1}</div>
                <div class="leader-name">${escapeHtml(player.name)}</div>
                <div class="leader-points">${player.points}</div>
              </div>
            `).join("")}
          </div>
        </aside>
      `;
    }

    function showRoundSummary(winnerIds) {
      const roundNumber = state.currentRoundIndex + 1;
      const hasTie = state.majority === "tie";
      const winnerNames = state.players
        .filter(player => winnerIds.includes(player.id))
        .map(player => player.name);

      app.innerHTML = `
        <section class="screen game-layout">
          <div class="panel summary-card">
            <div class="badge">Runde ${roundNumber} abgeschlossen</div>
            <h2>${hasTie ? "Keine Mehrheit" : "Punkte vergeben"}</h2>
            ${hasTie ? `
              <p class="lead">Keine Mehrheit, in dieser Runde gibt es keine Punkte.</p>
            ` : `
              <div class="score-flash">+${roundNumber}</div>
              <p class="lead">${winnerNames.length ? `${escapeHtml(winnerNames.join(", "))} erhalten je ${roundNumber} Punkte.` : `Niemand wurde markiert. Es wurden keine Punkte vergeben.`}</p>
            `}
            <div class="btn-row" style="justify-content:center">
              <button class="btn" onclick="nextRound()">${roundNumber >= TOTAL_ROUNDS ? "Zur Schlussrangliste" : "Nächste Runde"}</button>
            </div>
          </div>
          ${updateLeaderboard()}
        </section>
      `;
    }

    function nextRound() {
      if (state.currentRoundIndex >= TOTAL_ROUNDS - 1) {
        showFinalScreen();
        return;
      }
      state.currentRoundIndex++;
      renderRound();
    }

    function showFinalScreen(endedEarly = false) {
      const sorted = [...state.players].sort((a, b) => b.points - a.points || a.name.localeCompare(b.name, "de"));
      const maxPoints = sorted[0]?.points || 0;
      const winners = sorted.filter(player => player.points === maxPoints);
      const winnerText = winners.map(player => player.name).join(", ");

      app.innerHTML = `
        <section class="screen panel">
          <div class="badge">${endedEarly ? `Nach ${state.currentRoundIndex + 1} von ${TOTAL_ROUNDS} Runden beendet` : `15 von 15 Runden gespielt`}</div>
          <h2>Spiel beendet</h2>
          <p class="subtitle">${escapeHtml(winnerText)} ${winners.length === 1 ? "hat" : "haben"} die Gruppe am besten eingeschätzt.</p>
          <div class="final-list">
            ${sorted.map((player, index) => `
              <div class="final-row ${player.points === maxPoints ? "winner" : ""}">
                <div class="place">${index + 1}</div>
                <div>
                  <strong>${escapeHtml(player.name)}</strong>
                  ${player.points === maxPoints ? `<div class="small-note">Gewinnerin oder Gewinner</div>` : ""}
                </div>
                <div class="leader-points">${player.points} Punkte</div>
              </div>
            `).join("")}
          </div>
          <div class="reflections">
            <div class="reflection">Welche Entscheidung war besonders knapp?</div>
            <div class="reflection">Welche Frage hat am meisten Diskussion ausgelöst?</div>
            <div class="reflection">Hat Sie eine Mehrheitsentscheidung überrascht?</div>
            <div class="reflection">Haben Sie eher Ihre eigene Meinung gewählt oder die Mehrheit eingeschätzt?</div>
          </div>
          <div class="btn-row">
            <button class="btn" onclick="restartGame()">Neues Spiel starten</button>
            <button class="btn light" onclick="restartWithSamePlayers()">Noch einmal mit gleichen Namen</button>
          </div>
        </section>
      `;
    }

    function startOpinionMode() {
      state.players = [];
      state.gameCards = generateGameCards();
      state.currentRoundIndex = 0;
      state.majority = null;
      state.selectedPlayerIds = new Set();
      state.lastAwardedIds = new Set();
      renderOpinionRound();
    }

    function renderOpinionRound() {
      const roundNumber = state.currentRoundIndex + 1;
      const card = state.gameCards[state.currentRoundIndex];
      app.innerHTML = `
        <section class="screen">
          <div class="topbar">
            <div class="round-pill">Meinungsmodus, Runde ${roundNumber} von ${TOTAL_ROUNDS}</div>
            <div class="round-pill points-pill">Keine Punkte, eigene Meinung</div>
            <button class="btn light" onclick="endGame()">Spiel beenden</button>
          </div>
          <div class="panel question-card">
            <div class="category">Kategorie: ${escapeHtml(card.category)}</div>
            <h2 class="question-title">${escapeHtml(card.title)}</h2>
            <p class="situation">${escapeHtml(card.situation)}</p>
            <div class="options-grid">
              <div class="option-card red">
                <div class="option-head">
                  <div>
                    <div class="option-label">Option A</div>
                    <div class="option-meaning">Daumen nach oben</div>
                  </div>
                  <div class="thumb">👍</div>
                </div>
                <p class="option-text">${escapeHtml(card.optionA)}</p>
              </div>
              <div class="option-card blue">
                <div class="option-head">
                  <div>
                    <div class="option-label">Option B</div>
                    <div class="option-meaning">Daumen nach unten</div>
                  </div>
                  <div class="thumb">👎</div>
                </div>
                <p class="option-text">${escapeHtml(card.optionB)}</p>
              </div>
            </div>
            <div class="prompt-box"><strong>Diskussionsimpuls:</strong> <span>${escapeHtml(card.discussionPrompt)}</span></div>
            <div class="btn-row">
              <button class="btn" onclick="startOpinionCountdown()">3, 2, 1, abstimmen</button>
            </div>
          </div>
        </section>
      `;
    }

    function startOpinionCountdown() {
      const roundNumber = state.currentRoundIndex + 1;
      const card = state.gameCards[state.currentRoundIndex];
      let steps = ["3", "2", "1", "Abstimmen!"];
      let index = 0;

      app.innerHTML = `
        <section class="screen">
          <div class="topbar">
            <div class="round-pill">Meinungsmodus, Runde ${roundNumber} von ${TOTAL_ROUNDS}</div>
            <div class="round-pill points-pill">Keine Punkte, eigene Meinung</div>
            <button class="btn light" onclick="endGame()">Spiel beenden</button>
          </div>
          <div class="panel question-card">
            <div class="category">Kategorie: ${escapeHtml(card.category)}</div>
            <h2 class="question-title">${escapeHtml(card.title)}</h2>
            <p class="situation">${escapeHtml(card.situation)}</p>
            <div id="countdown" class="countdown" style="font-size: clamp(4rem, 11vw, 9rem); margin: 12px 0 24px; text-align: center;">3</div>
            <div class="options-grid">
              <div class="option-card red">
                <div class="option-head">
                  <div>
                    <div class="option-label">Option A</div>
                    <div class="option-meaning">Daumen nach oben</div>
                  </div>
                  <div class="thumb">👍</div>
                </div>
                <p class="option-text">${escapeHtml(card.optionA)}</p>
              </div>
              <div class="option-card blue">
                <div class="option-head">
                  <div>
                    <div class="option-label">Option B</div>
                    <div class="option-meaning">Daumen nach unten</div>
                  </div>
                  <div class="thumb">👎</div>
                </div>
                <p class="option-text">${escapeHtml(card.optionB)}</p>
              </div>
            </div>
            <div class="prompt-box"><strong>Jetzt abstimmen:</strong> <span>Alle stimmen nach der eigenen Meinung. Rot bedeutet Option A, blau bedeutet Option B.</span></div>
          </div>
        </section>
      `;

      const interval = setInterval(() => {
        index++;
        const countdown = document.getElementById("countdown");
        if (index < steps.length) {
          countdown.textContent = steps[index];
          countdown.style.animation = "none";
          countdown.offsetHeight;
          countdown.style.animation = "pop 600ms ease both";
        } else {
          clearInterval(interval);
          showOpinionRoundSummary();
        }
      }, 850);
    }

    function showOpinionRoundSummary() {
      const roundNumber = state.currentRoundIndex + 1;
      const card = state.gameCards[state.currentRoundIndex];
      app.innerHTML = `
        <section class="screen panel summary-card">
          <div class="badge">Meinungsmodus, Runde ${roundNumber} abgeschlossen</div>
          <h2>Abstimmung beendet</h2>
          <p class="lead">Es gibt in diesem Modus keine Punkte. Nutzen Sie den Moment für eine kurze Diskussion.</p>
          <div class="prompt-box" style="text-align:left; margin-top: 22px;"><strong>Diskussionsimpuls:</strong> <span>${escapeHtml(card.discussionPrompt)}</span></div>
          <div class="btn-row" style="justify-content:center">
            <button class="btn light" onclick="endGame()">Spiel beenden</button>
            <button class="btn" onclick="nextOpinionRound()">${roundNumber >= TOTAL_ROUNDS ? "Zum Abschluss" : "Nächste Runde"}</button>
          </div>
        </section>
      `;
    }

    function nextOpinionRound() {
      if (state.currentRoundIndex >= TOTAL_ROUNDS - 1) {
        showOpinionFinalScreen();
        return;
      }
      state.currentRoundIndex++;
      renderOpinionRound();
    }

    function endGame() {
      if (state.mode === "opinion") {
        showOpinionFinalScreen(true);
      } else {
        showFinalScreen(true);
      }
    }

    function showOpinionFinalScreen(endedEarly = false) {
      app.innerHTML = `
        <section class="screen panel">
          <div class="badge">${endedEarly ? `Nach ${state.currentRoundIndex + 1} von ${TOTAL_ROUNDS} Runden beendet` : `15 von 15 Runden gespielt`}</div>
          <h2>Spiel beendet</h2>
          <p class="subtitle">Meinungsmodus ohne Punkte abgeschlossen.</p>
          <p class="lead">In diesem Modus ging es darum, die eigene Meinung sichtbar zu machen und Unterschiede in der Gruppe zu diskutieren.</p>
          <div class="reflections">
            <div class="reflection">Welche Entscheidung war besonders knapp?</div>
            <div class="reflection">Welche Frage hat am meisten Diskussion ausgelöst?</div>
            <div class="reflection">Hat Sie eine Gruppenentscheidung überrascht?</div>
            <div class="reflection">Bei welcher Frage fiel Ihnen die Entscheidung besonders schwer?</div>
          </div>
          <div class="btn-row">
            <button class="btn" onclick="restartGame()">Neues Spiel starten</button>
            <button class="btn light" onclick="startOpinionMode()">Noch einmal im Meinungsmodus</button>
          </div>
        </section>
      `;
    }

    function restartGame() {
      state.players = [];
      state.gameCards = [];
      state.currentRoundIndex = 0;
      state.majority = null;
      state.selectedPlayerIds = new Set();
      state.lastAwardedIds = new Set();
      renderStartScreen();
    }

    function restartWithSamePlayers() {
      state.players = state.players.map(player => ({ ...player, points: 0 }));
      state.gameCards = generateGameCards();
      state.currentRoundIndex = 0;
      state.majority = null;
      state.selectedPlayerIds = new Set();
      state.lastAwardedIds = new Set();
      renderRound();
    }

    // Spiel beim Laden vorbereiten.
    initGame();
  </script>
</body>
</html>
