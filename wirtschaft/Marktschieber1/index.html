function answerCurvePart(curve,levelId,taskId,isRepeat){const level=levels.find(l=>l.id===levelId)||{id:"W",name:"Wiederholung"};const task=isRepeat?state.wrongMap[taskId]:level.tasks.find(t=>t.id===taskId);state.selectedCurve=curve;state.curvePhaseDone=true;saveState();document.querySelectorAll(".choiceBtn").forEach(b=>b.disabled=true);document.getElementById("curve_"+curve)?.classList.add(curve===task.expected.curve?"correctPick":"wrongPick");document.getElementById("curve_"+task.expected.curve)?.classList.add("correctPick");const fb=document.getElementById("curveFeedback");const ok=curve===task.expected.curve;fb.className="miniFeedback "+(ok?"good":"bad");fb.innerHTML=ok?`Richtig. Betroffen ist: <strong>${task.expected.curve}</strong>.`:`Nicht ganz. Betroffen ist: <strong>${task.expected.curve}</strong>.`;document.getElementById("shiftControls").style.display="block";document.getElementById("graphCardBox").classList.remove("dimmed");document.getElementById("graphBox").innerHTML=marketSvg(task.market,0,0,false,true);document.getElementById("graphHelp").textContent="Jetzt die passende Kurve frei nach links oder rechts ziehen."}

function answerShift(levelId,taskId,isRepeat){const level=levels.find(l=>l.id===levelId)||{id:"W",name:"Wiederholung"};const task=isRepeat?state.wrongMap[taskId]:level.tasks.find(t=>t.id===taskId);if(!state.curvePhaseDone)return alert("Bitte zuerst Teil 1 lösen.");const dDir=dirFromOffset(state.currentShift.d),sDir=dirFromOffset(state.currentShift.s);const curveCorrect=state.selectedCurve===task.expected.curve;const dirCorrect=dDir===task.expected.d&&sDir===task.expected.s;const correct=curveCorrect&&dirCorrect;const partial=!correct&&(curveCorrect||dirCorrect);document.getElementById("checkBtn").disabled=true;const box=document.getElementById("graphBox");if(box)box.innerHTML=marketSvg(task.market,task.expected.d*50,task.expected.s*50,true,false);finishAnswer(level,task,`Kurve: ${state.selectedCurve}; Nachfrage ${wordDir(dDir)}, Angebot ${wordDir(sDir)}`,correct,isRepeat,`Kurve: ${task.expected.curve}; Nachfrage ${wordDir(task.expected.d)}, Angebot ${wordDir(task.expected.s)}`,partial)}
function answerDualShift(levelId,taskId,isRepeat){const level=levels.find(l=>l.id===levelId)||{id:"W",name:"Wiederholung"};const task=isRepeat?state.wrongMap[taskId]:level.tasks.find(t=>t.id===taskId);const dDir=dirFromOffset(state.currentShift.d),sDir=dirFromOffset(state.currentShift.s);const correct=dDir===task.expected.d&&sDir===task.expected.s;const partial=!correct&&(dDir===task.expected.d||sDir===task.expected.s);document.getElementById("checkBtn").disabled=true;const box=document.getElementById("graphBox");if(box)box.innerHTML=marketSvg(task.market,task.expected.d*50,task.expected.s*50,true,false);finishAnswer(level,task,`Nachfrage ${wordDir(dDir)}, Angebot ${wordDir(sDir)}`,correct,isRepeat,`Nachfrage ${wordDir(task.expected.d)}, Angebot ${wordDir(task.expected.s)}`,partial)}
function setEffect(kind,value){state.effectChoice[kind]=value;saveState();updateEffectButtons()}
function updateEffectButtons(){[["pPlus","p","+"],["pEqual","p","="],["pMinus","p","-"],["pUnknown","p","?"],["qPlus","q","+"],["qEqual","q","="],["qMinus","q","-"],["qUnknown","q","?"]].forEach(([id,k,v])=>{const el=document.getElementById(id);if(el)el.classList.toggle("active",state.effectChoice[k]===v)})}
function answerEffect(levelId,taskId,isRepeat){const level=levels.find(l=>l.id===levelId)||{id:"W",name:"Wiederholung"};const task=isRepeat?state.wrongMap[taskId]:level.tasks.find(t=>t.id===taskId);if(!state.effectChoice.p||!state.effectChoice.q)return alert("Bitte Preis und Menge einstellen.");const correct=state.effectChoice.p===task.expected.p&&state.effectChoice.q===task.expected.q;const partial=!correct&&(state.effectChoice.p===task.expected.p||state.effectChoice.q===task.expected.q);document.querySelectorAll(".effectBtn").forEach(b=>b.disabled=true);document.getElementById("checkBtn").disabled=true;finishAnswer(level,task,`Preis ${state.effectChoice.p}, Menge ${state.effectChoice.q}`,correct,isRepeat,`Preis ${task.expected.p}, Menge ${task.expected.q}`,partial)}
function setChain(key,value){state.chainChoice[key]=value;saveState();document.querySelectorAll(`[id^="chip_${key}_"]`).forEach(el=>el.classList.remove("active"));const el=document.getElementById(`chip_${key}_${safeId(value)}`);if(el)el.classList.add("active")}
function answerChain(levelId,taskId,isRepeat){const level=levels.find(l=>l.id===levelId)||{id:"W",name:"Wiederholung"};const task=isRepeat?state.wrongMap[taskId]:level.tasks.find(t=>t.id===taskId);if(task.slots.some(s=>!state.chainChoice[s.key]))return alert("Bitte alle Teile der Marktkette wählen.");const correctCount=task.slots.filter(s=>state.chainChoice[s.key]===s.correct).length;const correct=correctCount===task.slots.length,partial=correctCount>0&&!correct;document.querySelectorAll(".chip").forEach(b=>b.disabled=true);document.getElementById("checkBtn").disabled=true;const chosen=task.slots.map(s=>`${s.label}: ${state.chainChoice[s.key]}`).join(" | ");const solution=task.slots.map(s=>`${s.label}: ${s.correct}`).join(" | ");finishAnswer(level,task,chosen,correct,isRepeat,solution,partial)}
function answerSingle(levelId,taskId,chosen,isRepeat){const level=levels.find(l=>l.id===levelId)||{id:"W",name:"Wiederholung"};const task=isRepeat?state.wrongMap[taskId]:level.tasks.find(t=>t.id===taskId);const correct=chosen===task.correct;document.querySelectorAll(".option").forEach(b=>{b.disabled=true;if(b.textContent.trim()===task.correct)b.classList.add("correct");if(b.textContent.trim()===chosen&&!correct)b.classList.add("wrong")});finishAnswer(level,task,chosen,correct,isRepeat,task.correct,false)}
function finishAnswer(level,task,chosen,correct,isRepeat,solutionText,partial=false){
  const points=correct?10:partial?5:0,max=10,status=correct?"richtig":partial?"teilweise":"falsch";
  if(correct){state.score+=points;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);state.right++;if(isRepeat)delete state.wrongMap[task.id]}else if(partial){state.score+=points;state.streak=0;state.partial++;if(!isRepeat)state.wrongMap[task.id]={...task,originalLevelId:level.id}}else{state.streak=0;state.wrong++;if(!isRepeat)state.wrongMap[task.id]={...task,originalLevelId:level.id}}
  state.maxScore+=max;
  const answer={time:new Date().toISOString(),levelId:isRepeat?"W":level.id,levelName:isRepeat?"Wiederholung":level.name,taskId:task.id,scenario:task.scenario,question:task.question,chosen,correct:solutionText,status,points,max,explanation:task.explanation,memo:task.memo,isRepeat};
  state.answers.push(answer);
  enqueueRecord(makeRecord(level,task,answer,isRepeat,points,max,status));
  const fb=document.getElementById("feedback");fb.className="feedback "+(correct?"good":partial?"partial":"bad");fb.innerHTML=`<strong>${correct?"Richtig.":partial?"Teilweise richtig.":"Falsch."}</strong><br>Lösung: <strong>${escapeHtml(solutionText)}</strong><br>${escapeHtml(task.explanation)}<div class="memo">${escapeHtml(task.memo)}</div>`;
  const next=document.getElementById("nextActions");next.style.display="flex";next.innerHTML=isRepeat?`<button class="primary" onclick="renderRepeat()">Weiter</button><button class="secondary" onclick="renderMenu()">Menü</button>`:`<button class="primary" onclick="nextTask('${level.id}')">Weiter</button><button class="secondary" onclick="renderMenu()">Menü</button>`;
  saveState();flushQueue();
}
function makeRecord(level,task,answer,isRepeat,points,max,status){
  const total=totalNormalTasks(),done=countNormalAnswers(),success=state.maxScore?state.score/state.maxScore:null;
  return {record_id:`${state.sessionId}_${answer.levelId}_${task.id}_${Date.now()}_${Math.random().toString(36).slice(2)}`,game_id:GAME_ID,game_title:GAME_TITLE,version:VERSION,session_id:state.sessionId,name:state.name,class_name:className(),class_choice:state.classChoice,other_class:state.otherClass,level_id:answer.levelId,level_name:answer.levelName,task_id:task.id,task_title:task.scenario,task_type:task.type,subtask_id:task.id,subtask_title:task.market,question:task.question,chosen_answer:answer.chosen,correct_solution:answer.correct,status:status,points:points,max_points:max,success_rate:success,attempt:1,duration_ms:Date.now()-state.taskStart,score_now:state.score,total_possible:state.maxScore,streak:state.streak,best_streak:state.bestStreak,count_right:state.right,count_partial:state.partial,count_wrong:state.wrong,count_skipped:state.skipped,progress:Math.round(done/total*1000)/10,level_completed:false,error_type:status==="richtig"?"":task.type,misconception:status==="richtig"?"":"Konzept prüfen",explanation:task.explanation,memo:task.memo,is_repeat:isRepeat,source:"schueler-html",details:{market:task.market,scenario:task.scenario,expected:task.expected||task.correct||task.slots,currentShift:state.currentShift,selectedCurve:state.selectedCurve}};
}
function nextTask(levelId){const ls=state.levelStates[levelId];ls.index++;const l=levels.find(x=>x.id===levelId);if(ls.index>=l.tasks.length)completeLevel(levelId);else{saveState();renderLevel(levelId)}}
function completeLevel(levelId){state.levelStates[levelId].completed=true;saveState();const l=levels.find(x=>x.id===levelId);app(`<section class="card"><h1>${l.name} abgeschlossen 🎉</h1><p class="lead">Gut gemacht. Im Menü kannst du mit dem nächsten Level weitermachen.</p><div class="graphCard">${marketSvg("Grundmodell",0,0,false,false)}</div><div class="actions"><button class="primary" onclick="renderMenu()">Zurück ins Menü</button><button class="secondary" onclick="showResults()">Zwischenresultate</button></div></section>`)}
function renderRepeat(){const ids=Object.keys(state.wrongMap);if(ids.length===0)return renderMenu();const task=state.wrongMap[ids[0]];renderTask({id:task.originalLevelId||"W",name:"Wiederholung"},task,true)}
function showResults(){const success=state.maxScore?Math.round(state.score/state.maxScore*100):0;const rows=state.answers.slice().reverse().map(a=>`<tr><td>${escapeHtml(a.taskId)}</td><td>${escapeHtml(a.chosen)}</td><td>${escapeHtml(a.correct)}</td><td class="status-${a.status}">${a.status}</td><td>${a.points}/${a.max}</td><td>${a.isRepeat?"ja":"nein"}</td></tr>`).join("");document.getElementById("resultContent").innerHTML=`<div class="grid2"><div class="card" style="box-shadow:none"><h3>Stand</h3><p><strong>Punkte:</strong> ${state.score} / ${state.maxScore}</p><p><strong>Erfolgsquote:</strong> ${success}%</p><p><strong>Beste Streak:</strong> ${state.bestStreak}</p></div><div class="card" style="box-shadow:none"><h3>Antworten</h3><p><span class="status-richtig">Richtig:</span> ${state.right}</p><p><span class="status-teilweise">Teilweise:</span> ${state.partial}</p><p><span class="status-falsch">Falsch:</span> ${state.wrong}</p><p><strong>Offene Fehler:</strong> ${Object.keys(state.wrongMap).length}</p></div></div><h3 style="margin-top:18px">Letzte Antworten</h3><table><thead><tr><th>Aufgabe</th><th>Antwort</th><th>Lösung</th><th>Status</th><th>Punkte</th><th>Wdh.</th></tr></thead><tbody>${rows||`<tr><td colspan="6">Noch keine Antworten.</td></tr>`}</tbody></table>`;document.getElementById("resultModal").style.display="block"}
function closeResults(){document.getElementById("resultModal").style.display="none"}
function totalNormalTasks(){return levels.reduce((s,l)=>s+l.tasks.length,0)}
function countNormalAnswers(){return state.answers.filter(a=>!a.isRepeat).length}
function wordDir(v){return v===1?"nach rechts":v===-1?"nach links":"nicht verschoben"}
function dirFromOffset(v){if(v>8)return 1;if(v<-8)return -1;return 0}
function safeId(s){return String(s).replace(/[^a-zA-Z0-9äöüÄÖÜß+=? -]/g,"_").replaceAll(" ","_")}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function marketSvg(market,dShift,sShift,showOld,draggable){const d=clamp(dShift,-65,65),s=clamp(sShift,-65,65);const D1=[130+d,105],D2=[322+d,245],S1=[130+s,245],S2=[322+s,105];const OD1=[130,105],OD2=[322,245],OS1=[130,245],OS2=[322,105];const eq0=intersect(OD1,OD2,OS1,OS2),eq1=intersect(D1,D2,S1,S2);const showNew=Math.abs(d)>1||Math.abs(s)>1;return `<svg viewBox="0 0 420 340" role="img" aria-label="Angebot-Nachfrage-Diagramm"><text class="titleSvg" x="210" y="30" text-anchor="middle">Markt: ${escapeHtml(market)}</text><line class="axis" x1="78" y1="282" x2="370" y2="282"></line><line class="axis" x1="78" y1="282" x2="78" y2="72"></line><text class="labelSvg" x="34" y="58">Preis</text><text class="labelSvg" x="332" y="318">Menge</text>${showOld&&showNew?`<path class="curveOld" d="M ${OD1[0]} ${OD1[1]} L ${OD2[0]} ${OD2[1]}"></path><path class="curveOld" d="M ${OS1[0]} ${OS1[1]} L ${OS2[0]} ${OS2[1]}"></path>`:""}<path class="curveD" d="M ${D1[0]} ${D1[1]} L ${D2[0]} ${D2[1]}"></path><path class="curveS" d="M ${S1[0]} ${S1[1]} L ${S2[0]} ${S2[1]}"></path>${draggable?`<path class="dragHit" d="M ${D1[0]} ${D1[1]} L ${D2[0]} ${D2[1]}" onpointerdown="graphPointerDown(event,'d')"></path><path class="dragHit" d="M ${S1[0]} ${S1[1]} L ${S2[0]} ${S2[1]}" onpointerdown="graphPointerDown(event,'s')"></path>`:""}<text class="labelSvg" x="${Math.min(D2[0]+10,358)}" y="${D2[1]+4}">N</text><text class="labelSvg" x="${Math.min(S2[0]+10,358)}" y="${S2[1]+4}">A</text><circle class="eq" cx="${eq0[0]}" cy="${eq0[1]}" r="5"></circle><text class="mutedSvg" x="${eq0[0]-33}" y="${eq0[1]-11}">E0</text>${showNew?`<circle class="eqNew" cx="${eq1[0]}" cy="${eq1[1]}" r="7"></circle><text class="labelSvg" x="${Math.min(eq1[0]+10,365)}" y="${eq1[1]-8}">E1</text>`:""}</svg>`}
function intersect(a,b,c,d){const x1=a[0],y1=a[1],x2=b[0],y2=b[1],x3=c[0],y3=c[1],x4=d[0],y4=d[1];const den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);const px=((x1*y2-y1*x2)*(x3-x4)-(x1-x2)*(x3*y4-y3*x4))/den;const py=((x1*y2-y1*x2)*(y3-y4)-(y1-y2)*(x3*y4-y3*x4))/den;return [Math.round(px),Math.round(py)]}

function getQueue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]")}catch(e){return []}}
function setQueue(q){localStorage.setItem(QUEUE_KEY,JSON.stringify(q))}
function enqueueRecord(record){const q=getQueue();q.push(record);setQueue(q)}
let flushing=false;
async function flushQueue(){
  if(flushing)return;
  flushing=true;
  try{
    let q=getQueue();
    const kept=[];
    for(const rec of q){
      try{
        const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?on_conflict=record_id`,{
          method:"POST",
          headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,"Content-Type":"application/json",Prefer:"resolution=ignore-duplicates,return=minimal"},
          body:JSON.stringify(rec)
        });
        if(!(res.ok||res.status===409))kept.push(rec);
      }catch(e){kept.push(rec)}
    }
    setQueue(kept);
  }finally{flushing=false}
}
window.addEventListener("online",flushQueue);
window.addEventListener("beforeunload",flushQueue);
setInterval(flushQueue,10000);
render();
flushQueue();
</script>
