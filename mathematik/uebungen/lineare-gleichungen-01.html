<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mathe-Übung: Lineare Gleichung 01</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-config.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.4rem; }
  input { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; font-size: 1rem; }
  button { padding: 8px 16px; margin: 6px 4px 6px 0; cursor: pointer; font-size: 0.95rem; }
  #app, #auth { display: none; }
  .msg { margin: 10px 0; font-size: 0.9rem; }
  .msg.error { color: #b00020; }
  .msg.ok { color: #1a7a1a; }
  .hidden { display: none; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; }
  a.back { font-size: 0.85rem; }
</style>
</head>
<body>

<p><a class="back" href="../index.html">&larr; Zurück zur Übersicht</a></p>

<!-- LOGIN / REGISTRIERUNG -->
<div id="auth">
  <h1>Login</h1>
  <input id="email" type="email" placeholder="E-Mail">
  <input id="password" type="password" placeholder="Passwort">
  <button onclick="signIn()">Einloggen</button>
  <button onclick="signUp()">Registrieren</button>
  <div id="auth-msg" class="msg"></div>
</div>

<!-- EINGELOGGTER BEREICH -->
<div id="app">
  <h1>Willkommen, <span id="user-email"></span></h1>
  <button onclick="signOut()">Ausloggen</button>
  <button onclick="showPwChange()">Passwort ändern</button>

  <div id="pw-change" class="card hidden">
    <input id="new-password" type="password" placeholder="Neues Passwort">
    <button onclick="changePassword()">Speichern</button>
    <div id="pw-msg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Aufgabe: Lineare Gleichung</h2>
    <p>Löse nach <em>x</em> auf: &nbsp; 3x + 5 = 20</p>
    <input id="answer" type="text" placeholder="Deine Antwort">
    <button onclick="checkAnswer()">Prüfen</button>
    <div id="hint" class="msg"></div>
    <div id="result-msg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Meine bisherigen Versuche</h2>
    <ul id="history"></ul>
  </div>
</div>

<script>
const EXERCISE_ID = "lineare-gleichungen-01";
const CORRECT_ANSWER = "5";
let hintLevel = 0;

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { showApp(session.user); }
  else { document.getElementById('auth').style.display = 'block'; }
}

function showApp(user) {
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-email').textContent = user.email;
  loadHistory();
}

async function signUp() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signUp({ email, password });
  const msg = document.getElementById('auth-msg');
  if (error) { msg.textContent = error.message; msg.className = 'msg error'; }
  else { msg.textContent = 'Registriert! Bitte einloggen.'; msg.className = 'msg ok'; }
}

async function signIn() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  const msg = document.getElementById('auth-msg');
  if (error) { msg.textContent = error.message; msg.className = 'msg error'; }
  else { showApp(data.user); }
}

async function signOut() {
  await sb.auth.signOut();
  location.reload();
}

function showPwChange() {
  document.getElementById('pw-change').classList.toggle('hidden');
}
async function changePassword() {
  const newPassword = document.getElementById('new-password').value;
  const { error } = await sb.auth.updateUser({ password: newPassword });
  const msg = document.getElementById('pw-msg');
  if (error) { msg.textContent = error.message; msg.className = 'msg error'; }
  else { msg.textContent = 'Passwort geändert.'; msg.className = 'msg ok'; }
}

async function checkAnswer() {
  const answer = document.getElementById('answer').value.trim();
  const correct = answer === CORRECT_ANSWER;
  const resultMsg = document.getElementById('result-msg');

  if (correct) {
    resultMsg.textContent = 'Richtig! ✅';
    resultMsg.className = 'msg ok';
  } else {
    resultMsg.textContent = 'Leider falsch. ❌';
    resultMsg.className = 'msg error';
    hintLevel++;
    showHint();
  }

  const { data: { user } } = await sb.auth.getUser();
  await sb.from('exercise_attempts').insert({
    user_id: user.id,
    exercise_id: EXERCISE_ID,
    answer_given: answer,
    is_correct: correct
  });

  loadHistory();
}

function showHint() {
  const hintEl = document.getElementById('hint');
  if (hintLevel === 1) hintEl.textContent = 'Tipp: Zuerst 5 auf beiden Seiten subtrahieren.';
  else if (hintLevel === 2) hintEl.textContent = 'Tipp: 3x = 15. Jetzt durch 3 teilen.';
  else if (hintLevel >= 3) hintEl.textContent = 'Lösung: x = 5';
}

async function loadHistory() {
  const { data: { user } } = await sb.auth.getUser();
  const { data } = await sb
    .from('exercise_attempts')
    .select('*')
    .eq('user_id', user.id)
    .order('created_at', { ascending: false });

  const list = document.getElementById('history');
  list.innerHTML = '';
  if (data) {
    data.forEach(row => {
      const li = document.createElement('li');
      li.textContent = `${row.exercise_id}: "${row.answer_given}" — ${row.is_correct ? 'richtig' : 'falsch'} (${new Date(row.created_at).toLocaleString()})`;
      list.appendChild(li);
    });
  }
}

checkSession();
</script>

</body>
</html>
