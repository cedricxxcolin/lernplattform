<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mathe-Übung: Bruchrechnen 02 (mehrteilig)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-config.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.4rem; }
  input { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; font-size: 1rem; }
  button { padding: 8px 16px; margin: 6px 4px 6px 0; cursor: pointer; font-size: 0.95rem; }
  #app, #auth { display: none; }
  .msg { margin: 10px 0; font-size: 0.9rem; }
  .msg.error { color: #b00020; }
  .msg.ok { color: #1a7a1a; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; }
  .card.done { background: #f3fbf3; }
  a.back { font-size: 0.85rem; }
  .progress-bar { background: #eee; border-radius: 6px; height: 10px; overflow: hidden; margin: 10px 0; }
  .progress-fill { background: #2e9e44; height: 100%; }
</style>
</head>
<body>

<p><a class="back" href="../index.html">&larr; Zurück zur Übersicht</a></p>

<div id="auth">
  <h1>Login</h1>
  <input id="email" type="email" placeholder="E-Mail">
  <input id="password" type="password" placeholder="Passwort">
  <button onclick="signIn()">Einloggen</button>
  <button onclick="signUp()">Registrieren</button>
  <div id="auth-msg" class="msg"></div>
</div>

<div id="app">
  <h1>Bruchrechnen 02 — mehrteilig</h1>
  <button onclick="signOut()">Ausloggen</button>

  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <p id="progress-text">0 von 3 Teilaufgaben gelöst</p>

  <div class="card" id="task-0">
    <h3>Teilaufgabe 1</h3>
    <p>1/2 + 1/4 = ?</p>
    <input id="answer-0" type="text" placeholder="Antwort">
    <button onclick="checkTask(0, ['3/4','0.75'])">Prüfen</button>
    <div id="result-0" class="msg"></div>
  </div>

  <div class="card" id="task-1">
    <h3>Teilaufgabe 2</h3>
    <p>2/3 − 1/3 = ?</p>
    <input id="answer-1" type="text" placeholder="Antwort">
    <button onclick="checkTask(1, ['1/3'])">Prüfen</button>
    <div id="result-1" class="msg"></div>
  </div>

  <div class="card" id="task-2">
    <h3>Teilaufgabe 3</h3>
    <p>3/8 + 1/8 = ? (bitte kürzen)</p>
    <input id="answer-2" type="text" placeholder="Antwort">
    <button onclick="checkTask(2, ['1/2','0.5'])">Prüfen</button>
    <div id="result-2" class="msg"></div>
  </div>
</div>

<script>
const EXERCISE_ID = "bruchrechnen-02-multi";
const TOTAL_TASKS = 3;
let completed = new Set();

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { showApp(session.user); } else { document.getElementById('auth').style.display = 'block'; }
}

async function showApp(user) {
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadProgress();
}

async function signUp() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signUp({ email, password });
  const msg = document.getElementById('auth-msg');
  if (error) { msg.textContent = error.message; msg.className = 'msg error'; }
  else { msg.textContent = 'Registriert! Bitte einloggen.'; msg.className = 'msg ok'; }
}

async function signIn() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  const msg = document.getElementById('auth-msg');
  if (error) { msg.textContent = error.message; msg.className = 'msg error'; }
  else { showApp(data.user); }
}

async function signOut() {
  await sb.auth.signOut();
  location.reload();
}

async function loadProgress() {
  const { data: { user } } = await sb.auth.getUser();
  const { data } = await sb
    .from('exercise_progress')
    .select('*')
    .eq('user_id', user.id)
    .eq('exercise_id', EXERCISE_ID)
    .maybeSingle();

  if (data) {
    // Wir wissen nicht, WELCHE Teilaufgaben gelöst wurden, nur die Anzahl —
    // für dieses einfache Beispiel reicht das für die Fortschrittsanzeige.
    updateProgressBar(data.completed_count);
  }
}

async function checkTask(index, correctAnswers) {
  const answer = document.getElementById(`answer-${index}`).value.trim();
  const correct = correctAnswers.includes(answer);
  const resultEl = document.getElementById(`result-${index}`);

  if (correct) {
    resultEl.textContent = 'Richtig! ✅';
    resultEl.className = 'msg ok';
    document.getElementById(`task-${index}`).classList.add('done');
    completed.add(index);
  } else {
    resultEl.textContent = 'Leider falsch, versuch es nochmal.';
    resultEl.className = 'msg error';
  }

  await saveProgress();
}

async function saveProgress() {
  const { data: { user } } = await sb.auth.getUser();
  const completedCount = completed.size;

  await sb.from('exercise_progress').upsert({
    user_id: user.id,
    exercise_id: EXERCISE_ID,
    completed_count: completedCount,
    total_count: TOTAL_TASKS,
    updated_at: new Date().toISOString()
  });

  updateProgressBar(completedCount);
}

function updateProgressBar(count) {
  const pct = Math.round((count / TOTAL_TASKS) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${count} von ${TOTAL_TASKS} Teilaufgaben gelöst`;
}

checkSession();
</script>

</body>
</html>
