<!--
  VORLAGE für eine neue Mathe-Übung.
  Kopieren, umbenennen (z. B. "prozentrechnen-01.html"), dann nur die
  mit ►►► markierten Stellen anpassen. Layout/Login-Verhalten NICHT anfassen —
  das kommt automatisch aus ../shared/style.css und ../shared/supabase-config.js.
-->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mathe-Übung: ►►► TITEL EINSETZEN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-config.js"></script>
<link rel="stylesheet" href="../shared/style.css">
<style>
  #app, #auth { display: none; }
</style>
</head>
<body class="layout-narrow">

<p><a class="back" href="../index.html">&larr; Zurück zur Übersicht</a></p>

<!-- LOGIN / REGISTRIERUNG — unverändert lassen -->
<div id="auth">
  <h1>Login</h1>
  <input id="email" type="email" placeholder="E-Mail">
  <input id="password" type="password" placeholder="Passwort">
  <button onclick="signIn()">Einloggen</button>
  <button onclick="signUp()">Registrieren</button>
  <div id="auth-msg" class="msg"></div>
</div>

<!-- EINGELOGGTER BEREICH -->
<div id="app">
  <h1>Willkommen, <span id="user-email"></span></h1>
  <button onclick="signOut()">Ausloggen</button>

  <div class="card">
    <h2>Aufgabe: ►►► KURZTITEL DER AUFGABE</h2>
    <p>►►► AUFGABENTEXT HIER EINSETZEN</p>
    <input id="answer" type="text" placeholder="Deine Antwort">
    <button onclick="checkAnswer()">Prüfen</button>
    <div id="hint" class="msg"></div>
    <div id="result-msg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Meine bisherigen Versuche</h2>
    <ul id="history"></ul>
  </div>
</div>

<script>
// ►►► eindeutige ID, z. B. "prozentrechnen-01" — muss zum Dateinamen passen
const EXERCISE_ID = "►►► exercise-id";
// ►►► erwartete korrekte Antwort als Text
const CORRECT_ANSWER = "►►► antwort";
let hintLevel = 0;

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { showApp(session.user); }
  else { document.getElementById('auth').style.display = 'block'; }
}

function showApp(user) {
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-email').textContent = user.email;
  loadHistory();
}

async function signUp() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signUp({ email, password });
  const msg = document.getElementById('auth-msg');
  if (error) { msg.textContent = error.message; msg.className = 'msg error'; }
  else { msg.textContent = 'Registriert! Bitte einloggen.'; msg.className = 'msg ok'; }
}

async function signIn() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  const msg = document.getElementById('auth-msg');
  if (error) { msg.textContent = error.message; msg.className = 'msg error'; }
  else { showApp(data.user); }
}

async function signOut() {
  await sb.auth.signOut();
  location.reload();
}

async function checkAnswer() {
  const answer = document.getElementById('answer').value.trim();
  const correct = answer === CORRECT_ANSWER;
  const resultMsg = document.getElementById('result-msg');

  if (correct) {
    resultMsg.textContent = 'Richtig! ✅';
    resultMsg.className = 'msg ok';
  } else {
    resultMsg.textContent = 'Leider falsch. ❌';
    resultMsg.className = 'msg error';
    hintLevel++;
    showHint();
  }

  const { data: { user } } = await sb.auth.getUser();
  await sb.from('exercise_attempts').insert({
    user_id: user.id,
    exercise_id: EXERCISE_ID,
    answer_given: answer,
    is_correct: correct
  });

  loadHistory();
}

function showHint() {
  const hintEl = document.getElementById('hint');
  // ►►► bis zu drei Hinweisstufen einsetzen
  if (hintLevel === 1) hintEl.textContent = 'Tipp: ►►► erster Hinweis';
  else if (hintLevel === 2) hintEl.textContent = 'Tipp: ►►► zweiter Hinweis';
  else if (hintLevel >= 3) hintEl.textContent = 'Lösung: ►►► Lösung ausschreiben';
}

async function loadHistory() {
  const { data: { user } } = await sb.auth.getUser();
  const { data } = await sb
    .from('exercise_attempts')
    .select('*')
    .eq('user_id', user.id)
    .order('created_at', { ascending: false });

  const list = document.getElementById('history');
  list.innerHTML = '';
  if (data) {
    data.forEach(row => {
      const li = document.createElement('li');
      li.textContent = `${row.exercise_id}: "${row.answer_given}" — ${row.is_correct ? 'richtig' : 'falsch'} (${new Date(row.created_at).toLocaleString()})`;
      list.appendChild(li);
    });
  }
}

checkSession();
</script>

</body>
</html>
