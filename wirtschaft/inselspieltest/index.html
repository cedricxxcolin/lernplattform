<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insel der Bedürfnisse</title>
<style>
:root{
  --bg1:#041b24;
  --bg2:#0b3a4d;
  --sea:#2aa9b8;
  --sea2:#1f7c9f;
  --sand:#d9b37a;
  --sand2:#b98953;
  --leaf:#2f7a57;
  --wood:#5a3522;
  --wood2:#7a4a2d;
  --gold:#f2ca7b;
  --text:#f8f2e7;
  --muted:#cbd7da;
  --good:#78d89b;
  --bad:#ff8d6d;
  --warn:#ffd76d;
  --danger:#ff5d5d;
  --panel:rgba(8,22,28,0.58);
  --panel2:rgba(255,248,235,0.08);
  --border:rgba(255,255,255,0.12);
  --shadow:0 20px 45px rgba(0,0,0,0.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#06202a 0%,#083042 38%,#0e5f79 68%,#dbb27a 100%);color:var(--text);overflow:hidden}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none}
body::before{background:
 radial-gradient(circle at 20% 20%, rgba(255,202,122,0.18), transparent 28%),
 radial-gradient(circle at 80% 18%, rgba(255,227,168,0.1), transparent 24%),
 radial-gradient(circle at 60% 80%, rgba(43,176,174,0.1), transparent 26%);
 animation:glow 12s ease-in-out infinite alternate}
body::after{background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0)),repeating-linear-gradient(90deg,rgba(255,255,255,0.02) 0 1px,transparent 1px 140px);mix-blend-mode:soft-light;opacity:.45}
@keyframes glow{0%{transform:translateY(0)}100%{transform:translateY(-18px)}}
#waves{position:fixed;left:0;right:0;bottom:0;height:26vh;pointer-events:none;overflow:hidden;opacity:.55}
.wave{position:absolute;left:-15%;width:130%;height:100%;border-radius:42%;background:radial-gradient(circle at 50% 35%,rgba(125,243,255,.18),rgba(25,103,140,.15) 45%,rgba(11,57,94,.08) 70%,transparent 72%);animation:drift 18s linear infinite}
.wave:nth-child(2){animation-duration:24s;animation-direction:reverse;opacity:.7;transform:translateY(22px)}
.wave:nth-child(3){animation-duration:31s;opacity:.4;transform:translateY(50px)}
@keyframes drift{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
#app{position:relative;height:100%;overflow:auto;padding:24px}
.screen{max-width:1320px;margin:0 auto;min-height:calc(100vh - 48px);display:none;animation:fadeIn .45s ease}
.screen.active{display:flex;flex-direction:column}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:stretch;flex:1}
.panel{background:linear-gradient(180deg,var(--panel),rgba(8,18,22,0.48));backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}
.panel.soft{background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));}
.titlePanel{padding:42px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.titlePanel::before{content:"";position:absolute;inset:auto -10% -30% auto;width:55%;height:75%;background:radial-gradient(circle at center,rgba(242,202,123,.2),transparent 60%);filter:blur(10px)}
.kicker{letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-size:12px;margin-bottom:12px}
h1{font-size:clamp(36px,6vw,74px);line-height:.94;margin:0 0 14px;font-weight:800;text-shadow:0 8px 26px rgba(0,0,0,.28)}
.subtitle{font-size:clamp(16px,2.1vw,24px);color:#ffebc4;margin-bottom:24px}
.lead{font-size:16px;line-height:1.7;color:var(--muted);max-width:760px}
.artPanel{padding:0;min-height:560px;position:relative;overflow:hidden}
.islandArt{position:absolute;inset:0;background:
 radial-gradient(circle at 68% 18%, rgba(255,209,138,.72), rgba(255,171,83,.18) 21%, transparent 36%),
 linear-gradient(180deg,rgba(255,177,86,.15),rgba(0,0,0,0)),
 linear-gradient(180deg,#0b2a37 0%,#16435d 34%,#2086a5 68%,#efc28a 100%)}
.islandArt::before{content:"";position:absolute;left:7%;right:7%;bottom:18%;height:34%;background:radial-gradient(ellipse at center,#3a6a46 0%,#214631 55%,transparent 56%), radial-gradient(ellipse at center,#264a31 0%,#173122 53%,transparent 54%);filter:blur(2px)}
.islandArt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:
 radial-gradient(ellipse at 50% 100%, #c29058 0 18%, transparent 19%),
 radial-gradient(circle at 16% 40%, rgba(255,255,255,.16), transparent 26%),
 linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0));opacity:.95}
.palm,.palm2,.palm3{position:absolute;bottom:18%;width:16px;height:210px;background:linear-gradient(180deg,#5b341c,#2d1a0e);border-radius:12px;transform-origin:bottom center;box-shadow:0 0 0 2px rgba(0,0,0,.04)}
.palm{left:18%;transform:rotate(-11deg)} .palm2{right:24%;height:170px;transform:rotate(8deg)} .palm3{right:14%;height:126px;transform:rotate(14deg)}
.fronds,.fronds2,.fronds3{position:absolute;bottom:calc(18% + 170px);width:170px;height:100px}
.fronds{left:10%}.fronds2{right:15%}.fronds3{right:7%;bottom:calc(18% + 122px)}
.leaf{position:absolute;width:100px;height:24px;border-radius:100px;background:linear-gradient(90deg,#3e8d5f,#77bb7f 46%,#25553f);transform-origin:left center;filter:drop-shadow(0 8px 8px rgba(0,0,0,.15))}
.leaf:nth-child(1){transform:rotate(-34deg)} .leaf:nth-child(2){transform:rotate(-12deg)} .leaf:nth-child(3){transform:rotate(10deg)} .leaf:nth-child(4){transform:rotate(28deg)} .leaf:nth-child(5){transform:rotate(46deg)}
.btnRow{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
button{border:none;cursor:pointer;border-radius:16px;padding:14px 20px;font-size:15px;font-weight:700;transition:.22s ease;letter-spacing:.01em}
button.primary{background:linear-gradient(180deg,#f7d494,#daa75c);color:#2c1b0f;box-shadow:0 12px 24px rgba(218,167,92,.25)}
button.primary:hover{transform:translateY(-2px);box-shadow:0 16px 28px rgba(218,167,92,.32)}
button.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.14)}
button.secondary:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
button.ghost{background:transparent;color:#f8e9cc;border:1px solid rgba(255,230,187,.28)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.titleSmall{font-size:34px;font-weight:800;margin:0}.subSmall{color:var(--muted);margin-top:6px}
.cardGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.25s ease}
.card::before{content:"";position:absolute;inset:auto -30% -35% auto;width:120px;height:120px;background:radial-gradient(circle,rgba(255,255,255,.11),transparent 60%)}
.card:hover{transform:translateY(-4px);border-color:rgba(255,224,166,.34)}
.card.selectable{cursor:pointer}
.card.selected{outline:2px solid rgba(255,209,138,.8);background:linear-gradient(180deg,rgba(255,226,177,.16),rgba(255,255,255,.06));box-shadow:0 0 0 4px rgba(255,209,138,.12),var(--shadow)}
.card.locked{opacity:.45}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);color:#f7e5bf}
.name{font-size:22px;font-weight:800;margin:10px 0 6px}
.role{color:var(--gold);font-weight:700;margin-bottom:10px}
.desc{color:var(--muted);font-size:14px;line-height:1.55}
.bonusList{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bonus{padding:6px 9px;border-radius:999px;background:rgba(120,216,155,.12);border:1px solid rgba(120,216,155,.16);font-size:12px;color:#cbeed6;font-weight:700}
.counter{padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);font-weight:700}
.layoutGame{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:start}
.leftCol,.rightCol{display:flex;flex-direction:column;gap:18px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.metricPanel{padding:16px 18px}
.metricHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.bigValue{font-size:28px}
.progress{height:12px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.fill{height:100%;width:0;border-radius:999px;transition:width .55s ease, filter .3s ease;background:linear-gradient(90deg,#79e2a1,#d8e889)}
.fill.escape{background:linear-gradient(90deg,#6fe3e7,#f8d587)}
.fill.base{background:linear-gradient(90deg,#9bd7ff,#63a4ff)}
.needsGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.needCard{padding:16px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);min-width:0}
.needTitle{font-weight:800;font-size:14px;color:#f8e8c7;display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
.subNeed{margin:10px 0}
.subNeed .label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--muted)}
.barSmall{height:9px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden}
.barSmall .fill{height:100%;transition:width .45s ease}
.statusOk{color:#def4df}.statusWarn{color:#ffe39a}.statusBad{color:#ffb390}.statusDanger{color:#ff8282}
.teamWrap{padding:18px}
.teamList{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.teamMini{padding:14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.teamMini .miniName{font-weight:800}
.teamMini .miniRole{font-size:13px;color:#f1d49b;margin-top:4px}
.actionWrap{padding:18px}
.actors{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.actorChip{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-weight:800}
.turnBox{padding:18px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.1)}
.turnTitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.actionsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.actionCard{padding:16px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.09);cursor:pointer;transition:.22s ease;position:relative}
.actionCard:hover{transform:translateY(-3px);border-color:rgba(255,223,167,.38);background:linear-gradient(180deg,rgba(255,233,180,.12),rgba(255,255,255,.04))}
.actionCard.special{box-shadow:inset 0 0 0 1px rgba(255,223,167,.16)}
.actionCard .aTitle{font-weight:800;font-size:17px;margin-bottom:8px}
.actionCard .aDesc{font-size:14px;line-height:1.55;color:var(--muted)}
.actionCard .aMood{margin-top:10px;font-size:12px;color:#f0d6a5;text-transform:uppercase;letter-spacing:.08em}
.logPanel{padding:18px;display:flex;flex-direction:column;min-height:300px;max-height:46vh}
.logHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logList{overflow:auto;padding-right:6px;display:flex;flex-direction:column;gap:10px}
.logEntry{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:14px;line-height:1.55}
.logEntry strong{color:#fff0cf}
.resultCard{padding:18px;border-radius:22px;background:linear-gradient(180deg,rgba(11,39,48,.94),rgba(8,22,28,.94));border:1px solid rgba(255,255,255,.11);box-shadow:var(--shadow);max-width:760px;width:min(92vw,760px)}
.overlay{position:fixed;inset:0;background:rgba(2,9,12,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.show{display:flex;animation:fadeIn .25s ease}
.overlayTitle{font-size:30px;font-weight:800;margin-bottom:8px;color:#ffe4ae}
.overlayText{color:var(--muted);line-height:1.7;margin-bottom:16px}
.deltaList{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.delta{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);font-weight:800}
.delta.pos{color:#cdeed7;background:rgba(120,216,155,.1);border-color:rgba(120,216,155,.18)}
.delta.neg{color:#ffbea9;background:rgba(255,141,109,.12);border-color:rgba(255,141,109,.2)}
.delta.neu{color:#e7e0d0}
.muted{color:var(--muted)}
.small{font-size:13px}
.choiceBar{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.notice{padding:12px 14px;border-radius:16px;background:rgba(255,214,109,.12);border:1px solid rgba(255,214,109,.18);color:#ffe8a9;font-size:14px;line-height:1.55}
.centerWrap{max-width:1020px;margin:auto;width:100%}
.guideLayout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.guideBox{padding:18px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1)}
.guideBox h3{margin:0 0 10px;color:#ffe6b8}
.guideBox p{margin:0;color:var(--muted);line-height:1.7}
.itemTitle{font-size:20px;font-weight:800;margin:10px 0 8px}
.itemEffects{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.itemEffects span{padding:6px 8px;border-radius:999px;background:rgba(145,189,255,.1);border:1px solid rgba(145,189,255,.15);font-size:12px;color:#d9e8ff;font-weight:700}
.endStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.endStats .card{padding:16px}
.floaters{position:fixed;inset:0;pointer-events:none;z-index:60}
.floater{position:absolute;padding:8px 10px;border-radius:999px;font-weight:800;font-size:13px;opacity:0;transform:translate(-50%,0);animation:floatUp 1.5s ease forwards;box-shadow:0 10px 18px rgba(0,0,0,.25)}
.floater.pos{background:rgba(120,216,155,.16);color:#d7f5df;border:1px solid rgba(120,216,155,.22)}
.floater.neg{background:rgba(255,141,109,.16);color:#ffd6cb;border:1px solid rgba(255,141,109,.22)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,12px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-48px)}}
.scrollY{overflow:auto}
@media (max-width:1100px){
  .hero,.layoutGame{grid-template-columns:1fr}
  .needsGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .guideLayout{grid-template-columns:1fr}
}
@media (max-width:760px){
  #app{padding:14px}
  .screen{min-height:calc(100vh - 28px)}
  .titlePanel{padding:26px}
  .artPanel{min-height:300px}
  .needsGrid{grid-template-columns:1fr}
  .hud,.endStats{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="waves"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
<div id="app"></div>
<div id="overlay" class="overlay"></div>
<div id="floaters" class="floaters"></div>
<script>
const baseNeeds={Hunger:58,Durst:52,Schutz:34,Gesundheit:62,Gemeinschaft:55,Kommunikation:48,Selbstvertrauen:46,Anerkennung:40,Lebensfreude:38,Zukunftsperspektive:42};
const mainNeedGroups=[
  {name:'Physiologische Bedürfnisse', subs:['Hunger','Durst']},
  {name:'Sicherheitsbedürfnisse', subs:['Schutz','Gesundheit']},
  {name:'Soziale Bedürfnisse', subs:['Gemeinschaft','Kommunikation']},
  {name:'Individualbedürfnisse', subs:['Selbstvertrauen','Anerkennung']},
  {name:'Selbstverwirklichung', subs:['Lebensfreude','Zukunftsperspektive']}
];
const generalActions=[
{id:'ga1',name:'Nahrung suchen',desc:'Sie durchkämmen Strand und Insel nach allem Essbaren.',mood:'konzentriert sich auf Versorgung',effects:{Hunger:10,Gesundheit:-2,Lebensfreude:-1}},
{id:'ga2',name:'Wasser suchen',desc:'Sie suchen nach frischem Wasser und sicheren Sammelstellen.',mood:'konzentriert sich auf Versorgung',effects:{Durst:12,Gesundheit:-1}},
{id:'ga3',name:'Ausruhen',desc:'Sie ziehen sich zurück, sammeln Kraft und kommen körperlich etwas zur Ruhe.',mood:'stärkt Körper und Ruhe',effects:{Gesundheit:8,Selbstvertrauen:2}},
{id:'ga4',name:'Erkunden',desc:'Sie wagen sich weiter ins Inselinnere oder an unbekannte Küstenabschnitte.',mood:'sucht Chancen und Wissen',effects:{Zukunftsperspektive:6,Lebensfreude:4,Gesundheit:-3,Flucht:4}},
{id:'ga5',name:'Feuer bewachen',desc:'Sie halten das Feuer am Leben und sichern Wärme und Sichtbarkeit.',mood:'stärkt Lager und Sicherheit',effects:{Schutz:6,Basis:4}},
{id:'ga6',name:'Lager ordnen',desc:'Sie bringen Struktur ins Lager und schaffen etwas Übersicht.',mood:'stärkt Ordnung und Zusammenhalt',effects:{Gemeinschaft:4,Schutz:4,Basis:3}},
{id:'ga7',name:'Gespräch führen',desc:'Sie nehmen sich Zeit füreinander und sprechen offen über Lage und Gefühle.',mood:'stärkt eher die Gruppe',effects:{Kommunikation:8,Gemeinschaft:6,Lebensfreude:3}},
{id:'ga8',name:'Am Strand Wache halten',desc:'Sie halten Ausschau nach Schiffen, Rauch oder anderen Zeichen.',mood:'fokussiert auf Rettung und Wille',effects:{Zukunftsperspektive:5,Selbstvertrauen:3,Flucht:5}},
{id:'ga9',name:'Spuren verfolgen',desc:'Sie folgen Hinweisen im Sand, im Gebüsch oder an Felsen.',mood:'sucht Hinweise und Orientierung',effects:{Zukunftsperspektive:4,Lebensfreude:3,Gesundheit:-2}},
{id:'ga10',name:'Material sammeln',desc:'Sie sammeln Holz, Steine, Blätter und andere nützliche Ressourcen.',mood:'baut die Basis aus',effects:{Schutz:4,Basis:6,Hunger:-2}},
{id:'ga11',name:'Kochen',desc:'Sie bereiten aus den verfügbaren Resten eine einfache Mahlzeit zu.',mood:'wärmt und verbindet',effects:{Hunger:8,Gemeinschaft:4,Lebensfreude:3}},
{id:'ga12',name:'Reparieren',desc:'Sie flicken, binden und stabilisieren, was im Lager brüchig geworden ist.',mood:'stärkt Lager und Ansehen',effects:{Schutz:6,Anerkennung:4,Basis:5}},
{id:'ga13',name:'Mut machen',desc:'Sie richten die Gruppe seelisch auf und stärken den Willen weiterzumachen.',mood:'stärkt Haltung und Hoffnung',effects:{Lebensfreude:8,Selbstvertrauen:5,Gemeinschaft:2}},
{id:'ga14',name:'Vorräte prüfen',desc:'Sie sichten Bestände und gewinnen einen besseren Überblick.',mood:'schafft Klarheit und Planung',effects:{Zukunftsperspektive:4,Anerkennung:2}},
{id:'ga15',name:'Schutz verbessern',desc:'Sie verstärken Schlafplätze, Abdeckungen und Lagergrenzen.',mood:'sichert das Lager',effects:{Schutz:10,Basis:6}},
{id:'ga16',name:'Rettungszeichen vorbereiten',desc:'Sie schaffen sichtbare Zeichen für mögliche Retter.',mood:'arbeitet auf Flucht hin',effects:{Zukunftsperspektive:8,Flucht:8}},
{id:'ga17',name:'Pflanzen untersuchen',desc:'Sie prüfen, was essbar, nützlich oder gefährlich sein könnte.',mood:'sucht Wissen und Nutzen',effects:{Gesundheit:4,Zukunftsperspektive:4,Lebensfreude:2}},
{id:'ga18',name:'Fischen',desc:'Sie versuchen, Nahrung direkt aus dem Meer zu gewinnen.',mood:'konzentriert sich auf Nahrung',effects:{Hunger:12,Selbstvertrauen:3}},
{id:'ga19',name:'Signalfeuer stärken',desc:'Sie machen das Feuer sichtbarer und zuverlässiger.',mood:'stärkt Rettung und Sichtbarkeit',effects:{Flucht:10,Schutz:3,Zukunftsperspektive:4}},
{id:'ga20',name:'Route planen',desc:'Sie denken über Wege, Zeichen, Strömungen oder Flossmöglichkeiten nach.',mood:'denkt langfristig und strategisch',effects:{Zukunftsperspektive:10,Kommunikation:3,Flucht:6}}
];
const characters=[
{name:'Mara Stein',role:'die Ärztin',desc:'Ruhig, präzise und belastbar. Mara erkennt Risiken früh und kann Verletzungen, Krankheiten und Erschöpfung besser auffangen als andere.',bonuses:{Gesundheit:18,Schutz:6,Gemeinschaft:4},preferred:['Versorgen','Heilkräuter suchen','Lagerhygiene verbessern','Beruhigen'],special:[
{name:'Versorgen',desc:'Mara kümmert sich um Wunden, Schwäche und Erschöpfung.',mood:'heilt und stabilisiert',effects:{Gesundheit:14,Gemeinschaft:4}},

function applyEffects(effects,sourceType='action'){const phys=physiologyFactor();const safe=safetyFactor();const social=socialFactor();const applied={};

      if(state.basis>70)val=Math.min(-1,raw+2);

    applied[k]=val;
    if(k==='Basis')state.basis=clamp(state.basis+val,0,100);
    else if(k==='Flucht')state.flucht=clamp(state.flucht+val,0,100);
    else state.needs[k]=clamp((state.needs[k]||0)+val,0,100);
  }
  return {applied,phys,safe,social};
}
function actionPoolForCharacter(char){
  const specials=char.special.map((a,i)=>({...a,id:`sp-${char.name}-${i}`,special:true}));
  const preferredSet=new Set(char.preferred);
  const general=generalActions.map(a=>({...a,special:preferredSet.has(a.name)}));
  const dedup=[]; const seen=new Set();
  for(const a of [...specials,...general]){if(!seen.has(a.name)){seen.add(a.name);dedup.push(a)}}
  dedup.sort((a,b)=>Number(b.special)-Number(a.special)||a.name.localeCompare(b.name,'de'));
  return dedup;
}
function chooseAction(action){
  const actor=state.actors[state.turnStep];
  const res=applyEffects(action.effects,'action');
  state.chosenActions.push({actor:actor.name,action:action.name,res});
  addLog(`${actor.name} wählt ${action.name}`);
  addLog(`Wirkung: ${summarizeDeltas(res.applied)}`);
  showResultOverlay({title:`${actor.name} handelt`,text:`${actor.name} führt ${action.name.toLowerCase()} aus. Je schlechter Hunger, Durst, Schutz und Gesundheit sind, desto schwächer können positive Wirkungen ausfallen.`,deltas:res.applied,foot:`Aktionsfaktoren in dieser Lage: Physiologie ${factorText(res.phys)}, Sicherheit ${factorText(res.safe)}, Soziales ${factorText(res.social)}`},()=>{
    state.turnStep++;
    if(state.turnStep<2){render()}else{triggerEvent()}
  })
  render()
}
function factorText(v){return `${Math.round(v*100)} Prozent`}
function summarizeDeltas(obj){return Object.entries(obj).map(([k,v])=>formatDelta(k,v)).join(', ')}
function triggerEvent(){
  const ev=events[Math.floor(Math.random()*events.length)];
  const res=applyEffects(ev.effects,'event');
  addLog(`Ereignis: ${ev.title}`);
  addLog(`Wirkung: ${summarizeDeltas(res.applied)}`);
  showResultOverlay({title:ev.title,text:ev.text,deltas:res.applied,foot:'Ereignisse wirken direkt auf die Gruppe. Schutzverluste werden bei sehr guter Basis leicht abgefedert und bei schwacher Basis verschärft.'},()=>{nightPhase()})
}
function nightPhase(){
  const night={Hunger:-7,Durst:-8,Gesundheit:-2,Lebensfreude:-2,Zukunftsperspektive:-2};
  if(state.needs.Hunger<25)night.Gesundheit=(night.Gesundheit||0)-3;
  if(state.needs.Durst<25)night.Gesundheit=(night.Gesundheit||0)-3;
  if(state.needs.Gemeinschaft<30)night.Lebensfreude=(night.Lebensfreude||0)-2;
  if(state.needs.Schutz<25)night.Gesundheit=(night.Gesundheit||0)-2;
  const res=applyEffects(night,'night');
  addLog(`Nacht: ${summarizeDeltas(res.applied)}`);
  showResultOverlay({title:'Nacht auf der Insel',text:'Auch ohne neue Krisen kostet das Überleben Kraft. Hunger, Durst und Erschöpfung zehren an der Gruppe.',deltas:res.applied,foot:'Wenn Hunger, Durst, Schutz oder Gemeinschaft kritisch sind, trifft die Nacht haerter.'},()=>{afterRound()})
}
function anyNeedZero(){return Object.values(state.needs).some(v=>v<=0)}
function afterRound(){
  render();
  if(anyNeedZero()){
    state.endType='lose';
    state.screen='end';
    render();
    return;
  }
  if(state.flucht>=100 && !state.escapeReached){
    state.escapeReached=true;
    state.lastRunCouldEscape=true;
    showEscapeChoice();
    return;
  }
  if(state.day>=state.maxDays){
    state.endType=state.lastRunCouldEscape?'stay':'survive';
    state.screen='end';
    render();
    return;
  }
  state.day++;
  pickRandomActors();
  render();
}
function showEscapeChoice(){
  const html=`<div class="resultCard"><div class="overlayTitle">Eine echte Chance auf Flucht</div><div class="overlayText">Ihre Gruppe hat eine echte Chance, die Insel zu verlassen. Möchten Sie fliehen oder auf der Insel bleiben und weiterleben?</div><div class="deltaList"><div class="delta pos">Flucht ${state.flucht}</div><div class="delta neu">Basis ${state.basis}</div></div><div class="choiceBar"><button class="primary" id="escapeNow">Fliehen</button><button class="secondary" id="stayNow">Bleiben</button></div></div>`;
  const ov=document.getElementById('overlay'); ov.innerHTML=html; ov.classList.add('show');
  document.getElementById('escapeNow').onclick=()=>{ov.classList.remove('show');state.endType='escape';state.screen='end';render()};
  document.getElementById('stayNow').onclick=()=>{ov.classList.remove('show');if(state.day>=state.maxDays){state.endType='stay';state.screen='end';render();return;}state.day++;pickRandomActors();render()};
}
function showResultOverlay({title,text,deltas,foot},onClose){
  const list=Object.entries(deltas).map(([k,v])=>`<div class="delta ${v>0?'pos':v<0?'neg':'neu'}">${k} ${v>0?'+':''}${v}</div>`).join('');
  const html=`<div class="resultCard"><div class="overlayTitle">${title}</div><div class="overlayText">${text}</div><div class="deltaList">${list}</div><div class="notice small">${foot}</div><div class="choiceBar"><button class="primary" id="ovNext">Weiter</button></div></div>`;
  const ov=document.getElementById('overlay'); ov.innerHTML=html; ov.classList.add('show');
  Object.entries(deltas).forEach(([k,v])=>spawnFloater(k,v));
  document.getElementById('ovNext').onclick=()=>{ov.classList.remove('show');if(onClose)onClose();render()}
}
function spawnFloater(label,val){
  const parent=document.getElementById('floaters');
  const el=document.createElement('div');
  el.className=`floater ${val>=0?'pos':'neg'}`;
  el.textContent=`${label} ${val>0?'+':''}${val}`;
  el.style.left=(12+Math.random()*76)+'vw';
  el.style.top=(22+Math.random()*52)+'vh';
  parent.appendChild(el);
  setTimeout(()=>el.remove(),1500)
}
function scoreLabel(){const avgNeeds=avg(Object.values(state.needs));const combo=(avgNeeds*0.72)+(state.basis*0.14)+(state.flucht*0.14);if(combo<35)return 'Sehr schwaches Überleben';if(combo<50)return 'Knappes Überleben';if(combo<67)return 'Solides Überleben';if(combo<82)return 'Starkes Überleben';return 'Beeindruckende Inselgemeinschaft'}
function endSummary(){
  const phys=avg([state.needs.Hunger,state.needs.Durst]);
  const sec=avg([state.needs.Schutz,state.needs.Gesundheit]);
  const soc=avg([state.needs.Gemeinschaft,state.needs.Kommunikation]);
  const ind=avg([state.needs.Selbstvertrauen,state.needs.Anerkennung]);
  const self=avg([state.needs.Lebensfreude,state.needs.Zukunftsperspektive]);
  const rating=scoreLabel();
  if(state.endType==='lose')return `Die Gruppe scheitert an den Bedingungen der Insel, weil ein zentrales Bedürfnis vollständig zusammengebrochen ist. Auf einer Insel reicht es nicht, Hoffnung zu spüren, wenn Hunger, Durst oder Schutz entgleiten. ${rating}.`;
  if(state.endType==='escape')return `Ihre Gruppe hat nicht nur überlebt, sondern aus Unsicherheit einen Weg zurück geschaffen. Die Flucht gelingt im Zustand von Physiologie ${Math.round(phys)}, Sicherheit ${Math.round(sec)}, Zusammenhalt ${Math.round(soc)}, Selbstbild ${Math.round(ind)} und innerer Zukunft ${Math.round(self)}. ${rating}.`;
  if(state.endType==='stay')return `Ihre Gruppe hätte die Insel verlassen können, entschied sich aber bewusst zu bleiben und die letzten Tage als Gemeinschaft zu tragen. Das Lager steht bei ${state.basis}, der Fluchtwert bei ${state.flucht}. Die Entscheidung wirkt wie ein stilles Bekenntnis zu Zusammenhalt und Selbstbestimmung. ${rating}.`;
  return `Zehn Tage sind vergangen. Die Gruppe lebt noch, nicht nur durch Nahrung und Wasser, sondern auch durch Schutz, Zusammenhalt und Zukunftssicht. Physiologie ${Math.round(phys)}, Sicherheit ${Math.round(sec)}, Soziales ${Math.round(soc)}, Individualbedürfnisse ${Math.round(ind)}, Selbstverwirklichung ${Math.round(self)}, Basis ${state.basis}, Flucht ${state.flucht}. ${rating}.`;
}
function startRun(){applyStartingBonuses();state.day=1;state.log=[];state.escapeReached=false;state.lastRunCouldEscape=false;pickRandomActors();showScreen('game')}
function toggleCharacter(name){if(state.selectedCharacters.includes(name))state.selectedCharacters=state.selectedCharacters.filter(n=>n!==name);else if(state.playerCount && state.selectedCharacters.length<state.playerCount)state.selectedCharacters.push(name);render()}
function toggleItem(name){if(state.selectedItems.includes(name))state.selectedItems=state.selectedItems.filter(n=>n!==name);else if(state.selectedItems.length<10)state.selectedItems.push(name);render()}
function mainNeedsHtml(){return mainNeedGroups.map(group=>{const vals=group.subs.map(s=>state.needs[s]);const m=Math.round(avg(vals));return `<div class="needCard"><div class="needTitle"><span>${group.name}</span><span class="${needStatus(m)}">${m}</span></div>${group.subs.map(sub=>`<div class="subNeed"><div class="label"><span>${sub}</span><span class="${needStatus(state.needs[sub])}">${safeValue(state.needs[sub])}</span></div><div class="barSmall"><div class="fill" style="width:${safeValue(state.needs[sub])}%;background:${needFillColor(state.needs[sub])}"></div></div></div>`).join('')}</div>`}).join('')}
function selectedTeam(){return state.selectedCharacters.map(getCharacter)}
function renderTitle(){return `<section class="screen active"><div class="hero"><div class="panel titlePanel"><div class="kicker">Strategisches Survival Spiel</div><h1>Insel der Bedürfnisse</h1><div class="subtitle">Überleben zwischen Mangel, Hoffnung und Entscheidung</div><div class="lead">Sie waren gemeinsam auf einem Schiff unterwegs, als ein schwerer Sturm die See aufriss. In der Nacht zerbarsten Teile des Schiffs, Wasser drang ein, Schreie hallten durch das Dunkel. In letzter Minute konnte sich Ihre Gruppe in ein Rettungsboot retten. Als der Morgen anbricht, stranden Sie erschöpft auf einer einsamen Insel mitten im Ozean. Einige Kisten aus dem Schiffbruch treiben noch in Ihre Nähe. Sie haben nur wenig Zeit, um sich zu organisieren. Welche Dinge nehmen Sie mit, wer übernimmt welche Rolle und welche Bedürfnisse sichern Sie zuerst. Nach 10 Tagen wird sich zeigen, ob Ihre Gruppe überlebt, innerlich zerbricht oder einen Weg zurück in die Zivilisation findet.</div><div class="btnRow"><button class="primary" onclick="showScreen('guide')">Spiel starten</button></div></div><div class="panel artPanel"><div class="islandArt"></div><div class="palm"></div><div class="palm2"></div><div class="palm3"></div><div class="fronds">${leafSet()}</div><div class="fronds2">${leafSet()}</div><div class="fronds3">${leafSet()}</div></div></div></section>`}
function leafSet(){return '<div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div>'}
function renderGuide(){return `<section class="screen active"><div class="centerWrap"><div class="panel titlePanel" style="min-height:auto"><div class="kicker">Kurze Anleitung</div><h2 class="titleSmall">Wie Sie Ihre Inselgruppe führen</h2><div class="subSmall">Ein kurzer Blick auf Ziel, Ablauf und das fragile Gleichgewicht der Bedürfnisse</div><div style="height:18px"></div><div class="guideLayout"><div class="guideBox"><h3>Ziel des Spiels</h3><p>Ihre Gruppe muss zehn Tage auf der Insel überstehen. Sie können auf Rettung hinarbeiten und fliehen, oder bis zum Ende so gut wie möglich überleben. Entscheidend ist nicht nur Nahrung und Wasser, sondern das gesamte Gleichgewicht der Bedürfnisse.</p></div><div class="guideBox"><h3>Ablauf pro Tag</h3><p>Jeden Tag handeln genau zwei zufällig ausgewählte Figuren aus Ihrem Team. Beide wählen je eine Aktion. Danach trifft ein Zufallsereignis die Gruppe, anschliessend folgt die Nacht, in der Hunger, Durst und Erschöpfung automatisch zunehmen.</p></div><div class="guideBox"><h3>Was besonders wichtig ist</h3><p>Hunger und Durst sind die tiefsten Grundbedürfnisse. Wenn diese Werte sinken, werden selbst gute Aktionen spürbar schwächer. Auch Schutz, Gesundheit und sozialer Zusammenhalt beeinflussen, wie handlungsfähig Ihre Gruppe noch ist.</p></div><div class="guideBox"><h3>Die zentrale Idee</h3><p>Wenn die Basis bröckelt, leidet alles darüber. Tiefe Grundbedürfnisse verschlechtern die Handlungsfähigkeit der Gruppe. Wer unten versagt, verliert oft auch oben an Hoffnung, Selbstvertrauen und Zukunftssicht.</p></div></div><div class="choiceBar"><button class="primary" onclick="showScreen('characters')">Weiter zur Charakterwahl</button><button class="secondary" onclick="showScreen('title')">Zurück</button></div></div></div></section>`}
function renderCharacterSelect(){return `<section class="screen active"><div class="topbar"><div><h2 class="titleSmall">Charakterwahl</h2><div class="subSmall">Wählen Sie zuerst die Gruppengroesse und dann genau ${state.playerCount||'3 oder 4'} verschiedene Charaktere</div></div><div class="counter">Ausgewählt ${state.selectedCharacters.length}${state.playerCount?` von ${state.playerCount}`:''}</div></div><div class="panel soft" style="padding:18px;margin-bottom:18px"><div class="choiceBar" style="margin-top:0"><button class="${state.playerCount===3?'primary':'secondary'}" onclick="state.playerCount=3;state.selectedCharacters=state.selectedCharacters.slice(0,3);render()">3 Spieler</button><button class="${state.playerCount===4?'primary':'secondary'}" onclick="state.playerCount=4;render()">4 Spieler</button><button class="ghost" onclick="showScreen('guide')">Zurück</button></div><div class="notice" style="margin-top:14px">Heute beginnt alles mit Menschen, nicht mit Dingen. Jede Figur bringt eigene Stärken, Startboni und Spezialaktionen mit.</div></div><div class="cardGrid scrollY">${characters.map(ch=>{const selected=state.selectedCharacters.includes(ch.name);const locked=!selected && state.playerCount && state.selectedCharacters.length>=state.playerCount;return `<div class="card selectable ${selected?'selected':''} ${locked?'locked':''}" onclick="${locked?'':`toggleCharacter(${JSON.stringify(ch.name)})`}"><div class="badge">${selected?'Ausgewählt':'Charakter'}</div><div class="name">${ch.name}</div><div class="role">${ch.role}</div><div class="desc">${ch.desc}</div><div class="bonusList">${Object.entries(ch.bonuses).map(([k,v])=>`<span class="bonus">${k} +${v}</span>`).join('')}</div></div>`}).join('')}</div><div class="btnRow"><button class="primary" ${state.playerCount&&state.selectedCharacters.length===state.playerCount?'':'disabled'} onclick="showScreen('items')">Weiter zur Ausruestung</button></div></section>`}
function renderItems(){const team=selectedTeam();return `<section class="screen active"><div class="topbar"><div><h2 class="titleSmall">Gegenstandsauswahl</h2><div class="subSmall">Wählen Sie genau 10 von 20 Gegenständen aus dem Wrackgut</div></div><div class="counter">Ausgewählt ${state.selectedItems.length} von 10</div></div><div class="panel soft" style="padding:18px;margin-bottom:18px"><div class="notice">Gewähltes Team: ${team.map(t=>t.name).join(', ')}. Die Startboni der Gegenstände wirken nur zu Beginn und können eine frühe Krise auffangen.</div></div><div class="cardGrid scrollY">${items.map(it=>{const selected=state.selectedItems.includes(it.name);const locked=!selected && state.selectedItems.length>=10;return `<div class="card selectable ${selected?'selected':''} ${locked?'locked':''}" onclick="${locked?'':`toggleItem(${JSON.stringify(it.name)})`}"><div class="badge">${selected?'Gesichert':'Wrackfund'}</div><div class="itemTitle">${it.name}</div><div class="itemEffects">${Object.entries(it.effects).map(([k,v])=>`<span>${k} +${v}</span>`).join('')}</div></div>`}).join('')}</div><div class="btnRow"><button class="secondary" onclick="showScreen('characters')">Zurück</button><button class="primary" ${state.selectedItems.length===10?'':'disabled'} onclick="startRun()">Spiel beginnen</button></div></section>`}
function renderGame(){const actor=state.actors[state.turnStep];const pool=actor?actionPoolForCharacter(actor):[];return `<section class="screen active"><div class="topbar"><div><h2 class="titleSmall">Tag ${state.day} von ${state.maxDays}</h2><div class="subSmall">Heute handeln ${state.actors.map(a=>a.name).join(' und ')}</div></div><div class="counter">${state.turnStep===0?'Erste Aktion':'Zweite Aktion'}${actor?`: ${actor.name}`:''}</div></div><div class="layoutGame"><div class="leftCol"><div class="hud"><div class="panel metricPanel"><div class="metricHead"><span>Flucht</span><span class="bigValue">${state.flucht}</span></div><div class="progress"><div class="fill escape" style="width:${state.flucht}%"></div></div><div class="subSmall" style="margin-top:10px">Rettungszeichen, Routen und Signale bringen Sie naeher an eine echte Chance.</div></div><div class="panel metricPanel"><div class="metricHead"><span>Basis</span><span class="bigValue">${state.basis}</span></div><div class="progress"><div class="fill base" style="width:${state.basis}%"></div></div><div class="subSmall" style="margin-top:10px">Eine starke Basis federt Schutzverluste ab und macht Krisen ertraeglicher.</div></div></div><div class="panel" style="padding:18px"><div class="metricHead" style="margin-bottom:14px"><span>Maslow auf der Insel</span><span class="badge">Jeder Unterwert kann das Ende bedeuten</span></div><div class="needsGrid">${mainNeedsHtml()}</div></div><div class="panel teamWrap"><div class="metricHead" style="margin-bottom:14px"><span>Ihr Team</span><span class="badge">${state.team.length} Personen</span></div><div class="teamList">${state.team.map(ch=>`<div class="teamMini"><div class="miniName">${ch.name}</div><div class="miniRole">${ch.role}</div></div>`).join('')}</div></div></div><div class="rightCol"><div class="panel actionWrap"><div class="turnTitle"><div><div class="badge">Aktionsphase</div><div class="name" style="font-size:28px;margin:10px 0 0">${actor?actor.name:''}</div><div class="role">${actor?actor.role:''}</div></div><div class="actors">${state.actors.map((a,i)=>`<div class="actorChip" style="opacity:${i===state.turnStep?1:.5}">${a.name}</div>`).join('')}</div></div><div class="notice" style="margin-bottom:14px">Vor der Wahl sehen Sie nur Titel, Stimmung und Beschreibung. Die echten Zahlen zeigen sich erst nach der Entscheidung.</div><div class="actionsGrid">${pool.map(a=>`<div class="actionCard ${a.special?'special':''}" onclick="chooseAction(actionPoolForCharacter(state.actors[state.turnStep]).find(x=>x.name===${JSON.stringify(a.name)}))"><div class="aTitle">${a.name}</div><div class="aDesc">${a.desc}</div><div class="aMood">${a.special?'charaktertypisch':'allgemein'} · ${a.mood}</div></div>`).join('')}</div></div><div class="panel logPanel"><div class="logHeader"><span class="metricHead" style="margin:0"><span>Rundenlog</span></span><button class="secondary" onclick="state.log=[];render()">Log leeren</button></div><div class="logList">${state.log.map(l=>`<div class="logEntry">${l.text}</div>`).join('')}</div></div></div></div></section>`}
function renderEnd(){const avgAll=Math.round(avg(Object.values(state.needs)));return `<section class="screen active"><div class="centerWrap"><div class="panel titlePanel"><div class="kicker">Abschluss</div><h2 class="titleSmall">${state.endType==='lose'?'Die Insel gewinnt':state.endType==='escape'?'Die Rettung gelingt':state.endType==='stay'?'Sie bleiben bewusst':'Zehn Tage überlebt'}</h2><div class="subtitle" style="margin-top:8px">${scoreLabel()}</div><div class="lead">${endSummary()}</div><div class="endStats"><div class="card"><div class="badge">Durchschnitt</div><div class="name" style="font-size:34px">${avgAll}</div><div class="desc">Mittelwert aller 10 Unterbedürfnisse am Ende</div></div><div class="card"><div class="badge">Basis</div><div class="name" style="font-size:34px">${state.basis}</div><div class="desc">Stabilitaet von Lager, Schutz und Infrastruktur</div></div><div class="card"><div class="badge">Flucht</div><div class="name" style="font-size:34px">${state.flucht}</div><div class="desc">Fortschritt Richtung Rettung oder Ausweg</div></div></div><div class="panel soft" style="padding:18px;margin-top:18px"><div class="needsGrid">${mainNeedGroups.map(group=>{const m=Math.round(avg(group.subs.map(s=>state.needs[s])));return `<div class="needCard"><div class="needTitle"><span>${group.name}</span><span>${m}</span></div>${group.subs.map(sub=>`<div class="subNeed"><div class="label"><span>${sub}</span><span>${safeValue(state.needs[sub])}</span></div><div class="barSmall"><div class="fill" style="width:${safeValue(state.needs[sub])}%;background:${needFillColor(state.needs[sub])}"></div></div></div>`).join('')}</div>`}).join('')}</div></div><div class="btnRow"><button class="primary" onclick="resetGame()">Neu starten</button></div></div></div></section>`}
function render(){
  state.team=selectedTeam();
  let html='';
  if(state.screen==='title')html=renderTitle();
  if(state.screen==='guide')html=renderGuide();
  if(state.screen==='characters')html=renderCharacterSelect();
  if(state.screen==='items')html=renderItems();
  if(state.screen==='game')html=renderGame();
  if(state.screen==='end')html=renderEnd();
  app.innerHTML=html;
}
window.showScreen=showScreen;
window.toggleCharacter=toggleCharacter;
window.toggleItem=toggleItem;
window.startRun=startRun;
window.resetGame=resetGame;
window.chooseAction=chooseAction;
window.state=state;
window.actionPoolForCharacter=actionPoolForCharacter;
render();
</script>
</body>
</html>
