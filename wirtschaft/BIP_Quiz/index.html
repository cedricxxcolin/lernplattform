<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIP Quiz Master</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --error: #ef4444;
            --gold: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .container {
            width: 95%;
            max-width: 800px;
            padding: 2rem;
            margin: 1rem;
            transition: all 0.4s ease;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 {
            margin-bottom: 1.5rem;
            text-align: center;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1.1rem;
            outline: none;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .emoji-item {
            font-size: 2rem;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .emoji-item.selected {
            background: var(--primary);
            border-color: white;
            transform: scale(1.1);
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            text-align: center;
            width: 100%;
            margin-bottom: 0.5rem;
        }

        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .btn-secondary { background: var(--glass-bg); color: white; border: 1px solid var(--glass-border); }
        .btn-success { background: var(--success); color: white; }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .level-card {
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .level-card.completed {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            cursor: default;
        }

        .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--primary);
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .leaderboard-item.first-place {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--gold);
            border-radius: 12px;
            margin: 5px 0;
            color: var(--gold);
            font-weight: bold;
        }

        .leaderboard-item.me { background: rgba(99, 102, 241, 0.2); font-weight: bold; border-radius: 8px; }

        .progress-container { width: 100%; height: 10px; background: rgba(0, 0, 0, 0.3); border-radius: 5px; margin-bottom: 2rem; }
        .progress-bar { height: 100%; background: var(--primary); border-radius: 5px; transition: width 0.3s; }

        .question-box { font-size: 1.2rem; margin-bottom: 2rem; text-align: center; }
        .formula { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 1rem; text-align: center; font-family: monospace; }

        .feedback { margin-top: 1.5rem; padding: 1.5rem; border-radius: 16px; display: none; text-align: center; }
        .streak-pill { background: var(--secondary); padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; animation: pulse 1s infinite alternate; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        .input-row { display: flex; gap: 10px; margin-bottom: 1rem; }
        .toggle-btn { flex: 1; padding: 1rem; border: 1px solid var(--glass-border); border-radius: 12px; background: rgba(255, 255, 255, 0.05); cursor: pointer; color: white; font-weight: bold; }
        .toggle-btn.active { background: var(--primary); border-color: white; }
    </style>
</head>
<body>

<div class="container glass">
    <!-- LOGIN SCREEN -->
    <div id="screen-login" class="screen active">
        <h1>BIP Quiz Master</h1>
        <div class="input-group"><input type="text" id="user-name" placeholder="Ihr Name..." autocomplete="off"></div>
        <div class="emoji-grid" id="emoji-picker">
            <div class="emoji-item" onclick="selectEmoji('🎓', this)">🎓</div>
            <div class="emoji-item" onclick="selectEmoji('📈', this)">📈</div>
            <div class="emoji-item" onclick="selectEmoji('💰', this)">💰</div>
            <div class="emoji-item" onclick="selectEmoji('🏢', this)">🏢</div>
            <div class="emoji-item" onclick="selectEmoji('🚀', this)">🚀</div>
            <div class="emoji-item" onclick="selectEmoji('🕵️', this)">🕵️</div>
            <div class="emoji-item" onclick="selectEmoji('⚙️', this)">⚙️</div>
            <div class="emoji-item" onclick="selectEmoji('🌍', this)">🌍</div>
        </div>
        <button class="btn btn-primary" onclick="startGame()">Spiel starten</button>
    </div>

    <!-- MAIN MENU -->
    <div id="screen-menu" class="screen">
        <div class="user-bar">
            <div><span id="display-avatar"></span> <strong id="display-name"></strong></div>
            <div>Pkt: <span id="display-score">0</span> | Streak: <span id="display-streak">0</span></div>
        </div>
        <h2>Levelauswahl</h2>
        <div class="level-grid" id="level-list"></div>
        <h3>Bestenliste</h3>
        <div class="leaderboard glass" id="leaderboard-container"></div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <button class="btn btn-secondary" style="width:auto;" onclick="exitLevel()">← Menü</button>
            <div id="level-title" style="font-weight:bold;"></div>
            <div id="score-live"></div>
        </div>
        <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="streak-display" style="display:none; justify-content:center; margin-bottom:1rem;">
            <div class="streak-pill">🔥 Streak: <span id="streak-val">0</span> (+<span id="bonus-val">0</span>)</div>
        </div>
        <div class="question-box" id="question-text"></div>
        <div id="formula-box" class="formula" style="display:none;">BIP = C + I + G + (X - M)</div>
        <div id="answer-area"></div>
        <div id="feedback" class="feedback glass">
            <h3 id="feedback-title"></h3>
            <p id="feedback-text"></p>
            <div id="points-breakdown"></div>
            <button class="btn btn-primary" onclick="nextQuestion()">Weiter</button>
        </div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="screen-success" class="screen">
        <div style="text-align:center;">
            <h1>🎉</h1>
            <h2>Level Abgeschlossen!</h2>
            <div class="glass" style="padding:1.5rem; margin:2rem 0;">
                <p>Gesamtpunkte: <span id="success-total-score">0</span></p>
            </div>
            <button class="btn btn-primary" onclick="showScreen('menu')">Hauptmenü</button>
        </div>
    </div>
</div>

<script>
    const levels = [
        {
            id: 1, title: "BIP oder nicht?", pointsPerQuestion: 50, type: "binary",
            questions: [
                { q: "Sie kaufen ein neues Auto in der Schweiz.", a: "Ja", info: "Neues inländisches Gut, zählt zum BIP." },
                { q: "Sie verkaufen Ihr gebrauchtes Velo privat.", a: "Nein", info: "Gebrauchtes Gut, zählt nicht neu zur Produktion." },
                { q: "Eine Firma baut eine neue Produktionshalle.", a: "Ja", info: "Investition in neue Produktion, zählt zum BIP." },
                { q: "Eine Person arbeitet schwarz als Babysitter.", a: "Nein", info: "Schwarzarbeit ist nicht offiziell erfasst." },
                { q: "Der Staat bezahlt Arbeitslosengeld.", a: "Nein", info: "Transferzahlung, keine Produktion." },
                { q: "Sie kaufen ein Smartphone aus dem Ausland.", a: "Ja", info: "Import beeinflusst das BIP über Konsum, zählt in der Verwendungsrechnung." },
                { q: "Eine Bäckerei produziert Brot, verkauft es aber erst später.", a: "Ja", info: "Produktion auf Lager zählt zum BIP." },
                { q: "Sie putzen Ihre Wohnung selbst.", a: "Nein", info: "Unbezahlte Eigenleistung zählt nicht." }
            ]
        },
        {
            id: 2, title: "Zuordnung", pointsPerQuestion: 50, type: "choice", options: ["Konsum", "Investitionen", "Staatsausgaben", "Nettoexporte"],
            questions: [
                { q: "Sie kaufen ein neues Sofa.", a: "Konsum", info: "Privater Konsum (C)" },
                { q: "Der Staat baut eine neue Schule.", a: "Staatsausgaben", info: "Staatliche Ausgabe (G)" },
                { q: "Eine Firma kauft Maschinen.", a: "Investitionen", info: "Investition in Produktionsmittel (I)" },
                { q: "Sie kaufen ein Auto aus Deutschland.", a: "Nettoexporte", info: "Import, Teil der Nettoexporte (X-M)" },
                { q: "Ein französischer Tourist gibt Geld in der Schweiz aus.", a: "Nettoexporte", info: "Export von Dienstleistungen" },
                { q: "Eine Firma produziert auf Lager.", a: "Investitionen", info: "Lagerinvestition zählt zu I" },
                { q: "Die Armee kauft Fahrzeuge.", a: "Staatsausgaben", info: "Staatliche Ausgabe (G)" },
                { q: "Ein Schweizer Unternehmen exportiert Uhren.", a: "Nettoexporte", info: "Export (X)" }
            ]
        },
        {
            id: 3, title: "Berechnung", pointsPerQuestion: 100, type: "math",
            questions: [
                { q: "C = 500, I = 200, G = 300, X = 150, M = 100", a: 1050, info: "500 + 200 + 300 + (150 - 100) = 1050" },
                { q: "C = 800, I = 100, G = 200, X = 50, M = 120", a: 1030, info: "800 + 100 + 200 + (50 - 120) = 1030" },
                { q: "C = 600, I = 300, G = 400, X = 200, M = 200", a: 1300, info: "600 + 300 + 400 + (200 - 200) = 1300" },
                { q: "C = 1000, I = 250, G = 350, X = 300, M = 150", a: 1750, info: "1000 + 250 + 350 + (300 - 150) = 1750" },
                { q: "C = 450, I = 150, G = 200, X = 100, M = 50", a: 850, info: "450 + 150 + 200 + (100 - 50) = 850" },
                { q: "C = 900, I = 400, G = 300, X = 200, M = 300", a: 1500, info: "900 + 400 + 300 + (200 - 300) = 1500" }
            ]
        },
        {
            id: 4, title: "Spezialfälle", pointsPerQuestion: 100, type: "complex",
            questions: [
                { q: "Konsum steigt um 400'000 CHF, Unternehmen investieren 300'000 CHF, Importe steigen um 250'000 CHF, Exporte steigen um 150'000 CHF. Wie gross ist die Veränderung des BIP?", a: 600000, sign: "plus", info: "400k + 300k + (150k - 250k) = 600k." },
                { q: "Exporte sinken um 500'000 CHF, Importe steigen um 200'000 CHF, der Staat erhöht seine Ausgaben um 100'000 CHF. Wie stark verändert sich das BIP?", a: 600000, sign: "minus", info: "-500k (Exporte) - 200k (Importe) + 100k (Staat) = -600k." },
                { q: "Autounfall: Reparaturkosten 10'000 CHF, Versicherung zahlt 10'000 CHF, Polizeieinsatz kostet den Staat 2'000 CHF. Wie stark verändert sich das BIP insgesamt?", a: 12000, sign: "plus", info: "Reparatur (10k) + Staat (2k) = 12k. Versicherung ist nur Transfer." },
                { q: "Produktion: 1'000'000 CHF, Verkauf: 700'000 CHF, Lagerzunahme: 300'000 CHF, Importierte Maschinen: 200'000 CHF. BIP Effekt?", a: 800000, sign: "plus", info: "Gesamtproduktion (1 Mio.) - Import (200k) = 800k." },
                { q: "Konsum sinkt um 300'000 CHF, Investitionen steigen um 100'000 CHF, Importe steigen um 250'000 CHF, Exporte bleiben unverändert. Wie stark verändert sich das BIP?", a: 450000, sign: "minus", info: "-300k (Konsum) + 100k (Invest) - 250k (Import) = -450k." },
                { q: "Ausländische Touristen geben 500'000 CHF in CH aus, Schweizer geben 200'000 CHF im Ausland aus, Staat investiert 100'000 CHF in Infrastruktur. BIP Effekt?", a: 400000, sign: "plus", info: "Nettoexporte (500k-200k=300k) + Staat (100k) = 400k." }
            ]
        }
    ];

    const fakeLeaderboard = [
        { name: "Benjamin Banker", emoji: "💰", score: 4000 },
        { name: "Susi Steuer", emoji: "👩‍💼", score: 3800 },
        { name: "Karl Konsum", emoji: "🛒", score: 3550 },
        { name: "Inge Invest", emoji: "🏗️", score: 3200 },
        { name: "Gabi Gewinn", emoji: "💸", score: 2800 },
        { name: "Berti Bilanz", emoji: "📊", score: 2100 },
        { name: "Markt Mechthild", emoji: "🏪", score: 1400 },
        { name: "Zins-Zilli", emoji: "📉", score: 800 }
    ];

    let state = { name: "", emoji: "", totalScore: 0, streak: 0, completedLevels: [], levelProgress: {}, currentLevel: null, currentQuestionIndex: 0 };
    let selectedEmojiStr = "🎓";

    window.onload = () => {
        const saved = localStorage.getItem('bip_quiz_state_v2');
        if (saved) { state = JSON.parse(saved); if (state.name) showScreen('menu'); }
    };

    function saveState() { localStorage.setItem('bip_quiz_state_v2', JSON.stringify(state)); }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + id).classList.add('active');
        if (id === 'menu') updateMenu();
    }

    function selectEmoji(emoji, el) {
        selectedEmojiStr = emoji;
        document.querySelectorAll('.emoji-item').forEach(item => item.classList.remove('selected'));
        el.classList.add('selected');
    }

    function startGame() {
        const name = document.getElementById('user-name').value.trim();
        if (!name) return alert("Name fehlt!");
        state.name = name; state.emoji = selectedEmojiStr;
        saveState(); showScreen('menu');
    }

    function updateMenu() {
        document.getElementById('display-name').innerText = state.name;
        document.getElementById('display-avatar').innerText = state.emoji;
        document.getElementById('display-score').innerText = state.totalScore;
        document.getElementById('display-streak').innerText = state.streak;

        const list = document.getElementById('level-list');
        list.innerHTML = '';
        levels.forEach(lvl => {
            const completed = state.completedLevels.includes(lvl.id);
            const card = document.createElement('div');
            card.className = `level-card glass ${completed ? 'completed' : ''}`;
            card.innerHTML = `${completed ? '<span class="badge">Erledigt</span>' : ''}<h3>Lvl ${lvl.id}</h3><p>${lvl.title}</p>`;
            if (!completed) card.onclick = () => startLevel(lvl.id);
            list.appendChild(card);
        });

        const lb = document.getElementById('leaderboard-container');
        lb.innerHTML = '';
        const all = [...fakeLeaderboard, { name: state.name, emoji: state.emoji, score: state.totalScore, me: true }];
        all.sort((a, b) => b.score - a.score);
        all.forEach((p, i) => {
            const item = document.createElement('div');
            item.className = `leaderboard-item ${i === 0 ? 'first-place' : ''} ${p.me ? 'me' : ''}`;
            item.innerHTML = `<span>${i === 0 ? '🏆' : i + 1 + '.'} ${p.emoji} ${p.name}</span><span>${p.score.toLocaleString()} Pkt.</span>`;
            lb.appendChild(item);
        });
    }

    function startLevel(id) {
        state.currentLevel = levels.find(l => l.id === id);
        state.currentQuestionIndex = state.levelProgress[id] || 0;
        showScreen('quiz'); renderQuestion();
    }

    function exitLevel() { showScreen('menu'); }

    function parseNum(v) { return parseInt(v.toString().replace(/['\s,]/g, '')) || 0; }

    function renderQuestion() {
        const lvl = state.currentLevel; const q = lvl.questions[state.currentQuestionIndex];
        document.getElementById('level-title').innerText = `Level ${lvl.id}`;
        document.getElementById('score-live').innerText = `${state.totalScore} Pkt.`;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('answer-area').style.display = 'block';
        document.getElementById('progress-bar').style.width = (state.currentQuestionIndex / lvl.questions.length * 100) + '%';
        document.getElementById('formula-box').style.display = (lvl.id >= 3) ? 'block' : 'none';

        const sd = document.getElementById('streak-display');
        if (state.streak > 0) {
            sd.style.display = 'flex';
            document.getElementById('streak-val').innerText = state.streak;
            document.getElementById('bonus-val').innerText = state.streak * 10;
        } else sd.style.display = 'none';

        const area = document.getElementById('answer-area'); area.innerHTML = '';
        if (lvl.type === 'binary') {
            ['Ja', 'Nein'].forEach(txt => {
                const b = document.createElement('button'); b.className = "btn btn-primary"; b.innerText = txt;
                b.onclick = () => check(txt); area.appendChild(b);
            });
        } else if (lvl.type === 'choice') {
            lvl.options.forEach(opt => {
                const b = document.createElement('button'); b.className = "btn btn-secondary"; b.innerText = opt;
                b.onclick = () => check(opt); area.appendChild(b);
            });
        } else if (lvl.type === 'math') {
            const i = document.createElement('input'); i.type = "text"; i.placeholder = "Ergebnis...";
            const b = document.createElement('button'); b.className = "btn btn-primary"; b.innerText = "Prüfen";
            b.onclick = () => check(i.value); area.appendChild(i); area.appendChild(b);
        } else if (lvl.type === 'complex') {
            let sign = "plus";
            const row = document.createElement('div'); row.className = "input-row";
            const bp = document.createElement('button'); bp.className = "toggle-btn active"; bp.innerText = "+ Plus";
            const bm = document.createElement('button'); bm.className = "toggle-btn"; bm.innerText = "- Minus";
            bp.onclick = () => { sign = "plus"; bp.className = "toggle-btn active"; bm.className = "toggle-btn"; };
            bm.onclick = () => { sign = "minus"; bm.className = "toggle-btn active"; bp.className = "toggle-btn"; };
            row.appendChild(bp); row.appendChild(bm);
            const i = document.createElement('input'); i.type = "text"; i.placeholder = "Betrag...";
            const b = document.createElement('button'); b.className = "btn btn-primary"; b.innerText = "Prüfen";
            b.onclick = () => check({ sign, val: i.value }); area.appendChild(row); area.appendChild(i); area.appendChild(b);
        }
    }

    function check(user) {
        const lvl = state.currentLevel; const q = lvl.questions[state.currentQuestionIndex];
        let correct = false;
        if (lvl.type === 'binary' || lvl.type === 'choice') correct = (user === q.a);
        else if (lvl.type === 'math') correct = (parseNum(user) === q.a);
        else if (lvl.type === 'complex') correct = (user.sign === q.sign && parseNum(user.val) === q.a);

        document.getElementById('answer-area').style.display = 'none';
        const fb = document.getElementById('feedback'); fb.style.display = 'block';
        const pbs = document.getElementById('points-breakdown');

        if (correct) {
            let bonus = (state.streak >= 1) ? state.streak * 10 : 0;
            state.totalScore += (lvl.pointsPerQuestion + bonus);
            state.streak++;
            document.getElementById('feedback-title').innerText = "Richtig! ✅";
            pbs.innerHTML = `+${lvl.pointsPerQuestion} Basis ${bonus > 0 ? '+ ' + bonus + ' Streak-Bonus' : ''}`;
        } else {
            state.streak = 0;
            document.getElementById('feedback-title').innerText = "Falsch! ❌";
            pbs.innerHTML = `Lösung: ${lvl.type === 'complex' ? (q.sign === 'plus' ? '+' : '-') : ''}${q.a}`;
        }
        document.getElementById('feedback-text').innerText = q.info;
        saveState();
    }

    function nextQuestion() {
        state.currentQuestionIndex++;
        if (state.currentQuestionIndex >= state.currentLevel.questions.length) {
            state.completedLevels.push(state.currentLevel.id);
            delete state.levelProgress[state.currentLevel.id];
            saveState(); showScreen('success');
            document.getElementById('success-total-score').innerText = state.totalScore;
        } else {
            state.levelProgress[state.currentLevel.id] = state.currentQuestionIndex;
            saveState(); renderQuestion();
        }
    }
</script>
</body>
</html>
